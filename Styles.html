        align-items: flex-start;
    }
    .agent-stats-strip {
        width: 100%;
        justify-content: space-between;
    }
}

/* ======================================================== */
/* ADMIN MODAL DIALOG STYLES */
/* ======================================================== */
.admin-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 15, 29, 0.82);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeInModal 0.2s ease-out;
}

@keyframes fadeInModal {
    from { opacity: 0; transform: scale(0.98); }
    to { opacity: 1; transform: scale(1); }
}

.admin-modal-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    width: 100%;
    max-width: 860px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(var(--blue-rgb), 0.15);
    display: flex;
    flex-direction: column;
    direction: rtl;
    text-align: right;
    font-family: 'Cairo', system-ui, -apple-system, sans-serif;
}

.admin-modal-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 24px 28px 20px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(135deg, var(--panel-sub), var(--panel-sub));
}

.admin-header-title-wrap h2 {
    font-size: 20px;
    font-weight: 800;
    color: var(--text);
    margin: 6px 0 4px;
}

.admin-header-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 9999px;
    background: rgba(var(--blue-rgb), 0.15);
    color: var(--blue);
    border: 1px solid rgba(var(--blue-rgb), 0.3);
    letter-spacing: 0.5px;
    display: inline-block;
}

.admin-subtitle {
    font-size: 13px;
    color: var(--muted);
}

.admin-btn-close {
    background: rgba(var(--ink-rgb), 0.05);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 18px;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
}

.admin-btn-close:hover {
    background: rgba(239, 68, 68, 0.15);
    border-color: #ef4444;
    color: #ef4444;
}

.admin-modal-body {
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.admin-info-alert {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(var(--blue-rgb), 0.08);
    border: 1px solid rgba(var(--blue-rgb), 0.25);
    border-radius: 12px;
    padding: 14px 18px;
    color: var(--text-sub);
    font-size: 13px;
    line-height: 1.5;
}

.admin-info-icon {
    font-size: 22px;
    flex-shrink: 0;
}

.admin-input-card {
    background: var(--panel-sub);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.admin-input-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.admin-input-header label {
    font-weight: 700;
    font-size: 14px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
}

.admin-input-actions {
    display: flex;
    gap: 8px;
}

.admin-btn-outline {
    background: rgba(var(--ink-rgb), 0.05);
    border: 1px solid #475569;
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
}

.admin-btn-outline:hover {
    background: rgba(var(--blue-rgb), 0.15);
    border-color: var(--blue);
    color: var(--blue);
}

.admin-btn-ghost {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 10px;
    cursor: pointer;
    transition: color 0.2s;
}

.admin-btn-ghost:hover {
    color: #ef4444;
}

.admin-textarea {
    width: 100%;
    min-height: 180px;
    max-height: 320px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    padding: 12px 14px;
    direction: ltr;
    text-align: left;
    resize: vertical;
    outline: none;
    transition: border-color 0.2s;
    line-height: 1.5;
}

.admin-textarea:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(var(--blue-rgb), 0.2);
}

.admin-preview-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.admin-prev-card {
    background: var(--panel-sub);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    text-align: center;
}

.admin-prev-label {
    font-size: 11.5px;
    color: var(--muted);
    font-weight: 600;
}

.admin-prev-value {
    font-size: 20px;
    font-weight: 800;
    color: var(--blue);
    font-family: 'JetBrains Mono', monospace;
}

.admin-prev-status {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
}

.admin-options-card {
    background: var(--panel-sub);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.admin-checkbox-label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--text-sub);
    cursor: pointer;
}

.admin-checkbox-label input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--blue);
    cursor: pointer;
}

.admin-status-box {
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    line-height: 1.6;
    white-space: pre-line;
    font-weight: 600;
    animation: fadeInModal 0.2s ease-out;
}

.admin-status-box.loading {
    background: rgba(var(--blue-rgb), 0.12);
    border: 1px solid rgba(var(--blue-rgb), 0.4);
    color: var(--blue);
}

.admin-status-box.success {
    background: rgba(var(--accent-rgb), 0.12);
    border: 1px solid rgba(var(--accent-rgb), 0.4);
    color: var(--accent);
}

.admin-status-box.error {
    background: rgba(239, 68, 68, 0.12);
    border: 1px solid rgba(239, 68, 68, 0.4);
    color: var(--danger);
}

.admin-modal-actions {
    display: flex;
    gap: 12px;
    margin-top: 4px;
}

.admin-btn-primary {
    flex: 2;
    background: linear-gradient(135deg, #0284c7, var(--blue));
    border: none;
    color: var(--text);
    font-weight: 700;
    font-size: 14px;
    padding: 14px 20px;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
    transition: all 0.2s;
    font-family: inherit;
}

.admin-btn-primary:hover:not(:disabled) {
    box-shadow: 0 6px 20px rgba(var(--blue-rgb), 0.6);
    transform: translateY(-1px);
}

.admin-btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    box-shadow: none;
}

.admin-btn-secondary {
    flex: 1;
    background: rgba(var(--ink-rgb), 0.05);
    border: 1px solid #475569;
    color: var(--text-sub);
    font-weight: 600;
    font-size: 13.5px;
    padding: 14px 16px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
}

.admin-btn-secondary:hover {
    background: rgba(var(--ink-rgb), 0.1);
    color: var(--text);
    border-color: var(--muted);
}

@media (max-width: 768px) {
    .admin-preview-grid {
        grid-template-columns: repeat(2, 1fr);
    }
    .admin-modal-actions {
        flex-direction: column;
    }
}

/* Ivory and midnight blue: distinct backgrounds with clear card surfaces. */
:root {
    color-scheme: light;
    --bg: #fff9f0;
    --panel: #ffffff;
    --panel-sub: #fff6e9;
    --card: #ffffff;
    --card-hover: #f2f6ff;
    --border: #e9ddcc;
    --border-subtle: #f1e8db;
    --border-light: #cdbb9f;
    --text: #1c2c49;
    --text-sub: #465570;
    --muted: #687084;
    --muted-dark: #737a8a;
    --accent: #365fbc;
    --accent-hover: #284d9f;
    --accent-rgb: 54, 95, 188;
    --accent-glow: rgba(54,95,188,.075);
    --action-bg: #365dc3;
    --action-hover: #294da9;
    --on-action: #ffffff;
    --blue: #356fa3;
    --blue-rgb: 53, 111, 163;
    --blue-glow: rgba(53,111,163,.1);
    --purple: #805fa8;
    --amber: #936022;
    --amber-rgb: 147, 96, 34;
    --danger: #b84660;
    --ink-rgb: 28, 44, 73;
    --ambient-a: rgba(255,204,133,.23);
    --ambient-b: rgba(255,231,198,.18);
    --radius-sm: 9px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --shadow-sm: 0 3px 12px rgba(101,70,31,.045);
    --shadow-md: 0 10px 30px rgba(101,70,31,.055);
    --shadow-lg: 0 24px 80px rgba(41,49,71,.18);
}
:root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0c1931;
    --panel: #152642;
    --panel-sub: #1c3050;
    --card: #182b49;
    --card-hover: #243d61;
    --border: #2c4466;
    --border-subtle: #223958;
    --border-light: #48678f;
    --text: #ecf3ff;
    --text-sub: #c3d2e9;
    --muted: #a1b4d0;
    --muted-dark: #95a9c7;
    --accent: #9cbbff;
    --accent-hover: #bcd0ff;
    --accent-rgb: 156, 187, 255;
    --accent-glow: rgba(156,187,255,.1);
    --action-bg: #365dc3;
    --action-hover: #426bd2;
    --on-action: #ffffff;
    --blue: #8ebce7;
    --blue-rgb: 142, 188, 231;
    --blue-glow: rgba(142,188,231,.1);
    --purple: #bca9e3;
    --amber: #e0ba7e;
    --amber-rgb: 224, 186, 126;
    --danger: #ef9eae;
    --ink-rgb: 236, 243, 255;
    --ambient-a: rgba(39,86,165,.25);
    --ambient-b: rgba(39,66,119,.16);
    --shadow-sm: 0 3px 12px rgba(3,10,24,.15);
    --shadow-md: 0 10px 32px rgba(3,10,24,.18);
    --shadow-lg: 0 24px 80px rgba(3,10,24,.42);
}
[hidden] { display: none !important; }
body {
    background: radial-gradient(ellipse at 0% 0%, var(--ambient-a), transparent 52%),
                radial-gradient(ellipse at 100% 5%, var(--ambient-b), transparent 48%), var(--bg);
    background-attachment: fixed;
}
.shell { max-width: 1680px; padding: 28px 40px 56px; }
.topbar { align-items: flex-start; gap: 28px; padding-bottom: 16px; margin-bottom: 12px; }
.brand-block { min-width: 250px; flex: 1; }
.brand-badge { padding: 0; border: 0; border-radius: 0; background: none; color: var(--accent); font-size: 10px; letter-spacing: .14em; font-weight: 700; }
.brand-source { color: var(--muted); letter-spacing: .08em; }
.brand-mark { display: inline-flex; align-items: end; gap: 3px; width: 29px; height: 25px; margin-inline-end: 5px; }
.brand-mark i { display: block; width: 6px; height: 14px; border-radius: 2px; background: var(--accent); }
.brand-mark i:nth-child(2) { height: 23px; }
.brand-mark i:nth-child(3) { height: 18px; opacity: .5; }
h1 { background: none; -webkit-text-fill-color: currentColor; color: var(--text); font-size: clamp(28px, 2.6vw, 40px); letter-spacing: -.055em; margin-top: 12px; font-weight: 600; line-height: 1.25; }
html[lang="ar"] h1 { letter-spacing: -.03em; }
#topbarSubtitle { max-width: 620px; font-size: 12px; margin-top: 10px; }
.topbar-actions { max-width: 620px; justify-content: flex-end; gap: 8px; padding-top: 6px; }
button, .button { box-shadow: none; font-size: 12px; font-weight: 500; }
button:hover, .button:hover { box-shadow: none; transform: none; }
.topbar-actions > .button, .month-selector-wrap, .theme-control { min-height: 39px; border-radius: 9px; background: var(--panel); border: 1px solid var(--border); color: var(--text-sub); }
.topbar-actions > .button { padding: 9px 12px; }
#btnAdminPortal { background: var(--panel) !important; color: var(--text-sub) !important; border-color: var(--border) !important; }
.theme-control { display: inline-flex; align-items: center; padding-inline: 11px 4px; gap: 5px; }
.theme-control svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--muted); }
.theme-control select, .month-select { width: auto; min-height: 35px; border: 0; box-shadow: none; background: transparent; color: var(--text); font-size: 12px; padding: 4px 6px; cursor: pointer; }
.theme-control select { max-width: 125px; }
.month-select option, .theme-control option { background: var(--panel); color: var(--text); }
#btnRefreshSheet { background: var(--action-bg); color: var(--on-action); border-color: var(--action-bg); }
#btnRefreshSheet:hover { background: var(--action-hover); border-color: var(--action-hover); }
#btnRefreshSheet .cloud-dot { background: currentColor; box-shadow: none; }
#btnRefreshSheet.error { background: var(--danger); border-color: var(--danger); }
.status { border: 1px solid var(--border); border-radius: 9px; background: var(--panel); padding: 9px 14px; margin-bottom: 16px; font-size: 12px; color: var(--muted); box-shadow: none; }
.status-flash { animation: none; }
.month-selector-wrap { box-shadow: none; }
.status.error { border-inline-start-color: var(--danger); color: var(--danger); background: rgba(195,69,81,.08); }
.main-view-tabs { width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--border); border-radius: 0; padding: 0; gap: 26px; margin-bottom: 18px; overflow-x: auto; }
.main-view-tab-btn { position: relative; flex: 0 0 auto; padding: 13px 2px 18px; border: 0; border-radius: 0; background: transparent; color: var(--muted); font-size: 13px; font-weight: 500; box-shadow: none; }
.main-view-tab-btn:hover { background: transparent; color: var(--text); }
.main-view-tab-btn.active { background: transparent; color: var(--accent); box-shadow: inset 0 -3px var(--accent); }
.main-view-tab-btn .tab-icon { filter: grayscale(1); font-size: 15px; opacity: .6; }
.main-view-tab-btn.active .tab-icon { opacity: 1; transform: none; filter: grayscale(1); }
.tab-badge, .main-view-tab-btn.active .tab-badge { background: var(--accent-glow); color: var(--accent); border-radius: 5px; }
.agent-tabs-bar { background: transparent; padding: 0; border: 0; border-radius: 0; gap: 8px; margin-bottom: 16px; }
.agent-tab-btn { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; font-size: 12px; }
.agent-tab-btn.active { background: var(--accent-glow); color: var(--accent); border-color: var(--border-light); box-shadow: none; }
.panel, .analytics-card, .period-table-wrap { background: var(--panel); box-shadow: var(--shadow-md); border: 1px solid var(--border); }
.panel { border-radius: var(--radius-lg); }
.data-panel { padding: 0; overflow: hidden; }
.detail-head { padding: 22px 24px 16px; margin-bottom: 0; background: none; border-bottom: 1px solid var(--border-subtle); }
#detailAgent { font-size: 24px; letter-spacing: -.035em; font-weight: 600; }
#meta { font-size: 12px; font-family: inherit; margin-bottom: 0; }
.detail-actions { gap: 10px; }
.badge { background: var(--panel-sub); color: var(--muted); border-color: var(--border); border-radius: 6px; font-weight: 500; }
.metric-pill { border-radius: 6px; }
.metric-lateness { color: var(--amber); background: rgba(var(--amber-rgb), .1); border-color: rgba(var(--amber-rgb), .25); }
.metric-summary-bar { padding: 20px 28px 6px; gap: 12px; background: transparent; border: 0; margin-bottom: 0; }
.summary-pill { flex: 1 1 160px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 14px 18px; background: var(--panel-sub); border: 1px solid var(--border); border-radius: 10px; }
.pill-label { color: var(--muted); font-size: 11px; font-weight: 500; }
.pill-value { font-size: 25px; font-weight: 600; letter-spacing: -.04em; line-height: 1.25; font-variant-numeric: tabular-nums; }
.kpi-chip { background: var(--panel-sub); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 16px 18px; box-shadow: none; }
.kpi-chip::before { width: 3px; opacity: .7; }
.kpi-chip-label { letter-spacing: .03em; font-size: 10px; }
.kpi-chip-val { font-size: 24px; letter-spacing: -.035em; }
.search-row { padding: 18px 28px; }
.search-input-wrap input { background: var(--panel); border-color: var(--border); border-radius: 9px; font-size: 12px; }
.search-icon { filter: grayscale(1); opacity: .55; }
input, select, textarea { accent-color: var(--accent); }
.table-wrap { margin: 0 28px; border: 1px solid var(--border); border-radius: 10px; box-shadow: none; }
thead th, .period-table thead th, .chart-drilldown-table th { background: var(--panel-sub); color: var(--muted); padding: 14px 16px; font-size: 11px; letter-spacing: .02em; border-bottom: 1px solid var(--border); box-shadow: none; }
tbody td { padding: 15px 16px; color: var(--text-sub); border-bottom-color: var(--border-subtle); border-right-color: var(--border-subtle); font-size: 12px; }
tbody tr:nth-child(even), .period-table tbody tr:nth-child(even) { background: rgba(var(--ink-rgb), .015); }
tbody tr:hover, .period-table tbody tr:hover { background: var(--accent-glow) !important; }
.agent-name-link { color: var(--text); font-weight: 600; }
.agent-name-link:hover { color: var(--accent); }
.pagination { padding: 18px 28px; background: transparent; }
.page-badge { background: var(--panel-sub); color: var(--muted); border: 0; font-size: 11px; }
.cell-badge { border-radius: 5px; }
.period-header, .analytics-top-bar { padding: 8px 0 18px; border: 0; background: transparent; box-shadow: none; }
.period-table .period-agent-col { background: var(--panel); }
html[dir="rtl"] .period-table .period-agent-col { left: auto; right: 0; }
.analytics-title-wrap h2, .period-header h2 { font-size: 24px; font-weight: 600; letter-spacing: -.03em; }
.analytics-title-wrap p { font-size: 12px; }
.analytics-hero-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.analytics-kpi-card { background: var(--panel); border-radius: 16px; padding: 24px; box-shadow: var(--shadow-md); overflow: hidden; }
.analytics-kpi-card::before { content: ''; position: absolute; inset-block: 24px auto; inset-inline: 0 auto; width: 3px; height: 25px; border-radius: 3px; background: var(--accent); }
#cardAgbt::before { background: var(--blue); }
#cardBreach::before, #cardLateness::before, #cardIdle::before { background: var(--amber); }
.kpi-label { font-size: 12px; font-weight: 500; color: var(--text-sub); }
.kpi-val { font-size: 38px; letter-spacing: -.045em; font-weight: 600; line-height: 1.3; margin-block: 8px 0; font-family: 'Inter', 'IBM Plex Sans Arabic', sans-serif; }
.analytics-kpi-card .kpi-val { color: var(--text); }
.kpi-pill { background: var(--panel-sub); border-color: var(--border); }
.kpi-pill.emerald, .metric-csat { background: var(--accent-glow); border-color: rgba(var(--accent-rgb), .16); }

/* ==========================================================================
   REDESIGN v2 — Editorial Modern (design only, no logic/structure change)
   Warm paper + deep-indigo ink (light) / deep indigo-charcoal (dark).
   Overrides tokens and presentation; keeps every class/id and metric output.
   ========================================================================== */
:root {
    --bg: #eef1f7;
    --panel: #ffffff;
    --panel-sub: #f5f7fb;
    --card: #ffffff;
    --card-hover: #eef1f7;
    --border: #e2e6ee;
    --border-subtle: #edf0f5;
    --border-light: #cbd3e0;
    --text: #171a21;
    --text-sub: #4a5160;
    --muted: #8a92a1;
    --muted-dark: #6f7888;
    --accent: #4338ca;
    --accent-hover: #3730a3;
    --accent-rgb: 67, 56, 202;
    --accent-glow: rgba(67, 56, 202, 0.08);
    --action-bg: #4338ca;
    --action-hover: #3730a3;
    --on-action: #ffffff;
    --blue: #2f6f9f;
    --blue-rgb: 47, 111, 159;
    --blue-glow: rgba(47, 111, 159, 0.10);
    --purple: #7c5cbf;
    --amber: #b06a1f;
    --amber-rgb: 176, 106, 31;
    --danger: #b23b52;
    --ink-rgb: 23, 26, 33;
    --ambient-a: rgba(67, 56, 202, 0.055);
    --ambient-b: rgba(47, 111, 159, 0.045);
    /* Per-metric identity colors (light) */
    --m-csat: #0f9d6b;  --m-csat-soft: rgba(15, 157, 107, 0.10);
    --m-agbt: #2563eb;  --m-agbt-soft: rgba(37, 99, 235, 0.10);
    --m-break: #e0761a; --m-break-soft: rgba(224, 118, 26, 0.11);
    --m-late: #d3385a;  --m-late-soft: rgba(211, 56, 90, 0.10);
    --m-idle: #a16207;  --m-idle-soft: rgba(161, 98, 7, 0.12);
    --m-sessions: #0e7490; --m-sessions-soft: rgba(14, 116, 144, 0.12);
    /* Semantic status colors */
    --ok: #0f9d6b;   --ok-soft: rgba(15, 157, 107, 0.14);
    --warn: #b45309; --warn-soft: rgba(180, 83, 9, 0.14);
    --bad: #d3385a;  --bad-soft: rgba(211, 56, 90, 0.14);
    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 22px;
    --shadow-sm: 0 1px 2px rgba(20, 24, 34, 0.05), 0 2px 8px rgba(20, 24, 34, 0.04);
    --shadow-md: 0 2px 6px rgba(20, 24, 34, 0.05), 0 20px 44px rgba(20, 24, 34, 0.08);
    --shadow-lg: 0 30px 90px rgba(20, 24, 34, 0.20);
}
:root[data-theme="dark"] {
    --bg: #0e1220;
    --panel: #161b2e;
    --panel-sub: #1d2438;
    --card: #1a2033;
    --card-hover: #232b42;
    --border: #2c3450;
    --border-subtle: #232a41;
    --border-light: #46507a;
    --text: #eef1f8;
    --text-sub: #c4ccdd;
    --muted: #98a2ba;
    --muted-dark: #8b95ae;
    --accent: #a5b4fc;
    --accent-hover: #c7d2fe;
    --accent-rgb: 165, 180, 252;
    --accent-glow: rgba(165, 180, 252, 0.10);
    --action-bg: #4f46e5;
    --action-hover: #635bff;
    --on-action: #ffffff;
    --blue: #93c5fd;
    --blue-rgb: 147, 197, 253;
    --blue-glow: rgba(147, 197, 253, 0.12);
    --purple: #c4b5fd;
    --amber: #e0bd86;
    --amber-rgb: 224, 189, 134;
    --danger: #f0a2b1;
    --ink-rgb: 238, 241, 248;
    --ambient-a: rgba(79, 70, 229, 0.20);
    --ambient-b: rgba(20, 184, 166, 0.10);
    /* Per-metric identity colors (dark) */
    --m-csat: #34d399;  --m-csat-soft: rgba(52, 211, 153, 0.14);
    --m-agbt: #60a5fa;  --m-agbt-soft: rgba(96, 165, 250, 0.14);
    --m-break: #fbbf24; --m-break-soft: rgba(251, 191, 36, 0.14);
    --m-late: #fb7185;  --m-late-soft: rgba(251, 113, 133, 0.14);
    --m-idle: #facc15;  --m-idle-soft: rgba(250, 204, 21, 0.16);
    --m-sessions: #22d3ee; --m-sessions-soft: rgba(34, 211, 238, 0.16);
    /* Semantic status colors */
    --ok: #34d399;   --ok-soft: rgba(52, 211, 153, 0.16);
    --warn: #fbbf24; --warn-soft: rgba(251, 191, 36, 0.16);
    --bad: #fb7185;  --bad-soft: rgba(251, 113, 133, 0.16);
    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 22px;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.25);
    --shadow-md: 0 4px 10px rgba(0, 0, 0, 0.22), 0 24px 60px rgba(0, 0, 0, 0.32);
    --shadow-lg: 0 30px 90px rgba(0, 0, 0, 0.55);
}

body {
    background:
        radial-gradient(60% 55% at 100% -5%, var(--ambient-b), transparent 60%),
        radial-gradient(55% 50% at 0% 0%, var(--ambient-a), transparent 55%),
        var(--bg);
    background-attachment: fixed;
    letter-spacing: -0.006em;
}

/* Typography: editorial headings */
h1, #detailAgent, .analytics-title-wrap h2, .period-header h2, .chart-title, .chart-title span {
    letter-spacing: -0.045em;
}
h1 { font-weight: 700; line-height: 1.15; }
.chart-subtitle { font-size: 12.5px; color: var(--muted); }

/* Surfaces: softer radius + hairline border + layered shadow + top sheen */
.panel, .analytics-card, .period-table-wrap, .analytics-kpi-card,
.chart-section-card, .analytics-secondary-strip, .agent-compare-card {
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-md);
}
.analytics-card::after, .analytics-kpi-card::after, .panel::after { content: none; }
.analytics-kpi-card { position: relative; }
.analytics-kpi-card::before {
    inset-block: 22px auto;
    width: 3px;
    height: 30px;
    border-radius: 999px;
    background: var(--accent);
}
#cardAgbt::before { background: var(--blue); }
#cardBreach::before, #cardLateness::before, #cardIdle::before { background: var(--amber); }
.kpi-val { font-size: 40px; font-weight: 700; letter-spacing: -0.05em; }
@media (min-width: 1500px) { .analytics-kpi-card { padding: 24px; } }

/* Tabs: refined underline + soft pill */
.main-view-tab-btn { font-weight: 600; font-size: 13px; padding: 14px 2px 17px; }
.main-view-tab-btn.active { box-shadow: inset 0 -2px var(--accent); }
.chart-tabs, .chart-mode-toggle, .filter-date-pills {
    border-radius: 12px;
    padding: 4px;
    background: var(--panel-sub);
    border: 1px solid var(--border);
}
.chart-tab-btn, .chart-mode-btn, .filter-date-pill {
    border-radius: 9px;
    font-weight: 600;
    transition: background .16s ease, color .16s ease, box-shadow .16s ease;
}
.chart-tab-btn.active, .chart-mode-btn.active, .filter-date-pill.active {
    background: var(--card);
    color: var(--accent);
    box-shadow: var(--shadow-sm);
}

/* Buttons */
.button, button.button, .admin-btn-primary, .admin-btn-secondary {
    border-radius: 11px;
    font-weight: 600;
    transition: transform .14s ease, background .16s ease, border-color .16s ease, box-shadow .16s ease;
}
.button:active, .admin-btn-primary:active { transform: translateY(1px); }
.button.primary, .admin-btn-primary {
    background: var(--action-bg);
    border: 1px solid var(--action-bg);
    box-shadow: 0 6px 16px rgba(var(--accent-rgb), 0.28);
}
.button.primary:hover, .admin-btn-primary:hover:not(:disabled) {
    background: var(--action-hover);
    border-color: var(--action-hover);
    box-shadow: 0 10px 24px rgba(var(--accent-rgb), 0.34);
    transform: translateY(-1px);
}

/* Inputs / selects */
input, select, textarea, .search-input-wrap input, .chart-select {
    border-radius: 11px;
    border: 1px solid var(--border);
    background: var(--panel);
    transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
}
input:focus, select:focus, textarea:focus, .search-input-wrap input:focus, .chart-select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Summary pills & KPI chips */
.summary-pill {
    border-radius: 14px;
    background: linear-gradient(180deg, var(--panel), var(--panel-sub));
    border: 1px solid var(--border);
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
.summary-pill:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); border-color: var(--border-light); }
.pill-value { font-weight: 700; letter-spacing: -0.045em; }
.kpi-chip { border-radius: 14px; background: linear-gradient(180deg, var(--panel), var(--panel-sub)); }
.badge { border-radius: 8px; font-weight: 600; }
.metric-pill { border-radius: 8px; font-weight: 600; }

/* Tables: cleaner, airy, accent hover */
.table-wrap { border-radius: 14px; border: 1px solid var(--border); overflow: auto; }
thead th {
    background: var(--panel-sub);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-size: 10.5px;
    font-weight: 600;
}
tbody td { padding: 15px 16px; }
tbody tr { transition: background .12s ease; }
tbody tr:hover { background: var(--accent-glow) !important; }
.col-rank { font-weight: 600; }

/* Modals: frosted, rounded, elevated */
.admin-modal-overlay, .chart-drilldown-overlay { backdrop-filter: blur(10px); }
.admin-modal-card, .chart-drilldown-card {
    border-radius: 20px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-lg);
}
.admin-modal-header, .chart-drilldown-header {
    background: linear-gradient(180deg, var(--panel-sub), var(--panel));
    border-bottom: 1px solid var(--border);
}

/* Chart surfaces */
.chart-summary-badges { border-radius: 12px; }
.chart-tooltip { border-radius: 10px; box-shadow: var(--shadow-md); }
.chart-drill-hint { border-radius: 999px; }

/* Page badge / pagination */
.page-badge { border-radius: 8px; font-weight: 600; }

/* Language / mode toggle pills */
.lang-toggle-btn, .time-mode-btn { border-radius: 999px; font-weight: 600; }

/* Soft appear for cards (respects reduced-motion below) */
@keyframes uiRise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.analytics-kpi-card, .summary-pill, .panel, .analytics-card { animation: uiRise .28s ease both; }
@media (prefers-reduced-motion: reduce) {
    .analytics-kpi-card, .summary-pill, .panel, .analytics-card { animation: none !important; }
}

/* Compact KPI cards inside "Live Performance Analytics & Charts" */
.analytics-hero-grid { gap: 12px; }
.analytics-kpi-card { padding: 15px 17px; border-radius: 18px; }
.analytics-kpi-card::before { inset-block: 15px auto; height: 22px; }
.kpi-top { gap: 6px; }

.kpi-pill { font-size: 10px; padding: 2px 8px; border-radius: 999px; }

.kpi-sub { font-size: 11px; line-height: 1.5; }
.kpi-bar-track { height: 3px; margin-top: 9px; }
@media (min-width: 1500px) {
    .analytics-hero-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .analytics-kpi-card { padding: 16px; }

    .analytics-kpi-card { padding: 14px 13px; }

/* Per-metric identity on Analytics KPI cards */
#cardCsat    { --mc: var(--m-csat);  --mc-soft: var(--m-csat-soft); }
#cardAgbt    { --mc: var(--m-agbt);  --mc-soft: var(--m-agbt-soft); }
#cardBreach  { --mc: var(--m-break); --mc-soft: var(--m-break-soft); }
#cardLateness{ --mc: var(--m-late);  --mc-soft: var(--m-late-soft); }

.analytics-kpi-card {
    background: linear-gradient(180deg, var(--mc-soft, transparent) 0%, transparent 48%), var(--panel);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-md);
}
.analytics-kpi-card::before { background: var(--mc, var(--accent)); height: 26px; }
.analytics-kpi-card .kpi-val { color: var(--mc, var(--accent)); }
.analytics-kpi-card .kpi-pill {

    color: var(--mc, var(--muted));

}
.analytics-kpi-card .kpi-bar-fill { background: var(--mc, var(--accent)); }
.analytics-kpi-card .kpi-bar-track { background: var(--panel-sub); }

/* Prominent tables */
.table-wrap {
    border: 1px solid var(--border);

}
.table-wrap thead th,
.period-table thead th,
.chart-drilldown-table th {
    background: linear-gradient(180deg, var(--panel-sub), var(--panel));
    color: var(--text-sub);

    top: 0;

.table-wrap tbody tr,
.period-table tbody tr { border-bottom: 1px solid var(--border-subtle); }
.table-wrap tbody tr:nth-child(even),
.period-table tbody tr:nth-child(even) { background: rgba(var(--ink-rgb), 0.02); }
.table-wrap tbody tr:hover,
.period-table tbody tr:hover {
    background: var(--accent-glow) !important;

td.agent-metric-cell { font-weight: 600; font-variant-numeric: tabular-nums; }
td[data-metric="csat"] { color: var(--m-csat); }

td[data-metric="lateness"] { color: var(--m-late); }
td[data-metric="idle"] { color: var(--m-idle); }
td[data-metric="productivity"] { color: var(--blue); }

.chart-tab-btn.active { color: var(--mc, var(--accent)); box-shadow: inset 0 -2px var(--mc, var(--accent)); }
