    function renderMetricSummaryBarAllAgents(metric) {
        const bar = el('metricSummary');
        if (!bar) return;

        let totalCsat = 0, countCsat = 0;
        let totalLate = 0;
        let totalBreaches = 0;
        let totalBreachMins = 0;
        let agbtSecsSum = 0, agbtCount = 0;
        let abstSecsSum = 0, abstCount = 0;
        let idleHoursSum = 0;

        AppState.agents.forEach(a => {
            if (a.csat > 0) { totalCsat += a.csat; countCsat++; }
            totalLate += a.lateness || 0;
            totalBreaches += parseInt(a.breakBreach, 10) || 0;
            totalBreachMins += Number(a.breakExceedMins) || 0;
            const secs = parseTimeToSeconds(a.agbt);
            if (secs > 0) { agbtSecsSum += secs; agbtCount++; }
            const abstSecs = parseTimeToSeconds(a.abst);
            if (abstSecs > 0) { abstSecsSum += abstSecs; abstCount++; }
            const idleH = parseFloat(a.idle);
            if (!isNaN(idleH)) idleHoursSum += idleH;
        });

        const avgCsat = countCsat > 0 ? (totalCsat / countCsat).toFixed(1) : '—';
        // احترام Decimal ↔ Time للـAGBT/ABST (نفس سلوك بطاقات الوكيل)
        const avgAgbtText = agbtCount > 0 ? formatDuration(Math.round(agbtSecsSum / agbtCount) / 60) : '—';
        const avgAbstText = abstCount > 0 ? formatDuration(Math.round(abstSecsSum / abstCount) / 60) : '—';

        // تلوين بطاقة CSAT حسب التارجت: 90%+ أخضر، 75%-89.9% أصفر، أقل من 75% أحمر
        const csatNum = parseFloat(avgCsat);
        let csatColor = 'var(--m-csat)';
        let csatSoft = 'var(--m-csat-soft)';
        if (!isNaN(csatNum)) {
            if (csatNum >= 90) {
                csatColor = '#10b981';
                csatSoft = 'rgba(16, 185, 129, 0.15)';
            } else if (csatNum >= 75) {
                csatColor = '#f59e0b';
                csatSoft = 'rgba(245, 158, 11, 0.15)';
            } else {
                csatColor = '#ef4444';
                csatSoft = 'rgba(239, 68, 68, 0.15)';
            }
        }

        bar.innerHTML = `
            <div class="summary-pill" data-metric="csat" style="--mc:${csatColor}; --mc-soft:${csatSoft};"><span class="pill-label">${I18N.t('teamAvgCsatLabel')}</span> <b class="pill-value" style="color:${csatColor};">${avgCsat}%</b></div>
            <div class="summary-pill" data-metric="agbt"><span class="pill-label">${I18N.t('kpiAgbtTitle')}</span> <b class="pill-value">${avgAgbtText}</b></div>
            <div class="summary-pill" data-metric="abst"><span class="pill-label">ABST:</span> <b class="pill-value">${avgAbstText}</b></div>
            <div class="summary-pill" data-metric="breakBreach"><span class="pill-label">${I18N.t('kpiBreachTitle')}</span> <b class="pill-value">${breachExceedText(totalBreachMins)}</b><span class="pill-sub">${breachCountText(totalBreaches)}</span></div>
            <div class="summary-pill" data-metric="lateness"><span class="pill-label">${I18N.t('totalLatenessLabel')}</span> <b class="pill-value">${fmtMinutes(totalLate)}</b></div>
            <div class="summary-pill" data-metric="idle"><span class="pill-label">${I18N.t('kpiIdleTitle')}</span> <b class="pill-value">${fmtHours(Math.round(idleHoursSum * 100) / 100)}</b></div>
        `;
    }

    // آخر يوم مسجّل للوكيل: يعيد { day, sessions } أو null (من الخط الزمني المحمّل لنفس الوكيل)
    function agentLastDaySessions_(email) {
        const active = (typeof currentAnalyticsEmail === 'function') ? currentAnalyticsEmail() : '';
        if (!active || String(active).toLowerCase() !== String(email || '').toLowerCase()) return null;
        const days = Array.isArray(AppState.chartDays) ? AppState.chartDays : [];
        const withDay = days.filter(d => d && d.day);
        if (!withDay.length) return null;
        withDay.sort((a, b) => String(a.day).localeCompare(String(b.day)));
        const last = withDay[withDay.length - 1];
        const n = Number(last.sessions);
        return { day: last.day, sessions: isFinite(n) ? n : 0 };
    }

    function renderMetricSummaryBarSingleAgent(agent, metric) {
        const bar = el('metricSummary');
        if (!bar) return;

        const latenessLabel = I18N.currentLang === 'ar' ? 'تأخير:' : 'Lateness:';
        const breachLabel = I18N.currentLang === 'ar' ? 'تجاوز بريك:' : 'Break Exceed:';
        const prodLabel = I18N.currentLang === 'ar' ? 'الإنتاجية:' : 'Productivity:';
        const lastDay = agentLastDaySessions_(agent.email);
        const lastDayLabel = I18N.t('agentLastDaySessionsLabel', { date: lastDay ? String(lastDay.day).slice(5) : '—' });

        // حساب عدد التقييمات الإيجابية (Good) والسلبية (Bad) مع معالجة الحالات البديلة
        let goodCount = (agent.csatGood !== undefined && agent.csatGood !== null) ? Number(agent.csatGood) : null;
        let badCount = (agent.csatBad !== undefined && agent.csatBad !== null) ? Number(agent.csatBad) : null;

        // بديل 1: إذا لم تكن موجودة في كائن الوكيل، نحاول حسابها من بيانات الـ drill الحالية إذا كان المقياس CSAT
        if ((goodCount === null || badCount === null) && AppState.activeDrillData && AppState.activeDrillData.rows && AppState.selectedMetric === 'csat') {
            const h = (AppState.activeDrillData.header || []).map(c => String(c).toLowerCase().trim());
            const cIdx = findHeaderCol(h, 'csat_adjusted', 'csat', 'score', 'rating');
            if (cIdx !== -1) {
                let g = 0, b = 0;
                AppState.activeDrillData.rows.forEach(r => {
                    const val = String(r[cIdx] || '').toLowerCase().trim();
                    if (val === 'good' || val === '5' || val === '4' || val === 'positive' || val.includes('ممتاز') || val.includes('جيد')) g++;
                    else if (val === 'bad' || val === '1' || val === '2' || val === 'negative' || val.includes('سيء')) b++;
                });
                if (g + b > 0) {
                    goodCount = g;
                    badCount = b;
                }
            }
        }

        // بديل 2: حسابها من إجمالي السيسات والنسبة المئوية
        if ((goodCount === null || badCount === null) && !isBlank(agent.csat) && !isBlank(agent.csatTotal) && Number(agent.csatTotal) > 0) {
            const total = Number(agent.csatTotal);
            goodCount = Math.round(total * (Number(agent.csat) / 100));
            badCount = Math.max(0, total - goodCount);
        }

        const hasCsatData = !isBlank(agent.csat) || (goodCount !== null && goodCount > 0) || (badCount !== null && badCount > 0);
        const goodDisplay = hasCsatData && goodCount !== null ? `👍 ${goodCount}` : '—';
        const badDisplay = hasCsatData && badCount !== null ? `👎 ${badCount}` : '—';

        // تلوين CSAT حسب التارجت: 90%+ أخضر، 75%-89.9% أصفر، أقل من 75% أحمر
        let csatColor = 'var(--muted)';
        if (!isBlank(agent.csat)) {
            const cVal = Number(agent.csat);
            if (cVal >= 90) csatColor = '#10b981';
            else if (cVal >= 75) csatColor = '#f59e0b';
            else csatColor = '#ef4444';
        }

        // عرض مختصر (نفس نمط شريط الإحصائيات): عنوان صغير + قيمة ملوّنة بلون المقياس
        const items = [
            { label: I18N.t('agentTotalSessionsLabel'), val: isBlank(agent.sessions) ? '—' : agent.sessions, color: 'var(--m-sessions)' },
            { label: lastDayLabel, val: lastDay ? lastDay.sessions : '—', color: 'var(--m-sessions)' },
            { label: 'CSAT:', val: isBlank(agent.csat) ? '—' : agent.csat + '%', color: csatColor },
            { label: I18N.t('agentGoodCsatLabel'), val: goodDisplay, color: '#34d399' },
            { label: I18N.t('agentBadCsatLabel'), val: badDisplay, color: '#f87171' },
            { label: 'AGBT:', val: fmtTimeStr(agent.agbt), color: 'var(--m-agbt)' },
            { label: 'ABST:', val: fmtTimeStr(agent.abst), color: 'var(--purple)' },
            { label: latenessLabel, val: fmtMinutes(agent.lateness), color: 'var(--m-late)' },
            { label: breachLabel, val: breachExceedText(agent.breakExceedMins), color: 'var(--m-break)' },
            { label: I18N.t('kpiIdleTitle'), val: fmtHours(agent.idle), color: 'var(--m-idle)' },
            { label: prodLabel, val: blankDash(agent.productivity), color: 'var(--blue)' }
        ];

        bar.innerHTML = items.map(it =>
            `<div class="sec-stat-box"><span class="sec-label">${escapeHtml(it.label)}</span><b class="sec-val" style="color:${it.color};">${escapeHtml(String(it.val))}</b></div>`
        ).join('');
    }

    // يحدّث شريط ملخص الوكيل (لاستظهار "سيشنات آخر يوم" بعد تحميل الخط الزمني)
    function refreshAgentSummaryBar_() {
        const email = String(AppState.selectedAgent || '');
        if (!email) return;
        const ag = (AppState.agents || []).find(a => String(a.email || '').toLowerCase() === email.toLowerCase());
        if (ag) renderMetricSummaryBarSingleAgent(ag, AppState.selectedMetric);
    }

    // يضبط مؤشر الصفحات وأزرار التنقل: يخفي الأزرار ويعرض إجمالي السجلات في الحاوية الثابتة
    function updatePaginationControls(page, totalPages, totalCount) {
        const prevBtn = el('previous');
        const nextBtn = el('next');
        const pageBadge = el('page');
        if (prevBtn) prevBtn.style.display = 'none';
        if (nextBtn) nextBtn.style.display = 'none';
        if (pageBadge) {
            if (totalCount !== undefined && totalCount !== null) {
                pageBadge.textContent = `${totalCount} ${I18N.t('agentUnit')}`;
            } else {
                const total = Math.max(1, totalPages || 1);
                const current = Math.min(Math.max(0, page || 0), total - 1);
                pageBadge.textContent = `${current + 1} / ${total}`;
            }
        }
    }

    function renderDetailTableOnly() {
        const head = el('head');
        const body = el('body');
        const matchCount = el('matchCount');
        const noRows = el('noRows');
        const pageBadge = el('page');

        if (!head || !body) return;

        if (!AppState.selectedAgent) {
            renderAllAgentsComparisonTable(head, body, matchCount, noRows, pageBadge);
        } else {
            renderSingleAgentDrillTable(head, body, matchCount, noRows, pageBadge);
        }
    }

    /**
     * جدول مقارنة جميع الوكلاء (Unified All Agents Comparison Table)
     */
    function renderAllAgentsComparisonTable(head, body, matchCount, noRows, pageBadge) {
        const metric = AppState.selectedMetric;

        head.innerHTML = '';
        const trHead = document.createElement('tr');
        
        let columns = [];
        if (metric === 'all') {
            columns = [
                { key: 'index', label: I18N.t('colIndex') },
                { key: 'name', label: I18N.t('colName') },
                { key: 'csat', label: I18N.t('colCsat') },
                { key: 'agbt', label: I18N.t('colAgbt') },
                { key: 'abst', label: I18N.t('colAbst') },
                { key: 'breakBreach', label: I18N.t('colBreakBreach') },
                { key: 'lateness', label: I18N.t('colLateness') },
                { key: 'idle', label: I18N.t('colIdle') },
                { key: 'productivity', label: I18N.t('colProductivity') },
                { key: null, label: I18N.t('colSessions') }
            ];
        } else {
            columns = [
                { key: 'index', label: I18N.t('colIndex') },
                { key: 'name', label: I18N.t('colName') },
                { key: 'metricVal', label: I18N.t('colMetricVal', { metric: METRIC_LABELS[metric] }) },
                { key: 'status', label: I18N.t('colStatus') },
                { key: null, label: I18N.t('colSessions') }
            ];
        }

        columns.forEach(colObj => {
            const th = document.createElement('th');
            if (colObj.key === 'index') {
                th.style.width = '38px';
                th.style.minWidth = '38px';
                th.style.textAlign = 'center';
            }
            if (colObj.key) {
                const isSorted = AppState.sortCol === colObj.key;
                th.className = 'sortable' + (isSorted ? (AppState.sortAsc ? ' sorted-asc' : ' sorted-desc') : '');
                th.style.cursor = 'pointer';
                const icon = isSorted ? (AppState.sortAsc ? ' ▲' : ' ▼') : ' ↕';
                th.innerHTML = `<span style="display:inline-flex; align-items:center; gap:6px; justify-content:space-between; width:100%;">
                    <span>${colObj.label}</span>
                    <span class="sort-icon" style="font-size:11px; opacity:${isSorted ? '1' : '0.45'}; color:${isSorted ? 'var(--blue)' : 'inherit'};">${icon}</span>
                </span>`;
                th.addEventListener('click', () => {
                    if (AppState.sortCol === colObj.key) {
                        AppState.sortAsc = !AppState.sortAsc;
                    } else {
                        AppState.sortCol = colObj.key;
                        AppState.sortAsc = (colObj.key === 'abst' || colObj.key === 'agbt' || colObj.key === 'lateness' || colObj.key === 'breakBreach' || colObj.key === 'index');
                    }
                    renderDetailTableOnly();
                });
            } else {
                th.textContent = colObj.label;
            }
            trHead.appendChild(th);
        });
        head.appendChild(trHead);

        const q = AppState.searchQuery;
        let visibleAgents = AppState.agents.filter(a => {
            if (!q) return true;
            return a.name.toLowerCase().includes(q) ||
                   a.email.toLowerCase().includes(q) ||
                   String(a.csat).includes(q) ||
                   String(a.abst).includes(q) ||
                   String(a.agbt).includes(q) ||
                   String(a.lateness).includes(q);
        });

        // تطبيق الترتيب التصاعدي أو التنازلي
        if (AppState.sortCol) {
            visibleAgents.sort((a, b) => {
                let va, vb;
                if (AppState.sortCol === 'index') {
                    va = AppState.agents.indexOf(a);
                    vb = AppState.agents.indexOf(b);
                } else if (AppState.sortCol === 'metricVal') {
                    va = a[metric] ?? a.csat;
                    vb = b[metric] ?? b.csat;
                } else if (AppState.sortCol === 'status') {
                    va = getStatusSortScore(a, metric);
                    vb = getStatusSortScore(b, metric);
                } else {
                    va = a[AppState.sortCol];
                    vb = b[AppState.sortCol];
                }

                if (AppState.sortCol === 'abst' || AppState.sortCol === 'agbt' || (typeof va === 'string' && va.includes(':'))) {
                    va = parseTimeToSeconds(va);
                    vb = parseTimeToSeconds(vb);
                } else if (AppState.sortCol === 'productivity') {
                    va = parseFloat(String(va || '0').replace('%', '')) || 0;
                    vb = parseFloat(String(vb || '0').replace('%', '')) || 0;
                } else if (AppState.sortCol === 'idle') {
                    va = parseFloat(String(va || '0').replace(/[^0-9.-]/g, '')) || 0;
                    vb = parseFloat(String(vb || '0').replace(/[^0-9.-]/g, '')) || 0;
                } else if (typeof va === 'number' || (!isNaN(parseFloat(va)) && !String(va).includes('@'))) {
                    va = parseFloat(va) || 0;
                    vb = parseFloat(vb) || 0;
                } else {
                    va = String(va || '').toLowerCase();
                    vb = String(vb || '').toLowerCase();
                }

                if (va < vb) return AppState.sortAsc ? -1 : 1;
                if (va > vb) return AppState.sortAsc ? 1 : -1;
                return 0;
            });
        }

        if (matchCount) matchCount.textContent = `${visibleAgents.length} ${I18N.t('agentUnit')}`;
        if (noRows) noRows.hidden = visibleAgents.length > 0;

        const pagedAgents = visibleAgents;
        updatePaginationControls(0, 1, visibleAgents.length);

        body.innerHTML = '';

        pagedAgents.forEach((agent, i) => {
            const tr = document.createElement('tr');
            const rowNum = i + 1;

            if (metric === 'all') {
                const csatPill = isBlank(agent.csat)
                    ? `<span style="color:var(--muted);">—</span>`
                    : (agent.csat >= 90
                        ? `<span class="badge badge-success">${agent.csat}%</span>`
                        : (agent.csat >= 75
                            ? `<span class="badge badge-warning">${agent.csat}%</span>`
                            : `<span class="badge badge-danger">${agent.csat}%</span>`));
                const latePill = isBlank(agent.lateness)
                    ? `<span style="color:var(--muted);">—</span>`
                    : ((Number(agent.lateness) || 0) === 0
                        ? `<span style="color:var(--ok);font-weight:700;">${fmtMinutes(0)}</span>`
                        : `<span style="color:var(--bad);font-weight:800;">${fmtMinutes(agent.lateness)}</span>`);

                // All Agents (Comparison Table): "Break Exceed" = دقائق التجاوز (الأساسي)
                const breachMinsPill = isBlank(agent.breakExceedMins)
                    ? `<span style="color:var(--muted);">—</span>`
                    : ((Number(agent.breakExceedMins) || 0) === 0
                        ? `<span style="color:var(--ok);font-weight:700;">${breachExceedText(0)}</span>`
                        : `<span style="color:var(--bad);font-weight:800;">${breachExceedText(agent.breakExceedMins)}</span>`);

                const abstSecs = parseTimeToSeconds(agent.abst);
                const abstTier = getAbstTier(abstSecs);
                let abstPill = '';
                if (abstTier === 'fast') {
                    abstPill = `<span style="color:var(--ok); font-weight:700;">${fmtTimeStr(agent.abst)}</span>`;
                } else if (abstTier === 'normal') {
                    abstPill = `<span style="color:var(--warn); font-weight:600;">${fmtTimeStr(agent.abst)}</span>`;
                } else if (abstTier === 'slow') {
                    abstPill = `<span style="color:var(--bad); font-weight:700;">${fmtTimeStr(agent.abst)}</span>`;
                } else {
                    abstPill = `<span style="color:var(--muted);">—</span>`;
                }

                const emailAttr = escapeHtml(agent.email);
                const cellHint = escapeHtml(I18N.t('clickCellForDetails'));
                tr.innerHTML = `
                    <td class="col-rank">${rowNum}</td>
                    <td style="font-weight:600; color:#fff;"><button type="button" class="agent-name-link" data-email="${emailAttr}">${escapeHtml(agent.name)}</button></td>
                    <td class="agent-metric-cell" data-email="${emailAttr}" data-metric="csat" title="${cellHint}" style="cursor:pointer;">${csatPill}</td>
                    <td class="agent-metric-cell" data-email="${emailAttr}" data-metric="agbt" title="${cellHint}" style="cursor:pointer; color:#38bdf8;">${fmtTimeStr(agent.agbt)}</td>
                    <td class="agent-metric-cell" data-email="${emailAttr}" data-metric="abst" title="${cellHint}" style="cursor:pointer;">${abstPill}</td>
                    <td class="agent-metric-cell" data-email="${emailAttr}" data-metric="breakBreach" title="${cellHint}" style="cursor:pointer;">${breachMinsPill}</td>
                    <td class="agent-metric-cell" data-email="${emailAttr}" data-metric="lateness" title="${cellHint}" style="cursor:pointer;">${latePill}</td>
                    <td class="agent-metric-cell" data-email="${emailAttr}" data-metric="idle" title="${cellHint}" style="cursor:pointer;">${fmtHours(agent.idle)}</td>
                    <td class="agent-metric-cell" data-email="${emailAttr}" data-metric="productivity" title="${cellHint}" style="cursor:pointer; color:#06b6d4;">${escapeHtml(blankDash(agent.productivity))}</td>
                    <td style="font-weight:700; color:var(--m-sessions);">${isBlank(agent.sessions) ? '—' : agent.sessions}</td>
                `;
            } else {
                let metricValDisplay = '—';
                let statusBadge = `<span class="badge subtle">${I18N.t('statusNormal')}</span>`;

                if (metric === 'csat') {
                    metricValDisplay = isBlank(agent.csat) ? '—' : `${agent.csat}%`;
                    statusBadge = isBlank(agent.csat)
                        ? `<span class="badge subtle">—</span>`
                        : (agent.csat >= 90
                            ? `<span class="badge badge-success">${I18N.t('statusExcellent')}</span>`
                            : (agent.csat >= 75
                                ? `<span class="badge badge-warning">${I18N.t('statusNeedsFollowup')}</span>`
                                : `<span class="badge badge-danger">${I18N.t('statusBreached')}</span>`));
                } else if (metric === 'agbt') {
                    metricValDisplay = fmtTimeStr(agent.agbt);
                    statusBadge = `<span class="badge subtle" style="color:#38bdf8;">${I18N.t('statusNormal')}</span>`;
                } else if (metric === 'abst') {
                    const secs = parseTimeToSeconds(agent.abst);
                    metricValDisplay = fmtTimeStr(agent.abst);
                    const tier = getAbstTier(secs);
                    if (tier === 'fast') {
                        statusBadge = `<span class="badge badge-success">${I18N.t('statusFast')}</span>`;
                    } else if (tier === 'normal') {
                        statusBadge = `<span class="badge badge-warning">${I18N.t('statusNormal')}</span>`;
                    } else if (tier === 'slow') {
                        statusBadge = `<span class="badge badge-danger">${I18N.t('statusSlow')}</span>`;
                    }
                } else if (metric === 'lateness') {
                    metricValDisplay = fmtMinutes(agent.lateness);
                    statusBadge = isBlank(agent.lateness)
                        ? `<span class="badge subtle">—</span>`
                        : ((Number(agent.lateness) || 0) === 0 ? `<span class="badge badge-success">${I18N.t('statusOnTime')}</span>` : `<span class="badge badge-danger">${I18N.t('statusLate')}</span>`);
                } else if (metric === 'breakBreach') {
                    // الأساسي: دقائق التجاوز — والمعلومة الإضافية: عدد المرات
                    metricValDisplay = breachExceedText(agent.breakExceedMins);
                    const bCount = parseInt(agent.breakBreach, 10) || 0;
                    statusBadge = isBlank(agent.breakBreach)
                        ? `<span class="badge subtle">—</span>`
                        : (bCount === 0
                            ? `<span class="badge badge-success">${breachCountText(0)}</span>`
                            : `<span class="badge badge-danger">${breachCountText(bCount)}</span>`);
                } else if (metric === 'idle') {
                    metricValDisplay = fmtHours(agent.idle);
                    statusBadge = `<span class="badge subtle">${I18N.t('statusNormal')}</span>`;
                } else if (metric === 'productivity') {
                    metricValDisplay = blankDash(agent.productivity);
                    statusBadge = isBlank(agent.productivity)
                        ? `<span class="badge subtle">—</span>`
                        : (parseFloat(agent.productivity) >= 90 ? `<span class="badge badge-success">${I18N.t('statusExcellent')}</span>` : `<span class="badge badge-warning">${I18N.t('statusNeedsFollowup')}</span>`);
                }

                tr.innerHTML = `
                    <td class="col-rank">${rowNum}</td>
                    <td style="font-weight:600; color:#fff;"><button type="button" class="agent-name-link" data-email="${escapeHtml(agent.email)}">${escapeHtml(agent.name)}</button></td>
                    <td data-metric="${escapeHtml(metric)}" style="font-weight:700; font-size:14px;">${escapeHtml(metricValDisplay)}</td>
                    <td>${statusBadge}</td>
                    <td style="font-weight:700; color:var(--m-sessions);">${isBlank(agent.sessions) ? '—' : agent.sessions}</td>
                `;
            }
            body.appendChild(tr);
        });
    }

    /**
     * جدول تفاصيل سجلات الوكيل الفردي (Single Agent Drill Table)
     */
    function renderSingleAgentDrillTable(head, body, matchCount, noRows, pageBadge) {
        const data = AppState.activeDrillData;

        if (AppState.drillError && !AppState.drillLoading) {
            head.innerHTML = '';
            body.innerHTML = '<tr><td colspan="10" role="alert" style="padding:28px;color:var(--danger)">' + escapeHtml(AppState.drillError) + '</td></tr>';
            if (noRows) noRows.hidden = true;
            return;
        }

        if (AppState.drillLoading) {
            head.innerHTML = '';
            body.innerHTML = `
                <tr>
                    <td colspan="10" style="text-align:center; padding:45px 20px; color:var(--muted);">
                        <div style="font-size:32px; margin-bottom:10px;">⏳</div>
                        <strong style="font-size:15px; color:#fff; display:block; margin-bottom:6px;">
                            ${I18N.currentLang === 'ar' ? 'جاري تحميل السجلات…' : 'Loading records…'}
                        </strong>
                    </td>
                </tr>`;
            if (matchCount) matchCount.textContent = '…';
            updatePaginationControls(0, 1);
            return;
        }

        if (!data || !data.found || !data.rows || data.rows.length === 0) {
            const emptyHeader = data && Array.isArray(data.header) ? data.header : [];
            head.innerHTML = emptyHeader.length ? '<tr>' + emptyHeader.map(h => '<th>' + escapeHtml(h) + '</th>').join('') + '</tr>' : '';
            body.innerHTML = `
                <tr>
                    <td colspan="10" style="text-align:center; padding:45px 20px; color:var(--muted);">
                        <div style="font-size:32px; margin-bottom:10px;">📭</div>
                        <strong style="font-size:15px; color:#fff; display:block; margin-bottom:6px;">
                            ${I18N.t('noDrillRecordsTitle', { metric: METRIC_LABELS[AppState.selectedMetric] || AppState.selectedMetric })}
                        </strong>
                        <span style="font-size:13px; color:var(--muted);">
                            ${I18N.t('noDrillRecordsSub')}
                        </span>
                    </td>
                </tr>`;
            if (matchCount) matchCount.textContent = '0';
            updatePaginationControls(0, 1);
            return;
        }

        const rawHeader = data.header || [];
        const rawRows = data.rows || [];

        // دعم تحليل المساهمة لجدول AGBT (يبحث بنفس رقم التكت في جلسات كل الوكلاء)
        const isAgbtMetric = AppState.selectedMetric === 'agbt';
        const ticketColIdx = isAgbtMetric ? findHeaderCol(rawHeader, 'ticket_id', 'ticket id', 'session_id', 'session id', 'ticket_number', 'ticket number', 'ticket') : -1;
        const basketColIdx = isAgbtMetric ? findHeaderCol(rawHeader, 'sum_basket_time_for_ticket_per_hour_min_ONLINE_WOMT', 'sum_basket_time_for_ticket_per_hour_min', 'basket_time', 'agbt') : -1;

        head.innerHTML = '';
        const trHead = document.createElement('tr');
        rawHeader.forEach((colName, colIdx) => {
            const th = document.createElement('th');
            const isSorted = AppState.drillSortCol === colIdx;
            th.className = 'sortable' + (isSorted ? (AppState.drillSortAsc ? ' sorted-asc' : ' sorted-desc') : '');
            th.style.cursor = 'pointer';
            const icon = isSorted ? (AppState.drillSortAsc ? ' ▲' : ' ▼') : ' ↕';
            th.innerHTML = `<span style="display:inline-flex; align-items:center; gap:6px; justify-content:space-between; width:100%;">
                <span>${escapeHtml(colName)}</span>
                <span class="sort-icon" style="font-size:11px; opacity:${isSorted ? '1' : '0.45'}; color:${isSorted ? 'var(--blue)' : 'inherit'};">${icon}</span>
            </span>`;
            th.addEventListener('click', () => {
                if (AppState.drillSortCol === colIdx) {
                    AppState.drillSortAsc = !AppState.drillSortAsc;
                } else {
                    AppState.drillSortCol = colIdx;
                    AppState.drillSortAsc = true;
                }
                // الفرز يتم على الخادم الآن، ونعيد طلب الصفحة الأولى
                AppState.page = 0;
                if (AppState.selectedAgent) {
                    loadSingleAgentDrills(AppState.selectedAgent, AppState.selectedMetric);
                }
            });
            trHead.appendChild(th);
        });
        if (isAgbtMetric) {
            const thContrib = document.createElement('th');
            thContrib.textContent = I18N.currentLang === 'ar' ? 'المساهمة' : 'Contribution';
            thContrib.style.cursor = 'default';
            trHead.appendChild(thContrib);
        }
        head.appendChild(trHead);

        // الصفوف هنا هي "صفحة" جاهزة قادمة من الخادم — لا فلترة أو فرز إضافي على المتصفح
        const total = AppState.drillTotal || rawRows.length;
        const totalPages = Math.max(1, AppState.drillTotalPages || 1);
        if (matchCount) matchCount.textContent = `${total} ${I18N.currentLang === 'ar' ? 'صف' : 'rows'}`;
        if (noRows) noRows.hidden = total > 0;
        updatePaginationControls(AppState.page, totalPages);

        body.innerHTML = '';
        rawRows.forEach(rowCells => {
            const tr = document.createElement('tr');
            rawHeader.forEach((_, cIdx) => {
                const cell = rowCells[cIdx] == null ? '' : rowCells[cIdx];
                const td = document.createElement('td');
                const colName = rawHeader[cIdx] || '';
                td.innerHTML = formatDrillCell(cell, colName);
                tr.appendChild(td);
            });
            if (isAgbtMetric) {
                const tdContrib = document.createElement('td');
                tdContrib.className = 'agbt-contrib-cell';
                tdContrib.style.textAlign = 'center';
                const ticketId = ticketColIdx !== -1 ? String(rowCells[ticketColIdx] || '').trim() : '';
                const baseMins = basketColIdx !== -1 ? parseMinsValue(rowCells[basketColIdx]) : null;
                tdContrib.setAttribute('data-ticket-id', ticketId);
                tdContrib.setAttribute('data-base-mins', baseMins === null ? '' : String(baseMins));
                tdContrib.innerHTML = '<span style="color:var(--muted); font-size:11px;">⏳</span>';
                tr.appendChild(tdContrib);
            }
            body.appendChild(tr);
        });
        if (isAgbtMetric) loadAgbtAttribution();
    }

    // ============ تحليل مساهمة AGBT (نسبة ودقائق الوكيل في كل تكت) ============
    function loadAgbtAttribution() {
        const requestId = AppState.drillRequestId;
        const email = AppState.selectedAgent;
        if (!email) return;
        const cells = document.querySelectorAll('.agbt-contrib-cell');
        if (!cells.length) return;
        const ticketIds = [];
        const baseMins = [];
        cells.forEach(c => {
            const id = c.getAttribute('data-ticket-id');
            if (id) {
                ticketIds.push(id);
                baseMins.push(c.getAttribute('data-base-mins') || '');
            }
        });
        if (!ticketIds.length) {
            cells.forEach(c => { c.innerHTML = '<span style="color:var(--muted); opacity:0.6;">—</span>'; });
            return;
        }
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            dashboardReadRunner_()
                .withSuccessHandler(res => { if (requestId === AppState.drillRequestId) renderAgbtAttribution(res); })
                .withFailureHandler(err => {
                    if (requestId !== AppState.drillRequestId) return;
                    cells.forEach(c => { c.innerHTML = '<span style="color:var(--danger);font-size:11px;">' + escapeHtml(loadErrorText_(err)) + '</span>'; });
                })
                .getAgbtTicketAttribution(email, ticketIds, baseMins, AppState.selectedMonth || '');
        } else {
            cells.forEach(c => { c.innerHTML = '<span style="color:var(--muted); opacity:0.6; font-size:10px;">' + (I18N.currentLang === 'ar' ? 'منشور فقط' : 'Published only') + '</span>'; });
        }
    }

    function renderAgbtAttribution(res) {
        const cells = document.querySelectorAll('.agbt-contrib-cell');
        if (!res || !res.success || !Array.isArray(res.items)) {
            cells.forEach(c => { c.innerHTML = '<span style="color:var(--muted); opacity:0.6;">—</span>'; });
            return;
        }
        const map = {};
        res.items.forEach(it => { map[String(it.ticketId)] = it; });
        cells.forEach(c => {
            const id = c.getAttribute('data-ticket-id');
            const it = id ? map[id] : null;
            c.innerHTML = agbtContribHtml(it, id);
        });
    }

    function fmtMins(m) {
        return formatDuration(m);
    }

    // Break Exceed = المقياس الأساسي (دقائق). يتبع المفتاح العام Decimal ↔ Time.
    function breachExceedText(value) {
        if (isBlank(value)) return '—';
        const n = Number(value);
        if (!isFinite(n)) return '—';
        return formatDuration(n);
    }

    // معلومة إضافية: كم مرة حصل تجاوز للبريك
    function breachCountText(value) {
        const c = parseInt(value, 10) || 0;
        return I18N.t('breachCountLabel', { count: c });
    }

    function parseMinsValue(val) {
        if (val === null || val === undefined) return null;
        const s = String(val).trim();
        if (!s) return null;
        if (s.indexOf(':') !== -1) {
            const parts = s.split(':');
            const mm = parseFloat(parts[0]);
            const ss = parseFloat(parts[1] || '0');
            if (isNaN(mm)) return null;
            return Math.round((mm + ss / 60) * 100) / 100;
        }
        const n = parseFloat(s);
        return isNaN(n) ? null : n;
    }

    function agbtContribHtml(it, ticketId) {
        if (!it) {
            return '<span style="color:var(--muted); opacity:0.5; font-size:11px;">—</span>';
        }
        const baseStr = (it.baseMins !== null && it.baseMins !== undefined) ? String(it.baseMins) : '';
        const btn = '<button type="button" class="agbt-details-btn" data-ticket-id="' + escPeriod(ticketId) + '" data-base-mins="' + baseStr + '" style="display:inline-block; margin-top:3px; padding:2px 8px; font-size:10px; background:rgba(56,189,248,0.12); border:1px solid rgba(56,189,248,0.4); color:#38bdf8; border-radius:6px; cursor:pointer;">' + (I18N.currentLang === 'ar' ? 'تفاصيل' : 'Details') + '</button>';

        // لا توجد أي جلسات مسجلة لهذا التكت إطلاقاً
        if (!(it.totalMins > 0)) {
            return '<span style="color:var(--muted); opacity:0.5; font-size:11px;">—</span><br>' + btn;
        }

        // البيانات ناقصة أو لا يمكن حساب النسبة مقابل الرقم الأساسي
        if (it.dataIncomplete || it.agentPct === null || it.agentPct === undefined) {
            return '<span style="color:#fbbf24; font-size:11px; font-weight:600;" title="' + escPeriod(I18N.t('agbtIncompleteData')) + '">' + escPeriod(I18N.t('agbtUnavailable')) + '</span><br>' + btn;
        }

        const badge = it.isMainCause
            ? '<span style="display:inline-block; margin-top:2px; padding:1px 7px; font-size:9px; background:rgba(16,185,129,0.18); color:#34d399; border:1px solid rgba(16,185,129,0.4); border-radius:999px;">' + (I18N.currentLang === 'ar' ? 'المتسبب' : 'Main') + '</span>'
            : '';
        return '<div style="line-height:1.25;">'
            + '<div style="font-weight:700; color:#fff; font-size:12px; font-variant-numeric:tabular-nums;">' + fmtMins(it.agentMins) + '</div>'
            + '<div style="font-size:10px; color:var(--muted); font-variant-numeric:tabular-nums;">' + it.agentPct + '% ' + (I18N.currentLang === 'ar' ? 'من' : 'of') + ' ' + fmtMins(it.baseMins) + '</div>'
            + badge + '<br>' + btn
            + '</div>';
    }

    function openAgbtDetails(ticketId, baseMins) {
        const existing = document.getElementById('agbtDetailsOverlay');

        overlay.id = 'agbtDetailsOverlay';

        overlay.innerHTML = '<div style="background:#0d1527; border:1px solid var(--border); border-radius:16px; max-width:560px; width:100%; max-height:80vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 25px 60px rgba(0,0,0,0.6);">'

            + '<h3 style="margin:0; font-size:16px; color:#fff;">' + (I18N.currentLang === 'ar' ? 'تفاصيل التكت' : 'Ticket details') + ' <span style="color:var(--muted); font-weight:400; font-size:13px;" dir="ltr">#' + escPeriod(ticketId) + '</span></h3>'

    function renderAgbtDetails(res) {
        const b = document.getElementById('agbtDetailsBody');
        if (!b) return;
        if (!res || !res.success || !Array.isArray(res.agents) || !res.agents.length) {
            b.innerHTML = '<div style="color:var(--muted); padding:24px; text-align:center;">📭 ' + (I18N.currentLang === 'ar' ? 'لا توجد جلسات مسجلة لهذا التكت.' : 'No sessions found for this ticket.') + '</div>';
            return;
        }
        const base = Math.round((res.baseMins || 0) * 10) / 10;
        const total = Math.round((res.totalMins || 0) * 10) / 10;
        let html = '';
        if (res.dataIncomplete) {
            html += '<div style="margin-bottom:12px; padding:8px 10px; background:rgba(245,158,11,0.12); border:1px solid rgba(245,158,11,0.4); border-radius:8px; color:#fbbf24; font-size:12px;">⚠️ ' + escPeriod(I18N.t('agbtIncompleteData')) + '</div>';
        }
        html += '<div style="font-size:13px; color:var(--muted); margin-bottom:12px;">' + (I18N.currentLang === 'ar' ? 'قيمة التكت الأساسية:' : 'Ticket base value:') + ' <strong style="color:#fff;">' + fmtMins(base) + '</strong> · ' + (I18N.currentLang === 'ar' ? 'مجموع الجلسات:' : 'Sessions total:') + ' <strong style="color:' + (res.dataIncomplete ? '#fbbf24' : '#fff') + ';">' + fmtMins(total) + '</strong> · ' + res.agents.length + ' ' + (I18N.currentLang === 'ar' ? 'وكيل' : 'agents') + '</div>';
        res.agents.forEach((a, i) => {
            const isMain = a.isMainCause;
            const barPct = base > 0 ? Math.max(1, Math.round((a.mins / base) * 100)) : 0;
            html += '<div style="display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid rgba(51,65,85,0.4);">'
                + '<div style="width:22px; text-align:center; font-weight:700; color:var(--muted);">' + (i + 1) + '</div>'
                + '<div style="flex:1; min-width:0;">'
                + '<div style="display:flex; align-items:center; gap:6px;">'
                + '<span style="font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' + escPeriod(a.name || a.email) + '</span>'
                + (isMain ? '<span style="padding:1px 6px; font-size:9px; background:rgba(16,185,129,0.18); color:#34d399; border:1px solid rgba(16,185,129,0.4); border-radius:999px;">' + (I18N.currentLang === 'ar' ? 'المتسبب الأكبر' : 'Top') + '</span>' : '')
                + '</div>'
                + '<div style="margin-top:3px; height:5px; background:rgba(255,255,255,0.06); border-radius:999px; overflow:hidden;"><div style="height:100%; width:' + barPct + '%; background:' + (isMain ? '#34d399' : '#38bdf8') + '; border-radius:999px;"></div></div>'
                + '</div>'
                + '<div style="text-align:right; font-variant-numeric:tabular-nums;">'
                + '<div style="font-weight:700; color:#fff; font-size:12px;">' + fmtMins(a.mins) + '</div>'
                + '<div style="font-size:10px; color:var(--muted);">' + (a.pct !== null && a.pct !== undefined ? a.pct + '%' : '—') + '</div>'
                + '</div>'
                + '</div>';
        });
        b.innerHTML = html;
    }

        const isAr = I18N.currentLang === 'ar';

        // CSAT
        const csatVal = d.csat != null ? d.csat : (d.csatPct != null ? Math.round(d.csatPct) : null);
        const csatGood = Number(d.csatGood) || 0;
        const csatBad = Number(d.csatBad) || 0;
        const csatTotal = Number(d.csatTotal) || (csatGood + csatBad);
        const csatRatio = csatTotal > 0 ? Math.round((csatGood / csatTotal) * 100) : (csatVal || 0);

        // ABST
        let abstStr = '—';
        let abstSub = isAr ? 'متوسط مدة المحادثة' : 'Avg chat duration';
        if (d.abstMins && d.abstMins > 0) {
            const m = Number(d.abstMins);
            const totalSecs = Math.round(m * 60);
            const mins = Math.floor(totalSecs / 60);
            const secs = totalSecs % 60;
            abstStr = mins + (isAr ? 'د ' : 'm ') + (secs > 0 ? secs + (isAr ? 'ث' : 's') : '');
            abstSub = (m / 60).toFixed(2) + (isAr ? ' ساعة • سلة الجلسة' : ' hrs • Basket session');

            const secs = totalSecs % 60;
            abstStr = mins + (isAr ? 'د ' : 'm ') + (secs > 0 ? secs + (isAr ? 'ث' : 's') : '');
            abstSub = (totalSecs / 3600).toFixed(2) + (isAr ? ' ساعة • سلة الجلسة' : ' hrs • Basket session');

        // AGBT
        let agbtStr = '—';
        let agbtSub = isAr ? 'متوسط معالجة السلة' : 'Avg basket duration';

        const longSessions = Number(d.long || d.longSessions) || 0;
        const longPct = sessions > 0 ? Math.round((longSessions / sessions) * 100) : 0;

        // Break
        const breakBreaches = Number(d.breakBreaches) || 0;
        const breakExceedMins = Number(d.breakExceedMins) || 0;

        grid.innerHTML = `

                    ${csatVal !== null ? csatVal + '%' : '—'}

                <div class="chart-drill-kpi-head">
                    <span class="chart-drill-kpi-icon">⏱️</span>
                    <span class="chart-drill-kpi-label">${isAr ? 'وقت الجلسة (ABST)' : 'Avg Session Time'}</span>
                </div>
                <div class="chart-drill-kpi-val val-blue">${abstStr}</div>
                <div class="chart-drill-kpi-sub">
                    ${abstSub}
                </div>
            </div>

            <div class="chart-drill-kpi-card kpi-agbt">
                <div class="chart-drill-kpi-head">
                    <span class="chart-drill-kpi-icon">🛒</span>
                    <span class="chart-drill-kpi-label">${isAr ? 'سلة التذاكر (AGBT)' : 'General Basket Time'}</span>
                </div>
                <div class="chart-drill-kpi-val val-purple">${agbtStr}</div>
                <div class="chart-drill-kpi-sub">
                    ${agbtSub}

                <div class="chart-drill-kpi-val val-cyan">${sessions}</div>

                </div>

            <div class="chart-drill-kpi-card kpi-lateness">

    function setupDrilldownTabs(dateStr, email, activeMetric) {
        const tabsContainer = document.getElementById('chartDrillTabs');
        const filter20mBtn = document.getElementById('chartDrillFilter20m');
        if (filter20mBtn) {
            filter20mBtn.classList.toggle('active', !!AppState.drilldownFilter20m);
            filter20mBtn.onclick = () => {
                AppState.drilldownFilter20m = !AppState.drilldownFilter20m;
                filter20mBtn.classList.toggle('active', !!AppState.drilldownFilter20m);
                loadChartDrilldownTickets(dateStr, email, AppState.drilldownActiveMetric || activeMetric, ++AppState.drilldownRequestId);
            };
        }
        if (!tabsContainer) return;
        tabsContainer.querySelectorAll('.chart-drill-tab-btn').forEach(btn => {
            const m = btn.getAttribute('data-metric');
            btn.classList.toggle('active', m === activeMetric);
            btn.onclick = () => {
                tabsContainer.querySelectorAll('.chart-drill-tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                AppState.drilldownActiveMetric = m;
                loadChartDrilldownTickets(dateStr, email, m, ++AppState.drilldownRequestId);
            };
        });
    }

    function loadChartDrilldownTickets(dateStr, email, metric, requestId) {
        const container = document.getElementById('chartDrilldownTicketsContainer');
        if (!container) return;
        const isAr = I18N.currentLang === 'ar';

        container.innerHTML = '<div class="chart-drilldown-state chart-drilldown-loading">⏳ ' + escPeriod(I18N.t('drillLoading')) + '</div>';

        // 1. Check local preview mock tickets
        if (typeof window !== 'undefined' && typeof window.__LOCAL_PREVIEW_GET_TICKETS__ === 'function') {
            const mockRes = window.__LOCAL_PREVIEW_GET_TICKETS__(dateStr, email, metric);
            if (mockRes && Array.isArray(mockRes.rows) && mockRes.rows.length > 0) {
                let rows = mockRes.rows;
                if (AppState.drilldownFilter20m) {
                    rows = rows.filter(r => (r.durationMins >= 20 || (r.score && String(r.score).includes('20'))));
                }
                renderChartDrilldownTickets({ success: true, rows: rows, total: rows.length }, metric);
                return;
            }
        }

        // 2. Check localStorage raw json
        try {
            const rawJson = getStoredRawJson();
            if (rawJson) {
                const parsed = JSON.parse(rawJson.replace(/^\uFEFF/, ''));
                const rawResults = parsed.results || (Array.isArray(parsed) && parsed[0]?.metric ? parsed : (parsed.header ? [parsed] : []));
                const target = String(email || '').toLowerCase().trim();
                const sourceMetric = chartDrilldownSourceMetric_(metric);
                const rec = (Array.isArray(rawResults) ? rawResults : []).find(r => {
                    const rAgent = String(r.agent || '').toLowerCase().trim();
                    const rMetric = String(r.metric || '').toLowerCase().trim();
                    return (rAgent === target || target.includes(rAgent) || rAgent.includes(target.split('@')[0])) && (rMetric === sourceMetric || rMetric === metric);
                });
                if (rec && Array.isArray(rec.rows)) {
                    const header = rec.header || [];
                    const ticketIdx = findTicketIdCol(header);
                    const timeIdx = findSessionMinsCol(header);
                    const chanIdx = findColIndex(header, 'ticket_channel', 'channel');
                    const scoreIdx = findColIndex(header, 'csat_adjusted', 'csat', 'score');

                    const rows = [];
                    for (const row of rec.rows) {
                        const rowDay = extractRowDate(row, header);
                        if (rowDay !== dateStr) continue;
                        if ((metric === 'long' || AppState.drilldownFilter20m) && !isLongSessionRow_(row, header) && !(durationMins >= 20)) continue;

                        let durationMins = null;
                        if (timeIdx !== -1) {
                            const raw = String(row[timeIdx] == null ? '' : row[timeIdx]).trim();
                            if (raw.indexOf(':') !== -1) {
                                const parts = raw.split(':');
                                const hh = parseFloat(parts[0]);
                                const mm = parseFloat(parts[1]);
                                if (!isNaN(hh) || !isNaN(mm)) durationMins = (isNaN(hh) ? 0 : hh) * 60 + (isNaN(mm) ? 0 : mm);
                            } else {
                                const n = parseFloat(raw);
                                if (!isNaN(n)) durationMins = n;
                            }
                        }

                        rows.push({
                            ticket: ticketIdx !== -1 ? String(row[ticketIdx] == null ? '' : row[ticketIdx]) : '',
                            datetime: extractRowTimestamp(row, header) || rowDay,
                            durationMins: durationMins,
                            channel: chanIdx !== -1 ? String(row[chanIdx] == null ? '' : row[chanIdx]) : '',
                            score: scoreIdx !== -1 ? String(row[scoreIdx] == null ? '' : row[scoreIdx]) : ''
                        });
                        if (rows.length >= 200) break;
                    }
                    if (rows.length > 0) {
                        renderChartDrilldownTickets({ success: true, rows: rows, total: rows.length }, metric);
                        return;
                    }
                }
            }
        } catch (e) { /* ignore */ }

        // 3. Google Apps Script server request
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            const payload = {
                month: AppState.selectedMonth || '',
                agent: email,
                metric: metric,
                grouping: 'day',
                date: dateStr
            };
            dashboardReadRunner_()
                .withSuccessHandler(res => {
                    if (requestId !== AppState.drilldownRequestId) return;
                    renderChartDrilldownTickets(res, metric);
                })
                .withFailureHandler(() => {
                    if (requestId !== AppState.drilldownRequestId) return;
                    container.innerHTML = '<div class="chart-drilldown-state chart-drilldown-empty">ℹ️ '
                        + (isAr ? 'تم عرض ملخص جميع المقاييس لهذا اليوم بالأعلى بنجاح.' : 'All metrics summary is displayed above.') + '</div>';
                })
                .getAgentChartDrilldown(payload);
        } else {
            // Local preview or offline without tickets
            container.innerHTML = '<div class="chart-drilldown-state chart-drilldown-empty">ℹ️ '
                + (isAr ? 'تم عرض ملخص جميع المقاييس لهذا اليوم بالأعلى بنجاح.' : 'All metrics summary is displayed above.') + '</div>';
        }
    }

        html += '<th>' + escPeriod(I18N.t('drillColChannel')) + '</th>';
        html += '</tr></thead><tbody>';

        rows.forEach((r, i) => {

    function findColIndex(headers, ...candidates) {
        return findHeaderCol(headers, ...candidates);
    }

    function findTicketIdCol(header) {
        return findColIndex(header, 'ticket_id', 'ticket id', 'session_id', 'session id', 'ticket_number', 'ticket number', 'ticket');
    }

    function findSessionMinsCol(header) {
        return findColIndex(header, 'basket_session_time_min', 'basket_session_time', 'session_time_min', 'session_time', 'abst', 'time');
    }

    function isLongSessionRow_(row, header) {
        if (!row || !header) return false;
        const h = header.map(c => String(c).toLowerCase().trim());
        const minsIdx = findSessionMinsCol(header);
        const over20Idx = h.findIndex(c => c === '> 20' || c.includes('> 20') || c.includes('over_20'));
        if (minsIdx !== -1) {
            const raw = String(row[minsIdx] == null ? '' : row[minsIdx]).trim();
            let m = parseFloat(raw);
            if (raw.includes(':')) {
                const parts = raw.split(':');
                const hh = parseFloat(parts[0]);
                const mm = parseFloat(parts[1]);
                if (!isNaN(hh) || !isNaN(mm)) m = (isNaN(hh) ? 0 : hh) * 60 + (isNaN(mm) ? 0 : mm);
            }
            if (!isNaN(m) && m >= 20) return true;
        }
        if (over20Idx !== -1) {
            const v = String(row[over20Idx] || '').toLowerCase().trim();
            if (v === 'high' || v === 'yes' || v === 'true' || v === '1') return true;
        }
        return false;
    }

    function findHeaderCol(headers, ...candidates) {
        if (!Array.isArray(headers)) return -1;
        const lowerHeaders = headers.map(h => String(h).toLowerCase().trim());
        for (const candidate of candidates) {
            const target = candidate.toLowerCase();
            const idx = lowerHeaders.findIndex(h => h === target || h.includes(target));
            if (idx !== -1) return idx;
        }
        return -1;
    }

    function extractCellDate(row, headers) {
        if (!row || !headers) return null;
        const h = headers.map(c => String(c).toLowerCase().trim());
        const priorityNames = ['day', 'report_dt', 'ticket_creation_date', 'date_resolved_dubai', 'created_at_dubai', 'csat_submitted_at_dubai', 'shift_date', 'plan_shift_start', 'fact_shift_start', 'date'];
        for (const name of priorityNames) {
            const idx = h.findIndex(c => c === name || c.includes(name));
            if (idx !== -1 && row[idx]) {
                const str = String(row[idx]).trim();
                const m = str.match(/\b\d{4}-\d{2}-\d{2}\b/);
                if (m) return m[0];
            }
        }
        for (let idx = 0; idx < h.length; idx++) {
            const col = h[idx];
            if (col.includes('date') || col.includes('day') || col.includes('dt') || col.includes('time')) {
                const str = String(row[idx] || '').trim();
                const m = str.match(/\b\d{4}-\d{2}-\d{2}\b/);
                if (m) return m[0];
            }
        }
        return null;
    }

    function formatChannelBadge(channelVal) {
        if (!channelVal || String(channelVal).trim() === '' || channelVal === '—') {
            return `<span style="color:var(--muted); opacity:0.6;">—</span>`;
        }
        const text = String(channelVal).trim();
        const lower = text.toLowerCase();
        if (lower === 'chat' || lower.includes('chat') || lower.includes('محادثة')) {
            return `<span style="color:#0284c7; font-weight:600; display:inline-flex; align-items:center; gap:4px;">💬 Chat</span>`;
        }
        if (lower === 'phone' || lower === 'voice' || lower.includes('phone') || lower.includes('voice') || lower.includes('call') || lower.includes('هاتف') || lower.includes('صوت')) {
            return `<span style="color:#7c3aed; font-weight:600; display:inline-flex; align-items:center; gap:4px;">📞 Phone</span>`;
        }
        if (lower === 'email' || lower.includes('mail') || lower.includes('بريد')) {
            return `<span style="color:#d97706; font-weight:600; display:inline-flex; align-items:center; gap:4px;">✉️ Email</span>`;
        }
        return escapeHtml(text);
    }

    function formatDrillCell(val, colName) {
        if (val === null || val === undefined || String(val).trim() === '' || val === '—') {
            return `<span style="color:var(--muted); opacity:0.6;">—</span>`;
        }
        const text = String(val).trim();
        const lower = text.toLowerCase();
        const lowerCol = String(colName || '').toLowerCase();

        // 1. Compliance & Met status
        if (lower === 'met') {
            return `<span class="badge" style="background:rgba(16, 185, 129, 0.15); color:#34d399; border:1px solid rgba(16, 185, 129, 0.3);">✓ Met</span>`;
        } else if (lower === 'not met' || lower === 'breached' || lower.includes('breach')) {
            return `<span class="badge" style="background:rgba(239, 68, 68, 0.15); color:#f87171; border:1px solid rgba(239, 68, 68, 0.3);">✕ ${text}</span>`;
        }

        // 2. CSAT Score
        if (lowerCol.includes('csat') || lowerCol.includes('score')) {
            if (lower === 'good' || lower === '5' || lower === '4' || lower === 'positive' || lower.includes('ممتاز') || lower.includes('جيد')) {
                return `<span class="badge" style="background:rgba(16, 185, 129, 0.15); color:#34d399; border:1px solid rgba(16, 185, 129, 0.3);">✓ ${text}</span>`;
            } else if (lower === 'bad' || lower === '1' || lower === '2' || lower === 'negative' || lower.includes('سيء')) {
                return `<span class="badge" style="background:rgba(239, 68, 68, 0.15); color:#f87171; border:1px solid rgba(239, 68, 68, 0.3);">✕ ${text}</span>`;
            }
        }

        // 2b. Status Before Closure / Ticket Status (Solved = أخضر, Pending = أصفر)
        if (lowerCol.includes('status') || lower === 'solved' || lower === 'pending') {
            if (lower === 'solved' || lower.includes('solved') || lower.includes('محلول')) {
                return `<span class="badge badge-solved badge-success" style="background:rgba(16, 185, 129, 0.15); color:#34d399; border:1px solid rgba(16, 185, 129, 0.3); font-weight:600; padding:2px 8px; border-radius:6px; display:inline-flex; align-items:center; gap:4px;">✓ ${escapeHtml(text)}</span>`;
            }
            if (lower === 'pending' || lower.includes('pending') || lower.includes('معلق') || lower.includes('انتظار')) {
                return `<span class="badge badge-pending badge-warning" style="background:rgba(245, 158, 11, 0.15); color:#fbbf24; border:1px solid rgba(245, 158, 11, 0.3); font-weight:600; padding:2px 8px; border-radius:6px; display:inline-flex; align-items:center; gap:4px;">⏳ ${escapeHtml(text)}</span>`;
            }
            if (lower === 'closed' || lower.includes('closed') || lower.includes('مغلق')) {
                return `<span class="badge badge-status-neutral" style="background:rgba(148, 163, 184, 0.15); color:#94a3b8; border:1px solid rgba(148, 163, 184, 0.3); font-weight:600; padding:2px 8px; border-radius:6px;">${escapeHtml(text)}</span>`;
            }
            if (lower === 'hold' || lower.includes('hold')) {
                return `<span class="badge badge-danger" style="background:rgba(239, 68, 68, 0.15); color:#f87171; border:1px solid rgba(239, 68, 68, 0.3); font-weight:600; padding:2px 8px; border-radius:6px;">⏸ ${escapeHtml(text)}</span>`;
            }
            if (lower === 'open' || lower.includes('open') || lower.includes('مفتوح')) {
                return `<span class="badge" style="background:rgba(56, 189, 248, 0.15); color:#38bdf8; border:1px solid rgba(56, 189, 248, 0.3); font-weight:600; padding:2px 8px; border-radius:6px;">● ${escapeHtml(text)}</span>`;
            }
        }

        // 3. Channel
        if (lowerCol.includes('channel') || lowerCol === 'chan') {
            return formatChannelBadge(text);
        }

        // 4. Country
        if (lowerCol === 'country' || lowerCol === 'ticket_country') {
            if (lower === 'ksa') return `<span style="font-weight:600;">🇸🇦 KSA</span>`;
            if (lower === 'uae') return `<span style="font-weight:600;">🇦🇪 UAE</span>`;
        }

        // 5. Hour durations (تُعرض حسب الوضع العالمي: Decimal أو Time)
        if (lowerCol.includes('not_working') || lowerCol.includes('idle') || lowerCol === 'basket_time_h' || lowerCol === 'fact_breaks_h') {
            const num = parseFloat(text);
            if (!isNaN(num)) {
                const mins = num * 60;
                const display = formatDuration(mins);
                const alt = formatDuration(mins, AppState.timeMode === 'time' ? 'decimal' : 'time');
                return `<span title="${escapeHtml(text)} (${escapeHtml(alt)})" style="font-family:'JetBrains Mono',monospace;">${escapeHtml(display)}</span>`;
            }
        }

        // 6. Long float numbers
        if (/^\d+\.\d{3,}$/.test(text)) {
            const num = parseFloat(text);
            if (!isNaN(num)) {
                return `<span title="${escapeHtml(text)}" style="font-family:'JetBrains Mono',monospace;">${num.toFixed(2)}</span>`;
            }
        }

        return escapeHtml(text);
    }

    function downloadTableCsv() {
        const table = el('dataTable');
        if (!table) return;

        let csv = '';
        const rows = table.querySelectorAll('tr');
        rows.forEach(r => {
            const cells = [...r.querySelectorAll('th, td')].map(c => `"${c.innerText.replace(/"/g, '""')}"`);
            csv += cells.join(',') + '\r\n';
        });

        const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Agent_Metrics_${(AppState.selectedAgent || 'All_Agents').replace(/[^a-zA-Z0-9]/g, '_')}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    function loadSingleAgentDrills(email, metric) {
        if (AppState.sheetLoading) return;
        const requestId = ++AppState.drillRequestId;
        AppState.drillError = '';
        // مقياس "all" في وضع الوكيل الفردي يفتح CSAT افتراضياً
        const targetMetric = (metric === 'all') ? 'csat' : metric;

        AppState.drillLoading = true;
        AppState.activeDrillData = null;
        AppState.drillLoadKey = `${email}::${metric}`;
        renderDetailTableOnly();

        const opts = {
            page: AppState.page,
            pageSize: AppState.pageSize,
            month: AppState.selectedMonth || '',
            search: AppState.searchQuery,
            datePreset: AppState.detailFilters.datePreset,
            csatScore: AppState.detailFilters.csatScore,
            channel: AppState.detailFilters.channel,
            topSessions: AppState.detailFilters.topSessions,
            sortColIdx: AppState.drillSortCol != null ? AppState.drillSortCol : '',
            sortAsc: AppState.drillSortAsc
        };

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            dashboardReadRunner_()
                .withSuccessHandler((res) => {
                    if (requestId !== AppState.drillRequestId || AppState.drillLoadKey !== `${email}::${metric}` ||
                        AppState.selectedAgent !== email ||
                        AppState.selectedMetric !== metric) {
                        return;
                    }
                    AppState.drillLoading = false;
                    if (res && res.success) {
                        AppState.activeDrillData = {
                            found: res.found,
                            header: res.header || [],
                            rows: res.rows || []
                        };
                        AppState.drillTotal = res.total || 0;
                        AppState.drillTotalPages = res.totalPages || 1;
                        AppState.page = res.page || 0;
                    } else {
                        AppState.activeDrillData = { found: false, header: [], rows: [] };
                        AppState.drillTotal = 0;
                        AppState.drillTotalPages = 1;
                    }
                    renderDetailTableOnly();
                })
                .withFailureHandler(err => {
                    if (requestId !== AppState.drillRequestId || AppState.drillLoadKey !== `${email}::${metric}` ||
                        AppState.selectedAgent !== email ||
                        AppState.selectedMetric !== metric) {
                        return;
                    }
                    AppState.drillLoading = false;
                    AppState.drillError = loadErrorText_(err);
                    AppState.activeDrillData = { found: false, header: [], rows: [] };
                    AppState.drillTotal = 0;
                    AppState.drillTotalPages = 1;
                    renderDetailTableOnly();
                })
                .getAgentDrillPageFromSheet(email, targetMetric, opts);
        } else {
            // وضع المعاينة المحلي: محاكاة نفس سلوك الخادم (فلترة + ترتيب + ترقيم صفحات)
            const sim = paginateLocally(email, targetMetric, opts);
            AppState.drillLoading = false;
            AppState.activeDrillData = {
                found: sim.total > 0,
                header: sim.header,
                rows: sim.rows
            };
            AppState.drillTotal = sim.total;
            AppState.drillTotalPages = sim.totalPages;
            AppState.page = sim.page;
            renderDetailTableOnly();
        }
    }

    /**
     * فلترة وترتيب وترقيم صفحات محلي (لوضع المعاينة فقط) — مطابق لمنطق الخادم.
     */
    function paginateLocally(email, metric, opts) {
        opts = opts || {};
        const page = Math.max(0, parseInt(opts.page, 10) || 0);
        const pageSize = Math.min(500, Math.max(10, parseInt(opts.pageSize, 10) || 50));
        const search = String(opts.search || '').toLowerCase().trim();

        let target = null;
        try {
            const rawJson = getStoredRawJson();
            if (rawJson) {
                const parsed = JSON.parse(rawJson.replace(/^\uFEFF/, ''));
                const rawResults = parsed.results || (Array.isArray(parsed) && parsed[0]?.metric ? parsed : (parsed.header ? [parsed] : []));
                target = (Array.isArray(rawResults) ? rawResults : []).find(r => {
                    const rAgent = String(r.agent || '').toLowerCase().trim();
                    const rMetric = String(r.metric || '').toLowerCase().trim();
                    const tAgent = String(email || '').toLowerCase().trim();
                    const tMetric = String(metric || '').toLowerCase().trim();
                    return (rAgent === tAgent || tAgent.includes(rAgent) || rAgent.includes(tAgent.split('@')[0])) &&
                           (rMetric === tMetric);
                });
            }
        } catch (e) {}

        if (!target || !Array.isArray(target.rows) || !target.rows.length) {
            return { header: [], rows: [], total: 0, totalPages: 1, page: 0 };
        }

        const header = Array.isArray(target.header) ? target.header : [];
        const rows = target.rows;
        const csatIdx = findHeaderCol(header, 'csat_adjusted', 'csat', 'score');
        const chanIdx = findHeaderCol(header, 'ticket_channel', 'channel');
        let timeIdx = -1;
        if (metric === 'agbt') {
            timeIdx = findHeaderCol(header, 'sum_basket_time_for_ticket_per_hour_min_ONLINE_WOMT', 'sum_basket_time_for_ticket_per_hour_min', 'basket_time', 'agbt', 'time');
        } else if (metric === 'abst') {
            timeIdx = findHeaderCol(header, 'basket_session_time_min', 'session_time', 'basket_session_time', 'abst', 'time');
        }

        let filtered = rows.filter(row => {
            if (search) {
                const hit = row.some(cell => String(cell || '').toLowerCase().includes(search));
                if (!hit) return false;
            }
            const fltCsat = opts.csatScore || 'all';
            if (fltCsat !== 'all') {
                const val = csatIdx !== -1 ? String(row[csatIdx] || '').toLowerCase().trim() : '';
                const isGood = (val === 'good' || val === '5' || val === '4' || val === 'positive' || val.includes('ممتاز') || val.includes('جيد'));
                const isBad = (val === 'bad' || val === '1' || val === '2' || val === 'negative' || val.includes('سيء'));
                if (fltCsat === 'good' && !isGood) return false;
                if (fltCsat === 'bad' && !isBad) return false;
            }
            const fltChan = opts.channel || 'all';
            if (fltChan !== 'all' && chanIdx !== -1) {
                const cellChan = String(row[chanIdx] || '').toLowerCase().trim();
                const filterChan = fltChan.toLowerCase();
                if (filterChan === 'phone') {
                    if (cellChan !== 'phone' && cellChan !== 'voice' && !cellChan.includes('phone') && !cellChan.includes('voice')) return false;
                } else if (cellChan !== filterChan) {
                    return false;
                }
            }
            const fltDate = opts.datePreset || 'all';
            if (fltDate !== 'all') {
                const d = extractCellDate(row, header);
                if (!d) return false;
                const today = new Date().toISOString().slice(0, 10);
                if (fltDate === 'today' && d !== today) return false;
                if (fltDate === 'yesterday') {
                    const y = new Date(); y.setDate(y.getDate() - 1);
                    if (d !== y.toISOString().slice(0, 10)) return false;
                }
            }
            return true;
        });

        const top = opts.topSessions || 'all';
        if (top !== 'all' && timeIdx !== -1) {
            if (top === 'above20' || top === '20m') {
                filtered = filtered.filter(row => {
                    const secs = parseTimeToSeconds(row[timeIdx]);
                    if (secs >= 20 * 60) return true;
                    if (typeof isLongSessionRow_ === 'function' && isLongSessionRow_(row, header)) return true;
                    return false;
                });
            } else {
                filtered.sort((a, b) => parseTimeToSeconds(b[timeIdx]) - parseTimeToSeconds(a[timeIdx]));
                const n = top === 'top5' ? 5 : 10;
                filtered = filtered.slice(0, n);
            }
        }

        const sortIdx = (opts.sortColIdx !== undefined && opts.sortColIdx !== null && opts.sortColIdx !== '') ? parseInt(opts.sortColIdx, 10) : -1;
        if (sortIdx >= 0) {
            const asc = opts.sortAsc !== false;
            filtered.sort((a, b) => {
                let va = a[sortIdx], vb = b[sortIdx];
                if (typeof va === 'string' && va.includes(':')) {
                    va = parseTimeToSeconds(va);
                    vb = parseTimeToSeconds(vb);
                } else if (!isNaN(parseFloat(va)) && !String(va).includes('#') && !String(va).includes('-')) {
                    va = parseFloat(va); vb = parseFloat(vb);
                } else {
                    va = String(va || '').toLowerCase(); vb = String(vb || '').toLowerCase();
                }
                if (va < vb) return asc ? -1 : 1;
                if (va > vb) return asc ? 1 : -1;
                return 0;
            });
        }

        const total = filtered.length;
        const totalPages = Math.max(1, Math.ceil(total / pageSize));
        const safePage = Math.min(page, totalPages - 1);
        const start = safePage * pageSize;
        const pageRows = filtered.slice(start, start + pageSize);

        return { header, rows: pageRows, total, totalPages, page: safePage };
    }

    /**
     * شاشة الإحصائيات المتقدمة والرسوم البيانية (Analytics View)
     */
    function renderAnalyticsView() {
        if (AppState.sheetLoading) return;
        if (!AppState.agents || AppState.agents.length === 0) return;
        if (el('analyticsContent')) el('analyticsContent').hidden = false;

        const selectedAgentEmail = (el('analyticsAgentSelect') ? el('analyticsAgentSelect').value : '').trim().toLowerCase();
        let targetAgents = AppState.agents;
        const isSingleAgent = Boolean(selectedAgentEmail && AppState.agents.some(a => (a.email || '').toLowerCase() === selectedAgentEmail));

        // خيار "حسب الشفت" متاح للوكيل الفردي فقط (All Agents يبقى تقويمياً)
        updateShiftModeAvailability(isSingleAgent);

        if (isSingleAgent) {
            targetAgents = AppState.agents.filter(a => (a.email || '').toLowerCase() === selectedAgentEmail);
            // جلب الخط الزمني الخاص بهذا الوكيل حصرياً (حتى لا يتم دمج بقية الوكلاء)
            loadSingleAgentAnalytics(selectedAgentEmail);
        } else {
            // إبطال أي طلب إحصائيات سابق لوكيل مفرد حتى لا يكتب فوق بيانات الفريق
            AppState.analyticsRequestId++;
            AppState.analyticsLoadKey = '';
            AppState.analyticsError = '';
            AppState.chartDays = AppState.historicalDays;
            AppState.analyticsLoading = false;
        }

        // All Agents: أخفِ بطاقات KPI العلوية واعرض أرقام الفريق داخل مربع الإحصائيات السفلي
        const heroGrid = el('analyticsHeroGrid');
        if (heroGrid) heroGrid.style.display = isSingleAgent ? '' : 'none';
        document.querySelectorAll('.team-kpi-stat').forEach(b => { b.style.display = isSingleAgent ? 'none' : ''; });

        if (isSingleAgent) {
            // ========================================================
            // 1. عرض بطاقات الوكيل الفردي المختار بدقة
            // ========================================================
            const agent = targetAgents[0];
            const csatVal = Number(agent.csat) || 0;
            const csatDisplay = isBlank(agent.csat) ? '—' : `${csatVal.toFixed(1)}%`;
            if (el('kpiCsatVal')) el('kpiCsatVal').textContent = csatDisplay;
            if (el('kpiCsatFill')) el('kpiCsatFill').style.width = `${Math.min(100, csatVal)}%`;

            const lateVal = parseFloat(agent.lateness) || 0;
            if (el('kpiLatenessVal')) el('kpiLatenessVal').textContent = fmtMinutes(agent.lateness);
            if (el('kpiLatenessFill')) el('kpiLatenessFill').style.width = `${Math.min(100, (lateVal / 30) * 100)}%`;

            const breachMins = Number(agent.breakExceedMins) || 0;
            const breachCount = parseInt(agent.breakBreach, 10) || 0;
            if (el('kpiBreachVal')) el('kpiBreachVal').textContent = breachExceedText(agent.breakExceedMins);
            if (el('kpiBreachCount')) el('kpiBreachCount').textContent = breachCountText(breachCount);
            if (el('kpiBreachFill')) el('kpiBreachFill').style.width = `${Math.min(100, breachMins * 2)}%`;

            const agbtStr = agent.agbt || "00:00";
            if (el('kpiAgbtVal')) el('kpiAgbtVal').textContent = isBlank(agent.agbt) ? '—' : fmtTimeStr(agent.agbt);
            const agbtSecs = parseTimeToSeconds(agbtStr);
            if (el('kpiAgbtFill')) el('kpiAgbtFill').style.width = `${Math.min(100, (agbtSecs / 600) * 100)}%`;

            if (el('kpiIdleVal')) el('kpiIdleVal').textContent = fmtHours(agent.idle);
            const idleForFill = parseFloat(agent.idle) || (hoursValueToMinutes(agent.idle) / 60) || 0;
            if (el('kpiIdleFill')) el('kpiIdleFill').style.width = `${Math.min(100, (idleForFill / 2) * 100)}%`;
        } else {
            // ========================================================
            // 2. عرض إجماليات ومتوسطات الفريق بالكامل
            // ========================================================
            let totalCsat = 0, countCsat = 0, highCsatCount = 0;
            let totalLate = 0;
            let totalBreaches = 0;
            let totalBreachMins = 0;

            AppState.agents.forEach(a => {
                const cVal = Number(a.csat) || 0;
                if (cVal > 0) {
                    totalCsat += cVal;
                    countCsat++;
                    if (cVal >= 90) highCsatCount++;
                }
                totalLate += (parseFloat(a.lateness) || 0);
                totalBreaches += (parseInt(a.breakBreach, 10) || 0);
                totalBreachMins += (Number(a.breakExceedMins) || 0);
            });

            const avgCsat = countCsat > 0 ? (totalCsat / countCsat).toFixed(1) : 0;
            if (el('kpiCsatVal')) el('kpiCsatVal').textContent = countCsat > 0 ? `${avgCsat}%` : '—';
            if (el('kpiCsatFill')) el('kpiCsatFill').style.width = `${avgCsat}%`;

            if (el('kpiLatenessVal')) el('kpiLatenessVal').textContent = fmtMinutes(totalLate);
            if (el('kpiLatenessFill')) el('kpiLatenessFill').style.width = `${Math.min(100, (totalLate / (AppState.agents.length * 10 || 1)) * 100)}%`;

            if (el('kpiBreachVal')) el('kpiBreachVal').textContent = breachExceedText(totalBreachMins);
            if (el('kpiBreachCount')) el('kpiBreachCount').textContent = breachCountText(totalBreaches);
            if (el('kpiBreachFill')) el('kpiBreachFill').style.width = `${Math.min(100, (totalBreachMins / (AppState.agents.length * 30 || 1)) * 100)}%`;

            // AGBT الفعلي: متوسط كل الوكلاء
            let agbtSecsSum = 0, agbtCount = 0;
            AppState.agents.forEach(a => {
                const secs = parseTimeToSeconds(a.agbt);
                if (secs !== 999999 && secs > 0) { agbtSecsSum += secs; agbtCount++; }
            });
            const agbtAvgSecs = agbtCount > 0 ? Math.round(agbtSecsSum / agbtCount) : 0;
            if (el('kpiAgbtVal')) el('kpiAgbtVal').textContent = formatDuration(agbtAvgSecs / 60);
            if (el('kpiAgbtFill')) el('kpiAgbtFill').style.width = `${Math.min(100, (agbtAvgSecs / 600) * 100)}%`;

            // Idle الفعلي: متوسط كل الوكلاء
            let idleHoursSum = 0, idleCount = 0;
            AppState.agents.forEach(a => {
                const h = (hoursValueToMinutes(a.idle) || 0) / 60;
                if (h > 0) {
                    idleHoursSum += h;
                    idleCount++;
                }
            });
            const idleAvgHours = idleCount > 0 ? (idleHoursSum / idleCount) : 0;
            if (el('kpiIdleVal')) el('kpiIdleVal').textContent = formatDuration(idleAvgHours * 60);
            if (el('kpiIdleFill')) el('kpiIdleFill').style.width = `${Math.min(100, (idleAvgHours / 2) * 100)}%`;

            // ABST الفعلي: متوسط كل الوكلاء
            let abstSecsSum = 0, abstCount = 0;
            AppState.agents.forEach(a => {
                const secs = parseTimeToSeconds(a.abst);
                if (secs !== 999999 && secs > 0) { abstSecsSum += secs; abstCount++; }
            });
            const abstAvgSecs = abstCount > 0 ? Math.round(abstSecsSum / abstCount) : 0;

            // نقل أرقام الفريق إلى مربع الإحصائيات السفلي (بديل بطاقات KPI العلوية)
            let totalGoodCsat = 0, totalBadCsat = 0, totalEvalCsat = 0;
            AppState.agents.forEach(a => {
                totalGoodCsat += Number(a.csatGood) || 0;
                totalBadCsat += Number(a.csatBad) || 0;
            });
            totalEvalCsat = totalGoodCsat + totalBadCsat;
            const trueTeamCsat = totalEvalCsat > 0
                ? (Math.round((totalGoodCsat / totalEvalCsat) * 100 * 10) / 10).toFixed(1)
                : (AppState.overview && AppState.overview.csatPct !== null ? Number(AppState.overview.csatPct).toFixed(1) : (countCsat > 0 ? avgCsat : '—'));

            if (el('teamStatCsat')) {
                el('teamStatCsat').textContent = (trueTeamCsat !== '—' && trueTeamCsat !== null) ? `${trueTeamCsat}%` : '—';
                const num = parseFloat(trueTeamCsat);
                if (!isNaN(num)) {
                    el('teamStatCsat').style.color = num >= 90 ? '#10b981' : (num >= 75 ? '#f59e0b' : '#ef4444');
                }
            }
            if (el('teamStatAgbt')) el('teamStatAgbt').textContent = agbtCount > 0 ? formatDuration(agbtAvgSecs / 60) : '—';
            if (el('teamStatAbst')) el('teamStatAbst').textContent = abstCount > 0 ? formatDuration(abstAvgSecs / 60) : '—';
            if (el('teamStatBreach')) {
                el('teamStatBreach').textContent = breachCountText(totalBreaches);
                el('teamStatBreach').title = breachExceedText(totalBreachMins);
            }
            if (el('teamStatLateness')) el('teamStatLateness').textContent = fmtMinutes(totalLate);
            if (el('teamStatIdle')) el('teamStatIdle').textContent = idleCount > 0 ? formatDuration(idleAvgHours * 60) : fmtHours(0);
        }

        // 3 & 4. الشريط الثانوي ورسم المخطط البياني التفاعلي
        renderAnalyticsQuickStripAndChart();

        // 5. تصنيف CSAT
        const csatBox = el('csatBreakdownBody');
        if (csatBox) {
            let totalGood = 0, totalBad = 0, evalAgents = 0, targetAgents = 0;
            AppState.agents.forEach(a => {
                const c = Number(a.csat) || 0;
                if (c > 0) {
                    evalAgents++;
                    if (c >= 90) targetAgents++;
                }
                totalGood += Number(a.csatGood) || 0;
                totalBad += Number(a.csatBad) || 0;
            });
            const evalCsat = totalGood + totalBad;
            const goodPct = evalCsat > 0 ? Math.round((totalGood / evalCsat) * 100) : (evalAgents > 0 ? Math.round((targetAgents / evalAgents) * 100) : 0);
