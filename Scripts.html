    /**
     * احتساب درجة ترتيب الحالة للمقاييس الفردية
     */
    function getStatusSortScore(agent, metric) {
        if (!agent) return 0;
        if (metric === 'csat') return agent.csat || 0;
        if (metric === 'abst') return -parseTimeToSeconds(agent.abst);
        if (metric === 'lateness') return -(agent.lateness || 0);
        if (metric === 'breakBreach') return -(parseInt(agent.breakBreach) || 0);
        if (metric === 'productivity') return parseFloat(String(agent.productivity || '0').replace('%', '')) || 0;
        return 0;
    }

    /**
     * تحويل الوقت بصيغة (mm:ss أو ثواني) إلى رقم ثواني نقي لسهولة المقارنة والترتيب
     */
    function parseTimeToSeconds(timeStr) {
        if (!timeStr) return 999999;
        const str = String(timeStr).trim();
        if (str.includes(':')) {
            const parts = str.split(':');
            return (parseInt(parts[0], 10) || 0) * 60 + (parseInt(parts[1], 10) || 0);
        }
        const num = parseFloat(str);
        return isNaN(num) ? 999999 : num * 60;
    }

    function formatSeconds(secs) {
        const total = Math.max(0, Math.round(secs || 0));
        const m = Math.floor(total / 60);
        const s = total % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function parseMinutesFromString(str) {
        const s = String(str || '').trim().toLowerCase();
        const num = parseFloat(s.replace(/[^0-9.]/g, ''));
        if (isNaN(num)) return 0;
        return num;
    }

    function setupTabNavigation() {

        const tabStats = el('tabStatsView');
        const viewData = el('viewDataSection');
        const viewStats = el('viewStatsSection');

        if (tabData && tabStats && viewData && viewStats) {

                tabData.classList.add('active');
                tabData.setAttribute('aria-selected', 'true');
                tabStats.classList.remove('active');
                tabStats.setAttribute('aria-selected', 'false');
                viewData.hidden = false;
                viewStats.hidden = true;
                AppState.currentMainTab = 'data';
            });

            tabStats.addEventListener('click', () => {
                tabStats.classList.add('active');
                tabStats.setAttribute('aria-selected', 'true');
                tabData.classList.remove('active');
                tabData.setAttribute('aria-selected', 'false');
                viewData.hidden = true;
                viewStats.hidden = false;

                    b.classList.remove('active');
                    b.setAttribute('aria-selected', 'false');
                });

                target.classList.add('active');
                target.setAttribute('aria-selected', 'true');
                AppState.currentChartTab = target.getAttribute('data-chart') || 'sessions';
                renderSvgChart();
            });
        });

        // Chart Display Mode Toggle (Bars vs Line)
        const btnBar = el('btnChartModeBar');
        const btnLine = el('btnChartModeLine');
        if (btnBar) {
            btnBar.addEventListener('click', () => {
                AppState.chartDisplayMode = 'bar';
                btnBar.classList.add('active');
                if (btnLine) btnLine.classList.remove('active');
                renderSvgChart();
            });
        }
        if (btnLine) {
            btnLine.addEventListener('click', () => {

    /**
     * إعداد نافذة الإدارة المنبثقة (Admin Portal Modal)
     */
    function setupAdminModal() {
        const overlay = el('adminModalOverlay');
        const btnOpen = el('btnAdminPortal');
        const btnClose = el('btnCloseAdminModal');
        const jsonInput = el('adminJsonInput');
        const fileInput = el('adminFileInput');
        const btnClear = el('adminBtnClear');
        const btnSave = el('adminBtnSave');
        const btnOpenSheet = el('adminBtnOpenSheet');
        const statusBox = el('adminStatusBox');

        if (!overlay) return;

        let parsedPayload = null;

        function openModal() {
            overlay.style.display = 'flex';
            overlay.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
            if (jsonInput) jsonInput.focus();
        }

        function closeModal() {
            overlay.style.display = 'none';
            overlay.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
        }

        if (btnOpen) btnOpen.addEventListener('click', openModal);
        if (btnClose) btnClose.addEventListener('click', closeModal);

        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && overlay.style.display === 'flex') {
                closeModal();
            }
        });

        // فحص الباراميتر لفتح النافذة تلقائياً إذا طلب المستخدم ?page=admin
        try {
            const urlParams = new URLSearchParams(window.location.search);
            const openFromUrl = urlParams.get('page') === 'admin' || urlParams.get('p') === 'admin';
            const openFromInit = window.APP_INITIAL_DATA && window.APP_INITIAL_DATA.openAdmin;
            if (openFromUrl || openFromInit) {
                setTimeout(openModal, 150);
            }
        } catch (e) {}

        // فحص الـ JSON لحظياً
        if (jsonInput) {
            jsonInput.addEventListener('input', analyzeInput);
        }

        if (fileInput) {
            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    if (jsonInput) {
                        jsonInput.value = evt.target.result;
                        analyzeInput();
                    }
                };
                reader.readAsText(file);
            });
        }

        if (btnClear) {
            btnClear.addEventListener('click', () => {
                if (jsonInput) jsonInput.value = '';
                parsedPayload = null;
                updatePreview(0, 0, 0, 'في انتظار اللصق', 'var(--muted)');
                if (statusBox) statusBox.style.display = 'none';
            });
        }

        function analyzeInput() {
            if (!jsonInput) return;
            const text = jsonInput.value.trim();
            if (!text) {
                parsedPayload = null;
                updatePreview(0, 0, 0, 'في انتظار اللصق', 'var(--muted)');
                if (btnSave) btnSave.disabled = false;
                return;
            }

            try {
                const data = JSON.parse(text);
                parsedPayload = data;

                let agentsCount = 0;
                let drillsCount = 0;
                let ticketsCount = 0;

                const results = data.results || (Array.isArray(data) ? data : []);
                drillsCount = results.length;

                const agents = data.agents || data.summaryAgents || [];
                agentsCount = agents.length;

                results.forEach(r => {
                    if (r.rows && Array.isArray(r.rows)) {
                        ticketsCount += r.rows.length;
                    }
                });

                if (agentsCount === 0 && results.length > 0) {
                    const uniqueEm = new Set(results.map(r => r.agent).filter(Boolean));
                    agentsCount = uniqueEm.size;
                }

                updatePreview(agentsCount, drillsCount, ticketsCount, 'صيغة صحيحة وجاهزة ✓', '#34d399');
                if (btnSave) btnSave.disabled = false;
            } catch (e) {
                parsedPayload = null;
                updatePreview(0, 0, 0, 'خطأ في بنية JSON ❌', '#f87171');
                if (btnSave) btnSave.disabled = true;
            }
        }

        function updatePreview(agents, drills, tickets, statusText, statusColor) {
            const pAgents = el('adminPrevAgents');
            const pDrills = el('adminPrevDrills');
            const pTickets = el('adminPrevTickets');
            const pStatus = el('adminPrevStatus');
            if (pAgents) pAgents.textContent = agents;
            if (pDrills) pDrills.textContent = drills;
            if (pTickets) pTickets.textContent = tickets;
            if (pStatus) {
                pStatus.textContent = statusText;
                pStatus.style.color = statusColor;
            }
        }

        function showAdminStatus(type, message) {
            if (!statusBox) return;
            statusBox.style.display = 'block';
            statusBox.className = 'admin-status-box ' + type;
            statusBox.textContent = message;
        }

        // الحفظ إلى Google Sheets
        if (btnSave) {
            btnSave.addEventListener('click', () => {
                if (!jsonInput) return;
                const text = jsonInput.value.trim();
                if (!text) {
                    showAdminStatus('error', '⚠️ يرجى لصق كود الـ JSON أولاً في المربع أعلاه.');
                    return;
                }

                if (!parsedPayload) {
                    showAdminStatus('error', '⚠️ النص الملصق ليس كود JSON صالح. يرجى إعادة نسخ النتائج من الإضافة.');
                    return;
                }

                const options = {
                    smartDates: el('adminChkSmartDates')?.checked ?? true,
                    updateSummary: el('adminChkUpdateSummary')?.checked ?? true,
                    updateArchive: el('adminChkUpdateArchive')?.checked ?? true
                };

                btnSave.disabled = true;
                showAdminStatus('loading', '⏳ جاري فرز وحفظ البيانات في Google Sheets...\nيرجى الانتظار بضع ثوانٍ...');

                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler((res) => {
                            btnSave.disabled = false;
                            if (res && res.success) {
                                const msg = `🎉 تم بنجاح الحفظ والتحديث في Google Sheet!\n\n` +
                                            `• تم تحديث بيانات: (${res.agentsCount || 0}) وكيلاً.\n` +
                                            `• تم فحص وحفظ: (${res.drillCount || 0}) مقياساً تفصيلياً.\n` +
                                            `• إجمالي التذاكر المسجلة بالأرشيف: (${res.ticketsCount || 0}) تذكرة.\n` +
                                            `• حالة التكرار: تم استبعاد التكرارات بنجاح ✓\n\n` +
                                            `جاري الآن تحديث أرقام الداشبورد تلقائياً...`;
                                showAdminStatus('success', msg);
                                // تحديث أرقام الداشبورد فوراً!
                                setTimeout(loadSheetData, 500);
                            } else {
                                showAdminStatus('error', '❌ ' + (res?.message || 'تعذر حفظ البيانات في Google Sheet.'));
                            }
                        })
                        .withFailureHandler((err) => {
                            btnSave.disabled = false;
                            showAdminStatus('error', '❌ حدث خطأ أثناء الحفظ في الشيت: ' + err.message);
                        })
                        .importDataFromAdminPortal(text, options);
                } else {
                    // حفظ حقيقي في التخزين المحلي لوضع المعاينة
                    setTimeout(() => {
                        try {
                            const parsed = JSON.parse(text.replace(/^\uFEFF/, ''));
                            const localData = buildLocalDashboardData(parsed);
                            localStorage.setItem('gas_agent_dashboard_local_data', JSON.stringify(localData));
                            localStorage.setItem('gas_agent_dashboard_raw_json', text);
                            btnSave.disabled = false;
                            showAdminStatus('success', `🎉 تم بنجاح حفظ وتأمين بياناتك محلياً!\n• تم تحديث وحفظ: (${localData.agents.length}) وكيلاً.\n• إجمالي الصفوف: (${localData.summary.totalDrillRows}) صفاً.\nالبيانات مؤمنة في المتصفح ولن تختفي عند الخروج والعودة.`);
                            setTimeout(loadLocalPreviewMode, 400);
                        } catch (err) {
                            btnSave.disabled = false;
                            showAdminStatus('error', '❌ تعذر تحليل أو حفظ البيانات محلياً: ' + err.message);
                        }
                    }, 500);
                }
            });
        }

        // فتح رابط Google Sheet
        if (btnOpenSheet) {
            btnOpenSheet.addEventListener('click', () => {
                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler(url => {
                            if (url) window.open(url, '_blank');
                            else alert('يرجى فتح Google Sheet من حساب Google الخاص بك.');
                        })
                        .getSpreadsheetUrl();
                } else {
                    alert('في السكربت المنشور، سينقلك هذا الزر إلى ملف Google Sheet مباشرة.');
                }
            });
        }
    }

    function resetDetailFilters() {
        AppState.detailFilters = {
            datePreset: 'all',
            csatScore: 'all',
            channel: 'all',
            topSessions: 'all',
            breachOnly: 'all'
        };
        const badge = el('filterActiveBadge');
        if (badge) badge.hidden = true;
    }

    function loadSheetData() {
        const label = el('cloudStatusLabel');
        if (label) label.textContent = I18N.t('cloudUpdating');
        message(I18N.t('cloudUpdating'));

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(handleSheetDataSuccess)
                .withFailureHandler(handleSheetDataError)
                .getDashboardDataFromSheet();
        } else {
            // وضع المعاينة المحلي (Local Preview Mode)
            setTimeout(loadLocalPreviewMode, 400);
        }
    }

    function handleSheetDataSuccess(response) {
        const label = el('cloudStatusLabel');
        if (label) label.textContent = I18N.t('cloudRefresh');

        if (!response || !response.success || response.isEmpty || !response.agents || response.agents.length === 0) {
            AppState.agents = [];
            el('empty').hidden = false;
            el('detail').hidden = true;
            updateTopStats({ totalAgents: 0, totalDrillRows: 0 });
            message(response?.message || I18N.t('emptyDataDesc'), true);
            return;
        }

        AppState.agents = response.agents;
        if (response.historicalDays && Array.isArray(response.historicalDays) && response.historicalDays.length > 0) {
            AppState.historicalDays = response.historicalDays;
        }
        AppState.chartDays = AppState.historicalDays;
        el('empty').hidden = true;
        el('detail').hidden = false;

        updateTopStats(response.summary);
        populateDropdowns();
        renderResultsList();
        renderDetailView();

        message(I18N.t('dataLoadedSuccess', { count: AppState.agents.length }));
    }

    function handleSheetDataError(err) {
        const label = el('cloudStatusLabel');
        if (label) label.textContent = I18N.t('cloudRefresh');
        message(I18N.t('loadFailed') + err.message, true);
    }

    function updateTopStats(summary) {
        el('agentCount').textContent = summary?.totalAgents || AppState.agents.length;
        el('rowCount').textContent = summary?.totalDrillRows || (AppState.agents.length * 7);
        const badge = el('statsTabBadge');
        if (badge) badge.textContent = AppState.agents.length;
    }

    function populateDropdowns() {
        const agentSel = el('agent');
        const analyticsSel = el('analyticsAgentSelect');
        if (!agentSel) return;

        const currentVal = agentSel.value;
        agentSel.innerHTML = `<option value="">${I18N.t('sidebarAllAgentsOption')}</option>`;
        if (analyticsSel) analyticsSel.innerHTML = `<option value="">${I18N.t('analyticsAllAgentsOption')}</option>`;

        AppState.agents.forEach(a => {
            const opt = new Option(`${a.name} (${a.email})`, a.email);
            agentSel.add(opt);
            if (analyticsSel) analyticsSel.add(new Option(`${a.name} (${a.email})`, a.email));
        });

        if (currentVal && AppState.agents.some(a => a.email === currentVal)) {
            agentSel.value = currentVal;
            AppState.selectedAgent = currentVal;
        }
    }

    /**
     * بناء قائمة النتائج في الشريط الجانبي الأيسر
     */
    function renderResultsList() {
        const container = el('results');
        if (!container) return;

        container.innerHTML = '';
        const matchCountBadge = el('resultMatchCount');

        // إذا كان المختار "كل الوكلاء"
        if (!AppState.selectedAgent) {
            if (matchCountBadge) matchCountBadge.textContent = `${AppState.agents.length} ${I18N.t('agentUnit')}`;

            const allBtn = document.createElement('button');
            allBtn.className = 'result-card' + (!AppState.selectedAgent ? ' active' : '');
            allBtn.innerHTML = `
                <div class="result-card-header">
                    <span class="metric-pill" style="background: rgba(56, 189, 248, 0.2); color: #38bdf8;">All Agents</span>
                    <span class="badge subtle">${AppState.agents.length} ${I18N.t('agentUnit')}</span>
                </div>
                <span class="agent-name" style="font-weight: 700; color: #fff;">👥 ${I18N.t('allAgentsTitle')}</span>
                <small style="color: var(--muted);">${I18N.t('allAgentsMeta', { metric: 'All' })}</small>
            `;
            allBtn.addEventListener('click', () => {
                AppState.selectedAgent = '';
                el('agent').value = '';
                renderResultsList();
                renderDetailView();
            });
            container.appendChild(allBtn);

            AppState.agents.forEach((agent, idx) => {
                const btn = document.createElement('button');
                btn.className = 'result-card';

                    <span class="agent-name">${agent.name}</span>
                    <small style="color: var(--muted);">${agent.email}</small>

                    AppState.selectedAgent = agent.email;

                    renderResultsList();
                    renderDetailView();
                });
                container.appendChild(btn);
            });
            return;
        }

        // إذا كان تم اختيار وكيل محدد
        const currentAgent = AppState.agents.find(a => a.email === AppState.selectedAgent);
        if (matchCountBadge) matchCountBadge.textContent = `1 ${I18N.t('agentUnit')}`;

        // بطاقة العودة لجدول جميع الوكلاء في أعلى القائمة الجانبية
        const backToAllBtn = document.createElement('button');
        backToAllBtn.className = 'result-card back-card';
        backToAllBtn.style.background = 'rgba(56, 189, 248, 0.12)';
        backToAllBtn.style.border = '1px dashed rgba(56, 189, 248, 0.4)';
        backToAllBtn.style.marginBottom = '12px';
        backToAllBtn.innerHTML = `
            <div class="result-card-header">
                <span class="metric-pill" style="background: rgba(56, 189, 248, 0.2); color: #38bdf8;">All Agents</span>
                <span class="badge subtle" style="color:#38bdf8;">${I18N.currentLang === 'ar' ? 'عودة' : 'Back'}</span>
            </div>
            <span class="agent-name" style="font-weight: 700; color: #38bdf8;">${I18N.t('sidebarBackToAll')}</span>
            <small style="color: var(--muted);">${I18N.t('sidebarBackToAllDesc')}</small>
        `;
        backToAllBtn.addEventListener('click', () => {
            AppState.selectedAgent = '';
            const agentSel = el('agent');
            if (agentSel) agentSel.value = '';
            AppState.page = 0;
            renderResultsList();
            renderDetailView();
        });
        container.appendChild(backToAllBtn);

        const metricsList = [
            { key: 'all', label: 'All Metrics' },
            { key: 'csat', label: 'CSAT' },
            { key: 'agbt', label: 'AGBT' },
            { key: 'abst', label: 'ABST' },
            { key: 'breakBreach', label: 'Break breach' },
            { key: 'lateness', label: 'Lateness' },
            { key: 'idle', label: 'Idle' },
            { key: 'productivity', label: 'Productivity' }
        ];

        metricsList.forEach(m => {
            const btn = document.createElement('button');
            const isActive = AppState.selectedMetric === m.key;
            btn.className = 'result-card' + (isActive ? ' active' : '');
            btn.innerHTML = `
                <div class="result-card-header">
                    <span class="metric-pill">${m.key.toUpperCase()}</span>
                    <span class="badge subtle">${I18N.t('btnDetails')}</span>
                </div>
                <span class="agent-name">${m.label}</span>
                <small style="color: var(--muted);">${currentAgent?.name || AppState.selectedAgent}</small>
            `;
            btn.addEventListener('click', () => {
                AppState.selectedMetric = m.key;
                el('metric').value = m.key;
                renderResultsList();
                renderDetailView();
            });
            container.appendChild(btn);
        });
    }

    /**
     * بناء قسم التفاصيل (Detail View)
     */
    function renderDetailView() {
        const isAllAgents = !AppState.selectedAgent;
        const metric = AppState.selectedMetric || 'all';

        const sidebar = el('sidebarPanel');
        const workspace = el('workspaceContainer');
        const btnBack = el('btnBackToAllAgents');
        const topMetricWrap = el('topMetricFilterWrap');

        if (isAllAgents) {
            // إخفاء الحانة/القائمة الجانبية تماماً وتوسيع جدول المقارنة ليشغل 100% من العرض
            if (sidebar) sidebar.style.display = 'none';
            if (workspace) workspace.classList.add('all-agents-view');
            if (btnBack) btnBack.style.display = 'none';
            if (topMetricWrap) topMetricWrap.style.display = 'block';
            if (el('topMetricSelect')) el('topMetricSelect').value = metric;
            if (el('agent')) el('agent').value = '';

            el('detailAgent').textContent = I18N.t('allAgentsTitle');
            el('detailMetric').textContent = METRIC_LABELS[metric] || 'All';
            el('colCountBadge').textContent = `${AppState.agents.length} ${I18N.t('agentUnit')}`;
            el('meta').textContent = I18N.t('allAgentsMeta', { metric: METRIC_LABELS[metric] || 'All' });
            el('metricFilterToolbar').hidden = true;
            renderMetricSummaryBarAllAgents(metric);
            renderDetailTableOnly();
        } else {
            // إظهار الحانة/القائمة الجانبية مع إمكانية التبديل بين مقاييس الوكيل المختار
            if (sidebar) sidebar.style.display = 'block';
            if (workspace) workspace.classList.remove('all-agents-view');
            if (btnBack) btnBack.style.display = 'inline-flex';
            if (topMetricWrap) topMetricWrap.style.display = 'none';
            if (el('agent')) el('agent').value = AppState.selectedAgent;
            if (el('metric')) el('metric').value = metric;

            const agent = AppState.agents.find(a => a.email === AppState.selectedAgent) || { name: AppState.selectedAgent, email: AppState.selectedAgent };
            el('detailAgent').textContent = agent.name;
            el('detailMetric').textContent = METRIC_LABELS[metric] || metric;
            el('colCountBadge').textContent = agent.email;
            el('meta').textContent = I18N.t('agentMeta', { email: agent.email });
            renderMetricSummaryBarSingleAgent(agent, metric);
            renderMetricFilterToolbar(metric);
            loadSingleAgentDrills(agent.email, metric);
        }
    }

    function renderMetricSummaryBarAllAgents(metric) {
        const bar = el('metricSummary');
        if (!bar) return;

        let totalCsat = 0, countCsat = 0;
        let totalLate = 0;
        let totalBreaches = 0;

        AppState.agents.forEach(a => {
            if (a.csat > 0) { totalCsat += a.csat; countCsat++; }
            totalLate += a.lateness || 0;
            totalBreaches += parseInt(a.breakBreach) || 0;
        });

        const avgCsat = countCsat > 0 ? (totalCsat / countCsat).toFixed(1) : '—';
        const unitMin = I18N.t('unitMinutes');

        bar.innerHTML = `
            <div class="summary-pill"><span class="pill-label">${I18N.t('totalAgentsLabel')}</span> <b class="pill-value">${AppState.agents.length}</b></div>
            <div class="summary-pill"><span class="pill-label">${I18N.t('teamAvgCsatLabel')}</span> <b class="pill-value" style="color:#10b981;">${avgCsat}%</b></div>
            <div class="summary-pill"><span class="pill-label">${I18N.t('totalLatenessLabel')}</span> <b class="pill-value" style="color:#f87171;">${totalLate.toFixed(1)} ${unitMin}</b></div>
            <div class="summary-pill"><span class="pill-label">${I18N.t('totalBreachesLabel')}</span> <b class="pill-value" style="color:#f59e0b;">${totalBreaches}</b></div>
        `;
    }

    function renderDetailTableOnly() {
        const head = el('head');
        const body = el('body');
        const matchCount = el('matchCount');
        const noRows = el('noRows');
        const pageBadge = el('page');

        if (!head || !body) return;

        if (!AppState.selectedAgent) {
            renderAllAgentsComparisonTable(head, body, matchCount, noRows, pageBadge);
        } else {
            renderSingleAgentDrillTable(head, body, matchCount, noRows, pageBadge);
        }
    }

    /**
     * جدول مقارنة جميع الوكلاء (Unified All Agents Comparison Table)
     */
    function renderAllAgentsComparisonTable(head, body, matchCount, noRows, pageBadge) {
        const metric = AppState.selectedMetric;

        head.innerHTML = '';
        const trHead = document.createElement('tr');
        
        let columns = [];
        if (metric === 'all') {
            columns = [
                { key: 'index', label: I18N.t('colIndex') },
                { key: 'name', label: I18N.t('colName') },
                { key: 'email', label: I18N.t('colEmail') },
                { key: 'csat', label: I18N.t('colCsat') },
                { key: 'agbt', label: I18N.t('colAgbt') },
                { key: 'abst', label: I18N.t('colAbst') },
                { key: 'breakBreach', label: I18N.t('colBreakBreach') },
                { key: 'lateness', label: I18N.t('colLateness') },
                { key: 'idle', label: I18N.t('colIdle') },
                { key: 'productivity', label: I18N.t('colProductivity') },
                { key: null, label: I18N.t('colAction') }
            ];
        } else {
            columns = [
                { key: 'index', label: I18N.t('colIndex') },
                { key: 'name', label: I18N.t('colName') },
                { key: 'email', label: I18N.t('colEmail') },
                { key: 'metricVal', label: I18N.t('colMetricVal', { metric: METRIC_LABELS[metric] }) },
                { key: 'status', label: I18N.t('colStatus') },
                { key: null, label: I18N.t('colAction') }
            ];
        }

        columns.forEach(colObj => {
            const th = document.createElement('th');
            if (colObj.key) {
                const isSorted = AppState.sortCol === colObj.key;
                th.className = 'sortable' + (isSorted ? (AppState.sortAsc ? ' sorted-asc' : ' sorted-desc') : '');
                th.style.cursor = 'pointer';
                const icon = isSorted ? (AppState.sortAsc ? ' ▲' : ' ▼') : ' ↕';
                th.innerHTML = `<span style="display:inline-flex; align-items:center; gap:6px; justify-content:space-between; width:100%;">
                    <span>${colObj.label}</span>
                    <span class="sort-icon" style="font-size:11px; opacity:${isSorted ? '1' : '0.45'}; color:${isSorted ? 'var(--blue)' : 'inherit'};">${icon}</span>
                </span>`;
                th.addEventListener('click', () => {
                    if (AppState.sortCol === colObj.key) {
                        AppState.sortAsc = !AppState.sortAsc;
                    } else {
                        AppState.sortCol = colObj.key;
                        AppState.sortAsc = (colObj.key === 'abst' || colObj.key === 'agbt' || colObj.key === 'lateness' || colObj.key === 'breakBreach' || colObj.key === 'index');
                    }
                    renderDetailTableOnly();
                });
            } else {
                th.textContent = colObj.label;
            }
            trHead.appendChild(th);
        });
        head.appendChild(trHead);

        const q = AppState.searchQuery;
        let visibleAgents = AppState.agents.filter(a => {
            if (!q) return true;
            return a.name.toLowerCase().includes(q) ||
                   a.email.toLowerCase().includes(q) ||
                   String(a.csat).includes(q) ||
                   String(a.abst).includes(q) ||
                   String(a.agbt).includes(q) ||
                   String(a.lateness).includes(q);
        });

        // تطبيق الترتيب التصاعدي أو التنازلي
        if (AppState.sortCol) {
            visibleAgents.sort((a, b) => {
                let va, vb;
                if (AppState.sortCol === 'index') {
                    va = AppState.agents.indexOf(a);
                    vb = AppState.agents.indexOf(b);
                } else if (AppState.sortCol === 'metricVal') {
                    va = a[metric] ?? a.csat;
                    vb = b[metric] ?? b.csat;
                } else if (AppState.sortCol === 'status') {
                    va = getStatusSortScore(a, metric);
                    vb = getStatusSortScore(b, metric);
                } else {
                    va = a[AppState.sortCol];
                    vb = b[AppState.sortCol];
                }

                if (AppState.sortCol === 'abst' || AppState.sortCol === 'agbt' || (typeof va === 'string' && va.includes(':'))) {
                    va = parseTimeToSeconds(va);
                    vb = parseTimeToSeconds(vb);
                } else if (AppState.sortCol === 'productivity') {
                    va = parseFloat(String(va || '0').replace('%', '')) || 0;
                    vb = parseFloat(String(vb || '0').replace('%', '')) || 0;
                } else if (AppState.sortCol === 'idle') {
                    va = parseFloat(String(va || '0').replace(/[^0-9.-]/g, '')) || 0;
                    vb = parseFloat(String(vb || '0').replace(/[^0-9.-]/g, '')) || 0;
                } else if (typeof va === 'number' || (!isNaN(parseFloat(va)) && !String(va).includes('@'))) {
                    va = parseFloat(va) || 0;
                    vb = parseFloat(vb) || 0;
                } else {
                    va = String(va || '').toLowerCase();
                    vb = String(vb || '').toLowerCase();
                }

                if (va < vb) return AppState.sortAsc ? -1 : 1;
                if (va > vb) return AppState.sortAsc ? 1 : -1;
                return 0;
            });
        }

        if (matchCount) matchCount.textContent = `${visibleAgents.length} ${I18N.t('agentUnit')}`;
        if (noRows) noRows.hidden = visibleAgents.length > 0;

        const start = AppState.page * AppState.pageSize;
        const pagedAgents = visibleAgents.slice(start, start + AppState.pageSize);
        const totalPages = Math.max(1, Math.ceil(visibleAgents.length / AppState.pageSize));
        if (pageBadge) pageBadge.textContent = `${AppState.page + 1} / ${totalPages}`;

        body.innerHTML = '';
        const unitMin = I18N.t('unitMinutes');

        pagedAgents.forEach((agent, i) => {
            const tr = document.createElement('tr');
            const rowNum = start + i + 1;

            if (metric === 'all') {
                const csatPill = agent.csat >= 90 ? `<span class="badge badge-success">${agent.csat}%</span>` : `<span class="badge badge-warning">${agent.csat}%</span>`;
                const latePill = agent.lateness === 0 ? `<span style="color:#10b981;">0 ${unitMin}</span>` : `<span style="color:#f87171;font-weight:700;">${agent.lateness} ${unitMin}</span>`;

                const abstSecs = parseTimeToSeconds(agent.abst);
                const abstTier = getAbstTier(abstSecs);
                let abstPill = '';
                if (abstTier === 'fast') {
                    abstPill = `<span style="color:#10b981; font-weight:700;">${agent.abst} 🟢</span>`;
                } else if (abstTier === 'normal') {
                    abstPill = `<span style="color:#f59e0b; font-weight:600;">${agent.abst} 🟡</span>`;
                } else if (abstTier === 'slow') {
                    abstPill = `<span style="color:#f87171; font-weight:700;">${agent.abst} 🔴</span>`;
                } else {
                    abstPill = `<span style="color:var(--muted);">—</span>`;
                }

                tr.innerHTML = `
                    <td style="color:var(--muted);">${rowNum}</td>
                    <td style="font-weight:600; color:#fff;">${agent.name}</td>
                    <td style="font-family:monospace; color:var(--muted);">${agent.email}</td>
                    <td>${csatPill}</td>
                    <td style="color:#38bdf8;">${agent.agbt}</td>
                    <td>${abstPill}</td>
                    <td>${agent.breakBreach}</td>
                    <td>${latePill}</td>
                    <td>${agent.idle}</td>
                    <td style="color:#06b6d4;">${agent.productivity}</td>
                    <td><button class="button btn-sm" onclick="selectAgentFromTable('${agent.email}')">${I18N.t('btnDetails')}</button></td>
                `;
            } else {
                let metricValDisplay = '—';
                let statusBadge = `<span class="badge subtle">${I18N.t('statusNormal')}</span>`;

                if (metric === 'csat') {
                    metricValDisplay = `${agent.csat}%`;
                    statusBadge = agent.csat >= 90 ? `<span class="badge badge-success">${I18N.t('statusExcellent')}</span>` : `<span class="badge badge-warning">${I18N.t('statusNeedsFollowup')}</span>`;
                } else if (metric === 'agbt') {
                    metricValDisplay = agent.agbt;
                    statusBadge = `<span class="badge subtle" style="color:#38bdf8;">${I18N.t('statusNormal')}</span>`;
                } else if (metric === 'abst') {
                    const secs = parseTimeToSeconds(agent.abst);
                    metricValDisplay = agent.abst;
                    const tier = getAbstTier(secs);
                    if (tier === 'fast') {
                        statusBadge = `<span class="badge badge-success">${I18N.t('statusFast')}</span>`;
                    } else if (tier === 'normal') {
                        statusBadge = `<span class="badge badge-warning">${I18N.t('statusNormal')}</span>`;
                    } else if (tier === 'slow') {
                        statusBadge = `<span class="badge badge-danger">${I18N.t('statusSlow')}</span>`;
                    }
                } else if (metric === 'lateness') {
                    metricValDisplay = `${agent.lateness} ${unitMin}`;
                    statusBadge = agent.lateness === 0 ? `<span class="badge badge-success">${I18N.t('statusOnTime')}</span>` : `<span class="badge badge-danger">${I18N.t('statusLate')}</span>`;
                } else if (metric === 'breakBreach') {
                    metricValDisplay = `${agent.breakBreach} ${I18N.t('unitTimes')}`;
                    statusBadge = parseInt(agent.breakBreach) === 0 ? `<span class="badge badge-success">${I18N.t('statusZeroBreaches')}</span>` : `<span class="badge badge-danger">${I18N.t('statusBreached')}</span>`;
                } else if (metric === 'idle') {
                    metricValDisplay = agent.idle;
                    statusBadge = `<span class="badge subtle">${I18N.t('statusNormal')}</span>`;
                } else if (metric === 'productivity') {
                    metricValDisplay = agent.productivity;
                    statusBadge = parseFloat(agent.productivity) >= 90 ? `<span class="badge badge-success">${I18N.t('statusExcellent')}</span>` : `<span class="badge badge-warning">${I18N.t('statusNeedsFollowup')}</span>`;
                }

                tr.innerHTML = `
                    <td style="color:var(--muted);">${rowNum}</td>
                    <td style="font-weight:600; color:#fff;">${agent.name}</td>
                    <td style="font-family:monospace; color:var(--muted);">${agent.email}</td>
                    <td style="font-weight:700; color:#38bdf8; font-size:14px;">${metricValDisplay}</td>
                    <td>${statusBadge}</td>
                    <td><button class="button btn-sm" onclick="selectAgentFromTable('${agent.email}')">${I18N.t('btnViewTickets')}</button></td>
                `;
            }
            body.appendChild(tr);
        });
    }

    /**
     * جدول تفاصيل سجلات الوكيل الفردي (Single Agent Drill Table)
     */
    function renderSingleAgentDrillTable(head, body, matchCount, noRows, pageBadge) {
        const data = AppState.activeDrillData;

        if (AppState.drillLoading) {
            head.innerHTML = '';
            body.innerHTML = `
                <tr>
                    <td colspan="10" style="text-align:center; padding:45px 20px; color:var(--muted);">
                        <div style="font-size:32px; margin-bottom:10px;">⏳</div>
                        <strong style="font-size:15px; color:#fff; display:block; margin-bottom:6px;">
                            ${I18N.currentLang === 'ar' ? 'جاري تحميل السجلات…' : 'Loading records…'}
                        </strong>
                    </td>
                </tr>`;
            if (matchCount) matchCount.textContent = '…';
            if (pageBadge) pageBadge.textContent = '1 / 1';
            return;
        }

        if (!data || !data.found || !data.rows || data.rows.length === 0) {
            head.innerHTML = '';
            body.innerHTML = `
                <tr>
                    <td colspan="10" style="text-align:center; padding:45px 20px; color:var(--muted);">
                        <div style="font-size:32px; margin-bottom:10px;">📭</div>
                        <strong style="font-size:15px; color:#fff; display:block; margin-bottom:6px;">
                            ${I18N.t('noDrillRecordsTitle', { metric: METRIC_LABELS[AppState.selectedMetric] || AppState.selectedMetric })}
                        </strong>
                        <span style="font-size:13px; color:var(--muted);">
                            ${I18N.t('noDrillRecordsSub')}
                        </span>
                    </td>
                </tr>`;
            if (matchCount) matchCount.textContent = '0';
            if (pageBadge) pageBadge.textContent = '1 / 1';
            return;
        }

        const rawHeader = data.header || [];
        const rawRows = data.rows || [];

        head.innerHTML = '';
        const trHead = document.createElement('tr');
        rawHeader.forEach((colName, colIdx) => {
            const th = document.createElement('th');
            const isSorted = AppState.drillSortCol === colIdx;
            th.className = 'sortable' + (isSorted ? (AppState.drillSortAsc ? ' sorted-asc' : ' sorted-desc') : '');
            th.style.cursor = 'pointer';
            const icon = isSorted ? (AppState.drillSortAsc ? ' ▲' : ' ▼') : ' ↕';
            th.innerHTML = `<span style="display:inline-flex; align-items:center; gap:6px; justify-content:space-between; width:100%;">
                <span>${colName}</span>
                <span class="sort-icon" style="font-size:11px; opacity:${isSorted ? '1' : '0.45'}; color:${isSorted ? 'var(--blue)' : 'inherit'};">${icon}</span>
            </span>`;
            th.addEventListener('click', () => {
                if (AppState.drillSortCol === colIdx) {
                    AppState.drillSortAsc = !AppState.drillSortAsc;
                } else {
                    AppState.drillSortCol = colIdx;
                    AppState.drillSortAsc = true;
                }
                // الفرز يتم على الخادم الآن، ونعيد طلب الصفحة الأولى
                AppState.page = 0;
                if (AppState.selectedAgent) {
                    loadSingleAgentDrills(AppState.selectedAgent, AppState.selectedMetric);
                }
            });
            trHead.appendChild(th);
        });
        head.appendChild(trHead);

        // الصفوف هنا هي "صفحة" جاهزة قادمة من الخادم — لا فلترة أو فرز إضافي على المتصفح
        const total = AppState.drillTotal || rawRows.length;
        const totalPages = Math.max(1, AppState.drillTotalPages || 1);
        if (matchCount) matchCount.textContent = `${total} ${I18N.currentLang === 'ar' ? 'صف' : 'rows'}`;
        if (noRows) noRows.hidden = total > 0;
        if (pageBadge) pageBadge.textContent = `${AppState.page + 1} / ${totalPages}`;

        body.innerHTML = '';
        rawRows.forEach(rowCells => {
            const tr = document.createElement('tr');
            rowCells.forEach((cell, cIdx) => {
                const td = document.createElement('td');
                const colName = rawHeader[cIdx] || '';
                td.innerHTML = formatDrillCell(cell, colName);
                tr.appendChild(td);
            });
            body.appendChild(tr);
        });
    }

    function findHeaderCol(headers, ...candidates) {
        if (!Array.isArray(headers)) return -1;
        const lowerHeaders = headers.map(h => String(h).toLowerCase().trim());
        for (const candidate of candidates) {
            const target = candidate.toLowerCase();
            const idx = lowerHeaders.findIndex(h => h === target || h.includes(target));
            if (idx !== -1) return idx;
        }
        return -1;
    }

    function extractCellDate(row, headers) {
        if (!row || !headers) return null;
        const h = headers.map(c => String(c).toLowerCase().trim());
        const priorityNames = ['day', 'report_dt', 'ticket_creation_date', 'date_resolved_dubai', 'created_at_dubai', 'csat_submitted_at_dubai', 'shift_date', 'plan_shift_start', 'fact_shift_start', 'date'];
        for (const name of priorityNames) {
            const idx = h.findIndex(c => c === name || c.includes(name));
            if (idx !== -1 && row[idx]) {
                const str = String(row[idx]).trim();
                const m = str.match(/\b\d{4}-\d{2}-\d{2}\b/);
                if (m) return m[0];
            }
        }
        for (let idx = 0; idx < h.length; idx++) {
            const col = h[idx];
            if (col.includes('date') || col.includes('day') || col.includes('dt') || col.includes('time')) {
                const str = String(row[idx] || '').trim();
                const m = str.match(/\b\d{4}-\d{2}-\d{2}\b/);
                if (m) return m[0];
            }
        }
        return null;
    }

    function formatDrillCell(val, colName) {
        if (val === null || val === undefined || String(val).trim() === '' || val === '—') {
            return `<span style="color:var(--muted); opacity:0.6;">—</span>`;
        }
        const text = String(val).trim();
        const lower = text.toLowerCase();
        const lowerCol = String(colName || '').toLowerCase();

        // 1. Compliance & Met status
        if (lower === 'met') {
            return `<span class="badge" style="background:rgba(16, 185, 129, 0.15); color:#34d399; border:1px solid rgba(16, 185, 129, 0.3);">✓ Met</span>`;
        } else if (lower === 'not met' || lower === 'breached' || lower.includes('breach')) {
            return `<span class="badge" style="background:rgba(239, 68, 68, 0.15); color:#f87171; border:1px solid rgba(239, 68, 68, 0.3);">✕ ${text}</span>`;
        }

        // 2. CSAT Score
        if (lowerCol.includes('csat') || lowerCol.includes('score')) {
            if (lower === 'good' || lower === '5' || lower === '4' || lower === 'positive' || lower.includes('ممتاز') || lower.includes('جيد')) {
                return `<span class="badge" style="background:rgba(16, 185, 129, 0.15); color:#34d399; border:1px solid rgba(16, 185, 129, 0.3);">✓ ${text}</span>`;
            } else if (lower === 'bad' || lower === '1' || lower === '2' || lower === 'negative' || lower.includes('سيء')) {
                return `<span class="badge" style="background:rgba(239, 68, 68, 0.15); color:#f87171; border:1px solid rgba(239, 68, 68, 0.3);">✕ ${text}</span>`;
            }
        }

        // 3. Channel
        if (lowerCol.includes('channel')) {
            if (lower === 'chat') return `<span style="color:#38bdf8; font-weight:600;">💬 Chat</span>`;
            if (lower === 'phone') return `<span style="color:#a78bfa; font-weight:600;">📞 Phone</span>`;
            if (lower === 'email') return `<span style="color:#fbbf24; font-weight:600;">✉️ Email</span>`;
        }

        // 4. Country
        if (lowerCol === 'country' || lowerCol === 'ticket_country') {
            if (lower === 'ksa') return `<span style="font-weight:600;">🇸🇦 KSA</span>`;
            if (lower === 'uae') return `<span style="font-weight:600;">🇦🇪 UAE</span>`;
        }

        // 5. Hour durations
        if (lowerCol.includes('not_working') || lowerCol.includes('idle') || lowerCol === 'basket_time_h' || lowerCol === 'fact_breaks_h') {
            const num = parseFloat(text);
            if (!isNaN(num)) {
                const mins = Math.round(num * 60);
                return `<span title="${num.toFixed(2)} ساعة تعادل حوالي ${mins} دقيقة" style="font-family:'JetBrains Mono',monospace;">${num.toFixed(2)}h <small style="color:var(--muted); font-size:11px;">(${mins} د)</small></span>`;
            }
        }

        // 6. Long float numbers
        if (/^\d+\.\d{3,}$/.test(text)) {
            const num = parseFloat(text);
            if (!isNaN(num)) {
                return `<span title="${text}" style="font-family:'JetBrains Mono',monospace;">${num.toFixed(2)}</span>`;
            }
        }

        return text;
    }

    function loadSingleAgentDrills(email, metric) {
        // مقياس "all" في وضع الوكيل الفردي يفتح CSAT افتراضياً
        const targetMetric = (metric === 'all') ? 'csat' : metric;

        AppState.drillLoading = true;
        AppState.activeDrillData = null;
        AppState.drillLoadKey = `${email}::${metric}`;
        renderDetailTableOnly();

        const opts = {
            page: AppState.page,
            pageSize: AppState.pageSize,
            search: AppState.searchQuery,
            datePreset: AppState.detailFilters.datePreset,
            csatScore: AppState.detailFilters.csatScore,
            channel: AppState.detailFilters.channel,
            topSessions: AppState.detailFilters.topSessions,
            sortColIdx: AppState.drillSortCol != null ? AppState.drillSortCol : '',
            sortAsc: AppState.drillSortAsc
        };

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler((res) => {
                    if (AppState.drillLoadKey !== `${email}::${metric}` ||
                        AppState.selectedAgent !== email ||
                        AppState.selectedMetric !== metric) {
                        return;
                    }
                    AppState.drillLoading = false;
                    if (res && res.success) {
                        AppState.activeDrillData = {
                            found: res.found,
                            header: res.header || [],
                            rows: res.rows || []
                        };
                        AppState.drillTotal = res.total || 0;
                        AppState.drillTotalPages = res.totalPages || 1;
                        AppState.page = res.page || 0;
                    } else {
                        AppState.activeDrillData = { found: false, header: [], rows: [] };
                        AppState.drillTotal = 0;
                        AppState.drillTotalPages = 1;
                    }
                    renderDetailTableOnly();
                })
                .withFailureHandler(() => {
                    if (AppState.drillLoadKey !== `${email}::${metric}` ||
                        AppState.selectedAgent !== email ||
                        AppState.selectedMetric !== metric) {
                        return;
                    }
                    AppState.drillLoading = false;
                    AppState.activeDrillData = { found: false, header: [], rows: [] };
                    AppState.drillTotal = 0;
                    AppState.drillTotalPages = 1;
                    renderDetailTableOnly();
                })
                .getAgentDrillPageFromSheet(email, targetMetric, opts);
        } else {
            // وضع المعاينة المحلي: محاكاة نفس سلوك الخادم (فلترة + ترتيب + ترقيم صفحات)
            const sim = paginateLocally(email, targetMetric, opts);
            AppState.drillLoading = false;
            AppState.activeDrillData = {
                found: sim.total > 0,
                header: sim.header,
                rows: sim.rows
            };
            AppState.drillTotal = sim.total;
            AppState.drillTotalPages = sim.totalPages;
            AppState.page = sim.page;
            renderDetailTableOnly();
        }
    }

    /**
     * فلترة وترتيب وترقيم صفحات محلي (لوضع المعاينة فقط) — مطابق لمنطق الخادم.
     */
    function paginateLocally(email, metric, opts) {
        opts = opts || {};
        const page = Math.max(0, parseInt(opts.page, 10) || 0);
        const pageSize = Math.min(500, Math.max(10, parseInt(opts.pageSize, 10) || 50));
        const search = String(opts.search || '').toLowerCase().trim();

        let target = null;
        try {
            const rawJson = localStorage.getItem('gas_agent_dashboard_raw_json');
            if (rawJson) {
                const parsed = JSON.parse(rawJson.replace(/^\uFEFF/, ''));
                const rawResults = parsed.results || (Array.isArray(parsed) && parsed[0]?.metric ? parsed : (parsed.header ? [parsed] : []));
                target = (Array.isArray(rawResults) ? rawResults : []).find(r => {
                    const rAgent = String(r.agent || '').toLowerCase().trim();
                    const rMetric = String(r.metric || '').toLowerCase().trim();
                    const tAgent = String(email || '').toLowerCase().trim();
                    const tMetric = String(metric || '').toLowerCase().trim();
                    return (rAgent === tAgent || tAgent.includes(rAgent) || rAgent.includes(tAgent.split('@')[0])) &&
                           (rMetric === tMetric);
                });
            }
        } catch (e) {}

        if (!target || !Array.isArray(target.rows) || !target.rows.length) {
            return { header: [], rows: [], total: 0, totalPages: 1, page: 0 };
        }

        const header = Array.isArray(target.header) ? target.header : [];
        const rows = target.rows;
        const csatIdx = findHeaderCol(header, 'csat_adjusted', 'csat', 'score');
        const chanIdx = findHeaderCol(header, 'ticket_channel', 'channel');
        let timeIdx = -1;
        if (metric === 'agbt') {
            timeIdx = findHeaderCol(header, 'sum_basket_time_for_ticket_per_hour_min_ONLINE_WOMT', 'sum_basket_time_for_ticket_per_hour_min', 'basket_time', 'agbt', 'time');
        } else if (metric === 'abst') {
            timeIdx = findHeaderCol(header, 'basket_session_time_min', 'session_time', 'basket_session_time', 'abst', 'time');
        }

        let filtered = rows.filter(row => {
            if (search) {
                const hit = row.some(cell => String(cell || '').toLowerCase().includes(search));
                if (!hit) return false;
            }
            const fltCsat = opts.csatScore || 'all';
            if (fltCsat !== 'all') {
                const val = csatIdx !== -1 ? String(row[csatIdx] || '').toLowerCase().trim() : '';
                const isGood = (val === 'good' || val === '5' || val === '4' || val === 'positive' || val.includes('ممتاز') || val.includes('جيد'));
                const isBad = (val === 'bad' || val === '1' || val === '2' || val === 'negative' || val.includes('سيء'));
                if (fltCsat === 'good' && !isGood) return false;
                if (fltCsat === 'bad' && !isBad) return false;
            }
            const fltChan = opts.channel || 'all';
            if (fltChan !== 'all' && chanIdx !== -1) {
                if (String(row[chanIdx] || '').toLowerCase().trim() !== fltChan.toLowerCase()) return false;
            }
            const fltDate = opts.datePreset || 'all';
            if (fltDate !== 'all') {
                const d = extractCellDate(row, header);
                if (!d) return false;
                const today = new Date().toISOString().slice(0, 10);
                if (fltDate === 'today' && d !== today) return false;
                if (fltDate === 'yesterday') {
                    const y = new Date(); y.setDate(y.getDate() - 1);
                    if (d !== y.toISOString().slice(0, 10)) return false;
                }
            }
            return true;
        });

        const top = opts.topSessions || 'all';
        if (top !== 'all' && timeIdx !== -1) {
            filtered.sort((a, b) => parseTimeToSeconds(b[timeIdx]) - parseTimeToSeconds(a[timeIdx]));
            const n = top === 'top5' ? 5 : 10;
            filtered = filtered.slice(0, n);
        }

        const sortIdx = (opts.sortColIdx !== undefined && opts.sortColIdx !== null && opts.sortColIdx !== '') ? parseInt(opts.sortColIdx, 10) : -1;
        if (sortIdx >= 0) {
            const asc = opts.sortAsc !== false;
            filtered.sort((a, b) => {
                let va = a[sortIdx], vb = b[sortIdx];
                if (typeof va === 'string' && va.includes(':')) {
                    va = parseTimeToSeconds(va);
                    vb = parseTimeToSeconds(vb);
                } else if (!isNaN(parseFloat(va)) && !String(va).includes('#') && !String(va).includes('-')) {
                    va = parseFloat(va); vb = parseFloat(vb);
                } else {
                    va = String(va || '').toLowerCase(); vb = String(vb || '').toLowerCase();
                }
                if (va < vb) return asc ? -1 : 1;
                if (va > vb) return asc ? 1 : -1;
                return 0;
            });
        }

        const total = filtered.length;
        const totalPages = Math.max(1, Math.ceil(total / pageSize));
        const safePage = Math.min(page, totalPages - 1);
        const start = safePage * pageSize;
        const pageRows = filtered.slice(start, start + pageSize);

        return { header, rows: pageRows, total, totalPages, page: safePage };
    }
