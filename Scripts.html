    /**
     * شاشة الإحصائيات المتقدمة والرسوم البيانية (Analytics View)
     */
    function renderAnalyticsView() {
        if (!AppState.agents || AppState.agents.length === 0) return;

        const selectedAgentEmail = (el('analyticsAgentSelect') ? el('analyticsAgentSelect').value : '').trim().toLowerCase();
        let targetAgents = AppState.agents;
        const isSingleAgent = Boolean(selectedAgentEmail && AppState.agents.some(a => (a.email || '').toLowerCase() === selectedAgentEmail));

        if (isSingleAgent) {
            targetAgents = AppState.agents.filter(a => (a.email || '').toLowerCase() === selectedAgentEmail);
            // جلب الخط الزمني الخاص بهذا الوكيل حصرياً (حتى لا يتم دمج بقية الوكلاء)
            loadSingleAgentAnalytics(selectedAgentEmail);
        } else {
            // إبطال أي طلب إحصائيات سابق لوكيل مفرد حتى لا يكتب فوق بيانات الفريق
            AppState.analyticsRequestId++;
            AppState.chartDays = AppState.historicalDays;
            AppState.analyticsLoading = false;
        }

        const unitMin = I18N.t('unitMinutes');
        const unitTimes = I18N.t('unitTimes');

        if (isSingleAgent) {
            // ========================================================
            // 1. عرض بطاقات الوكيل الفردي المختار بدقة
            // ========================================================
            const agent = targetAgents[0];
            const csatVal = Number(agent.csat) || 0;
            const csatDisplay = csatVal > 0 ? `${csatVal.toFixed(1)}%` : '—';
            if (el('kpiCsatVal')) el('kpiCsatVal').textContent = csatDisplay;
            if (el('kpiCsatFill')) el('kpiCsatFill').style.width = `${Math.min(100, csatVal)}%`;

            const lateVal = parseFloat(agent.lateness) || 0;
            if (el('kpiLatenessVal')) el('kpiLatenessVal').textContent = `${lateVal} ${unitMin}`;
            if (el('kpiLatenessFill')) el('kpiLatenessFill').style.width = `${Math.min(100, (lateVal / 30) * 100)}%`;

            const breachVal = parseInt(agent.breakBreach, 10) || 0;
            if (el('kpiBreachVal')) el('kpiBreachVal').textContent = `${breachVal} ${unitTimes}`;
            if (el('kpiBreachFill')) el('kpiBreachFill').style.width = `${Math.min(100, breachVal * 25)}%`;

            const agbtStr = agent.agbt || "00:00";
            if (el('kpiAgbtVal')) el('kpiAgbtVal').textContent = agbtStr;
            const agbtSecs = parseTimeToSeconds(agbtStr);
            if (el('kpiAgbtFill')) el('kpiAgbtFill').style.width = `${Math.min(100, (agbtSecs / 600) * 100)}%`;

            const idleStr = agent.idle || "0";
            if (el('kpiIdleVal')) el('kpiIdleVal').textContent = `${idleStr}`;
            const idleMins = parseMinutesFromString(idleStr);
            if (el('kpiIdleFill')) el('kpiIdleFill').style.width = `${Math.min(100, (idleMins / 120) * 100)}%`;
        } else {
            // ========================================================
            // 2. عرض إجماليات ومتوسطات الفريق بالكامل
            // ========================================================
            let totalCsat = 0, countCsat = 0, highCsatCount = 0;
            let totalLate = 0;
            let totalBreaches = 0;

            AppState.agents.forEach(a => {
                const cVal = Number(a.csat) || 0;
                if (cVal > 0) {
                    totalCsat += cVal;
                    countCsat++;
                    if (cVal >= 90) highCsatCount++;
                }
                totalLate += (parseFloat(a.lateness) || 0);
                totalBreaches += (parseInt(a.breakBreach, 10) || 0);
            });

            const avgCsat = countCsat > 0 ? (totalCsat / countCsat).toFixed(1) : 0;
            if (el('kpiCsatVal')) el('kpiCsatVal').textContent = countCsat > 0 ? `${avgCsat}%` : '—';
            if (el('kpiCsatFill')) el('kpiCsatFill').style.width = `${avgCsat}%`;

            if (el('kpiLatenessVal')) el('kpiLatenessVal').textContent = `${totalLate.toFixed(1)} ${unitMin}`;
            if (el('kpiLatenessFill')) el('kpiLatenessFill').style.width = `${Math.min(100, (totalLate / (AppState.agents.length * 10 || 1)) * 100)}%`;

            if (el('kpiBreachVal')) el('kpiBreachVal').textContent = `${totalBreaches} ${unitTimes}`;
            if (el('kpiBreachFill')) el('kpiBreachFill').style.width = `${Math.min(100, (totalBreaches / (AppState.agents.length * 3 || 1)) * 100)}%`;

            // AGBT الفعلي: متوسط كل الوكلاء
            let agbtSecsSum = 0, agbtCount = 0;
            AppState.agents.forEach(a => {
                const secs = parseTimeToSeconds(a.agbt);
                if (secs !== 999999 && secs > 0) { agbtSecsSum += secs; agbtCount++; }
            });
            const agbtAvgSecs = agbtCount > 0 ? Math.round(agbtSecsSum / agbtCount) : 0;
            if (el('kpiAgbtVal')) el('kpiAgbtVal').textContent = agbtCount > 0 ? formatSeconds(agbtAvgSecs) : "00:00";
            if (el('kpiAgbtFill')) el('kpiAgbtFill').style.width = `${Math.min(100, (agbtAvgSecs / 600) * 100)}%`;

            // Idle الفعلي: متوسط كل الوكلاء
            let idleMinsSum = 0, idleCount = 0;
            AppState.agents.forEach(a => {
                const mins = parseMinutesFromString(a.idle);
                if (mins > 0) {
                    idleMinsSum += mins;
                    idleCount++;
                }
            });
            const idleAvgMins = idleCount > 0 ? Math.round(idleMinsSum / idleCount) : 0;
            if (el('kpiIdleVal')) el('kpiIdleVal').textContent = idleCount > 0 ? `${idleAvgMins}m` : "0m";
            if (el('kpiIdleFill')) el('kpiIdleFill').style.width = `${Math.min(100, (idleAvgMins / 120) * 100)}%`;
        }

        // 3 & 4. الشريط الثانوي ورسم المخطط البياني التفاعلي
        renderAnalyticsQuickStripAndChart();

        // 5. تصنيف CSAT
        const csatBox = el('csatBreakdownBody');
        if (csatBox) {
            let evalCount = 0, reachedTarget = 0;
            AppState.agents.forEach(a => {
                const c = Number(a.csat) || 0;
                if (c > 0) {
                    evalCount++;
                    if (c >= 90) reachedTarget++;
                }
            });
            const highPct = evalCount > 0 ? Math.round((reachedTarget / evalCount) * 100) : 0;
            csatBox.innerHTML = `
                <div style="margin-bottom:14px;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
                        <span>${I18N.t('csatDistributionSub')}</span>
                        <strong style="color:#10b981;">${highPct}% (${reachedTarget} / ${evalCount})</strong>
                    </div>
                    <div class="kpi-bar-track"><div class="kpi-bar-fill emerald" style="width:${highPct}%;"></div></div>
                </div>
                <div style="font-size:12px; color:var(--muted); line-height:1.6;">
                    ${I18N.t('csatNote')}
                </div>
            `;
        }

        // 6. ترتيب أداء الوكلاء
        const rankList = el('agentsCompareList');
        if (rankList) {
            rankList.innerHTML = '';
            const sortedAgents = [...AppState.agents].sort((a, b) => (Number(b.csat) || 0) - (Number(a.csat) || 0)).slice(0, 10);
            sortedAgents.forEach((a, idx) => {
                const isCurrentAgent = isSingleAgent && (a.email || '').toLowerCase() === selectedAgentEmail;
                const item = document.createElement('div');
                item.className = 'rank-item' + (isCurrentAgent ? ' current-active-agent' : '');
                item.style.cssText = `display:flex; justify-content:space-between; align-items:center; padding:10px; border-bottom:1px solid var(--border-subtle); ${isCurrentAgent ? 'background:rgba(56, 189, 248, 0.12); border-radius:6px;' : ''}`;
                item.innerHTML = `
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span class="badge" style="background:var(--panel-sub); color:#fff; font-weight:700;">#${idx + 1}</span>
                        <div>
                            <strong style="color:#fff; display:block; font-size:13px;">${a.name} ${isCurrentAgent ? '⭐' : ''}</strong>
                            <span style="color:var(--muted); font-size:11px;">${a.email}</span>
                        </div>
                    </div>
                    <div style="text-align:inherit;">
                        <span class="badge badge-success" style="font-weight:700;">${a.csat}% CSAT</span>
                    </div>
                `;
                rankList.appendChild(item);
            });
        }
    }

    /**
     * الشريط الثانوي + المخطط البياني (يستخدم بيانات الوكيل المفرد عند اختياره، أو بيانات الفريق)
     */
    function renderAnalyticsQuickStripAndChart() {
        // 3. الشريط الثانوي (Secondary Quick Stats Strip)
        const sourceDays = AppState.analyticsLoading
            ? []
            : (Array.isArray(AppState.chartDays) && AppState.chartDays.length > 0 ? AppState.chartDays : AppState.historicalDays);
        const histDays = Array.isArray(sourceDays)
            ? sourceDays.filter(d => Number(d.sessions) > 0 || Number(d.csat) > 0 || Number(d.abstSecs) > 0 || Number(d.agbtSecs) > 0 || Number(d.long) > 0)
            : [];
        const totalSessions = histDays.reduce((s, d) => s + (Number(d.sessions) || 0), 0);
        const totalLongSessions = histDays.reduce((s, d) => s + (Number(d.long) || 0), 0);
        const activeDays = histDays.length;
        const dailyAvg = activeDays > 0 ? Math.round((totalSessions / activeDays) * 10) / 10 : 0;

        if (AppState.analyticsLoading) {
            if (el('secStatTotalSessions')) el('secStatTotalSessions').textContent = '…';
            if (el('secStatDailyAvg')) el('secStatDailyAvg').textContent = '…';
            if (el('secStatActiveDays')) el('secStatActiveDays').textContent = '…';
            if (el('secStatLongSessions')) el('secStatLongSessions').textContent = '…';
        } else {
            if (el('secStatTotalSessions')) el('secStatTotalSessions').textContent = `${totalSessions} ${I18N.t('unitSessions')}`;
            if (el('secStatDailyAvg')) el('secStatDailyAvg').textContent = `${dailyAvg} ${I18N.t('unitDailyAvg')}`;
            if (el('secStatActiveDays')) el('secStatActiveDays').textContent = `${activeDays} ${I18N.t('unitDays')}`;
            if (el('secStatLongSessions')) el('secStatLongSessions').textContent = `${totalLongSessions} ${I18N.t('unitSessions')}`;
        }

        // 4. رسم المخطط البياني التفاعلي SVG
        renderSvgChart();
    }

    /**
     * جلب الخط الزمني اليومي لوكيل واحد فقط من الملفات المفصولة في Google Drive.
     */
    function loadSingleAgentAnalytics(email) {
        AppState.analyticsLoading = true;
        AppState.chartDays = [];
        const requestId = ++AppState.analyticsRequestId;

        renderAnalyticsQuickStripAndChart();

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler((res) => {
                    if (requestId !== AppState.analyticsRequestId) return;
                    AppState.analyticsLoading = false;
                    AppState.chartDays = (res && res.success && Array.isArray(res.days)) ? res.days : [];
                    renderAnalyticsQuickStripAndChart();
                })
                .withFailureHandler(() => {
                    if (requestId !== AppState.analyticsRequestId) return;
                    AppState.analyticsLoading = false;
                    AppState.chartDays = [];
                    renderAnalyticsQuickStripAndChart();
                })
                .getAgentDailyTimeline(email);
        } else {
            // وضع المعاينة المحلي: نحسب الأيام الحقيقية لهذا الوكيل من البيانات المحفوظة (بدون اختلاق بيانات)
            AppState.analyticsLoading = false;
            AppState.chartDays = computeAgentDaysLocally(email);
            renderAnalyticsQuickStripAndChart();
        }
    }

    /**
     * حساب الأيام اليومية لوكيل واحد من البيانات المحفوظة محلياً (وضع المعاينة فقط).
     * يعيد مصفوفة فارغة إذا لم توجد بيانات، ولا يختلق أرقاماً من عندنا.
     */
    function computeAgentDaysLocally(email) {
        const dailyMap = {};
        function entryFor(day) {
            if (!dailyMap[day]) {
                dailyMap[day] = {
                    day,
                    displayDay: day.slice(5),
                    sessions: 0,
                    abstTotalSecs: 0,
                    abstCount: 0,
                    agbtTotalSecs: 0,
                    agbtCount: 0,
                    csatGood: 0,
                    csatBad: 0,
                    long: 0
                };
            }
            return dailyMap[day];
        }

        function dayFromRow(row, header) {
            const h = header.map(c => String(c).toLowerCase().trim());
            const dIdx = h.findIndex(c => c === 'day' || c === 'report_dt' || c.includes('date') || c.includes('shift_date'));
            if (dIdx === -1 || !row[dIdx]) return null;
            const m = String(row[dIdx]).match(/\b\d{4}-\d{2}-\d{2}\b/);
            return m ? m[0] : null;
        }

        function timeToSecs(v) {
            const s = String(v || '').trim();
            if (s.includes(':')) {
                const p = s.split(':');
                return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0);
            }
            const n = parseFloat(s);
            return isNaN(n) ? 0 : n * 60;
        }

        try {
            const rawJson = localStorage.getItem('gas_agent_dashboard_raw_json');
            if (!rawJson) return [];
            const parsed = JSON.parse(rawJson.replace(/^\uFEFF/, ''));
            const rawResults = parsed.results || (Array.isArray(parsed) && parsed[0]?.metric ? parsed : (parsed.header ? [parsed] : []));
            const target = String(email || '').toLowerCase().trim();

            (Array.isArray(rawResults) ? rawResults : []).forEach(r => {
                const rAgent = String(r.agent || '').toLowerCase().trim();
                if (rAgent !== target && !target.includes(rAgent) && !rAgent.includes(target.split('@')[0])) return;

                const metric = String(r.metric || '').toLowerCase().trim();
                const header = Array.isArray(r.header) ? r.header : [];
                const h = header.map(c => String(c).toLowerCase().trim());
                const cIdx = h.findIndex(c => c.includes('csat_adjusted') || c === 'csat' || c.includes('score'));
                const aIdx = h.findIndex(c => c === 'abst' || c.includes('basket_session_time') || c.includes('session_time') || c === 'agbt' || c.includes('basket_time'));

                (Array.isArray(r.rows) ? r.rows : []).forEach(row => {
                    const day = dayFromRow(row, header);
                    if (!day) return;
                    const e = entryFor(day);
                    e.sessions++;

                    if (metric === 'abst' || metric === 'agbt') {
                        if (aIdx !== -1) {
                            const secs = timeToSecs(row[aIdx]);
                            if (metric === 'abst') { e.abstTotalSecs += secs; e.abstCount++; }
                            else { e.agbtTotalSecs += secs; e.agbtCount++; }
                        }
                        if (metric === 'abst') {
                            const rawSecs = timeToSecs(row[aIdx]);
                            if (rawSecs >= 20 * 60) e.long++;
                        }
                    } else if (metric === 'csat') {
                        const val = cIdx !== -1 ? String(row[cIdx] || '').toLowerCase().trim() : '';
                        if (val === 'good' || val === '5' || val === '4' || val === 'positive' || val.includes('ممتاز') || val.includes('جيد')) e.csatGood++;
                        else if (val === 'bad' || val === '1' || val === '2' || val === 'negative' || val.includes('سيء')) e.csatBad++;
                    }
                });
            });

            return Object.keys(dailyMap).sort().map(d => {
                const e = dailyMap[d];
                const csatEval = e.csatGood + e.csatBad;
                return {
                    day: d,
                    displayDay: e.displayDay,
                    sessions: e.sessions,
                    abstSecs: e.abstCount > 0 ? Math.round(e.abstTotalSecs / e.abstCount) : 0,
                    agbtSecs: e.agbtCount > 0 ? Math.round(e.agbtTotalSecs / e.agbtCount) : 0,
                    csat: csatEval > 0 ? Math.round((e.csatGood / csatEval) * 100) : 0,
                    long: e.long
                };
            });
        } catch (e) {
            return [];
        }
    }

    /**
     * رسم المخطط البياني التفاعلي SVG المعتمد: منحنيات ناعمة (Smooth Curves) للمقاييس وأعمدة للسيشنات
     */
    function renderSvgChart() {
        const wrap = el('analyticsChartWrap');
        const badgeDays = el('chartActiveDaysCountBadge');
        if (!wrap) return;

        if (AppState.analyticsLoading) {
            wrap.innerHTML = `
                <div style="text-align:center; padding:55px 20px; color:var(--muted); font-size:13px; line-height:1.7;">
                    <span style="font-size:26px; display:block; margin-bottom:8px;">⏳</span>
                    ${I18N.currentLang === 'ar' ? 'جاري تحميل بيانات هذا الوكيل…' : 'Loading this agent data…'}
                </div>
            `;
            if (el('chartBenchmarkVal')) el('chartBenchmarkVal').textContent = '…';
            if (badgeDays) badgeDays.textContent = '…';
            return;
        }

        const chartType = AppState.currentChartTab || 'csat';
        const datePreset = AppState.chartDatePreset || 'recent';
        // الوضع الافتراضي: خطي للمقاييس المئوية والزمنية، وأعمدة لحجم السيشنات
        const defaultModeForType = (chartType === 'sessions' || chartType === 'long') ? 'bar' : 'line';
        const displayMode = AppState.chartDisplayMode || defaultModeForType;

        if (el('btnChartModeBar')) el('btnChartModeBar').classList.toggle('active', displayMode === 'bar');
        if (el('btnChartModeLine')) el('btnChartModeLine').classList.toggle('active', displayMode === 'line');

        // مزامنة حالة الأزرار التبويبية العلوية
        document.querySelectorAll('.chart-tab-btn').forEach(btn => {
            const isCurrent = btn.getAttribute('data-chart') === chartType;
            btn.classList.toggle('active', isCurrent);
            btn.setAttribute('aria-selected', isCurrent ? 'true' : 'false');
        });

        const allRecordedDays = (AppState.chartDays && AppState.chartDays.length > 0)
            ? AppState.chartDays
            : [];

        let activeDays = allRecordedDays.filter(d => {
            if (chartType === 'csat') return Number(d.csat) > 0 || Number(d.csatTotal) > 0 || Number(d.sessions) > 0;
            if (chartType === 'abst') return Number(d.abstSecs) > 0 || Number(d.abstMins) > 0;
            if (chartType === 'agbt') return Number(d.agbtSecs) > 0 || Number(d.agbtMins) > 0;
            if (chartType === 'long') return Number(d.long) > 0;
            return Number(d.sessions) > 0;
        });

        if (activeDays.length === 0) {
            activeDays = allRecordedDays.filter(d => Number(d.sessions) > 0 || Number(d.csat) > 0 || Number(d.abstSecs) > 0);
        }

        activeDays.sort((a, b) => (a.day || '').localeCompare(b.day || ''));

        if (datePreset === 'week') {
            activeDays = activeDays.slice(-7);
        } else if (datePreset === 'month') {
            activeDays = activeDays.slice(-30);
        } else if (datePreset === 'custom' && AppState.chartStartDate && AppState.chartEndDate) {
            activeDays = activeDays.filter(d => d.day >= AppState.chartStartDate && d.day <= AppState.chartEndDate);
        } else {
            activeDays = activeDays.slice(-14);
        }

        if (badgeDays) {
            badgeDays.textContent = I18N.t('activeDaysBadge', { count: activeDays.length });
        }

        const isArabic = I18N.currentLang === 'ar';
        let values = [];
        let unit = '%';
        let chartColor = '#10b981';
        let minMaxBaseline = 100;
        let subtitleText = '';
        let legendText = '';

        if (chartType === 'csat') {
            values = activeDays.map(d => Number(d.csat) || 0);
            unit = '%';
            chartColor = '#10b981';
            minMaxBaseline = 100;
            subtitleText = isArabic ? 'نسبة رضا العملاء CSAT اليومية من إجمالي التقييمات المسجلة' : 'Daily Customer Satisfaction CSAT percentage';
            legendText = isArabic ? 'معدل رضا العملاء CSAT %' : 'Customer Satisfaction CSAT %';
        } else if (chartType === 'abst') {
            values = activeDays.map(d => d.abstMins !== undefined && d.abstMins > 0 ? Number(d.abstMins) : Math.round((Number(d.abstSecs) || 0) / 60 * 10) / 10);
            unit = isArabic ? 'د' : 'min';
            chartColor = '#f97316';
            minMaxBaseline = 5;
            subtitleText = isArabic ? 'متوسط سرعة الرد ومعالجة التكتات (ABST) بالدقائق لكل يوم' : 'Daily Average ABST Handling Time in minutes';
            legendText = isArabic ? 'معدل ABST بالدقائق' : 'Daily ABST Rate (min)';
        } else if (chartType === 'agbt') {
            values = activeDays.map(d => d.agbtMins !== undefined && d.agbtMins > 0 ? Number(d.agbtMins) : Math.round((Number(d.agbtSecs) || 0) / 60 * 10) / 10);
            unit = isArabic ? 'د' : 'min';
            chartColor = '#0ea5e9';
            minMaxBaseline = 5;
            subtitleText = isArabic ? 'متوسط وقت السلة وإنجاز التكتات (AGBT) بالدقائق لكل يوم' : 'Daily Average AGBT Basket Time in minutes';
            legendText = isArabic ? 'معدل AGBT بالدقائق' : 'Daily AGBT Rate (min)';
        } else if (chartType === 'sessions') {
            values = activeDays.map(d => Number(d.sessions) || 0);
            unit = I18N.t('unitSessions');
            chartColor = '#38bdf8';
            minMaxBaseline = 20;
            subtitleText = isArabic ? 'تتبع حجم التكتات والسيشنات المنجزة يومياً' : 'Daily completed session volume';
            legendText = isArabic ? 'السيشن اليومي (تكتات منجزة)' : 'Daily Sessions (Tickets)';
        } else {
            values = activeDays.map(d => Number(d.long) || 0);
            unit = I18N.t('unitSessions');
            chartColor = '#ef4444';
            minMaxBaseline = 5;
            subtitleText = isArabic ? 'الجلسات الطويلة التي تجاوزت حاجز الـ 20 دقيقة لكل يوم' : 'Sessions exceeding 20 minutes duration';
            legendText = isArabic ? 'جلسات 20 دقيقة وفوق' : 'Sessions 20m+';
        }

        if (el('chartSubtitle')) el('chartSubtitle').textContent = subtitleText;
        if (el('chartLegendText')) el('chartLegendText').textContent = legendText;
        if (el('chartBadgeDot')) el('chartBadgeDot').style.background = chartColor;

        const hasNonZero = values.some(v => v > 0);
        if (activeDays.length === 0 || !hasNonZero) {
            wrap.innerHTML = `
                <div style="text-align:center; padding:55px 20px; color:var(--muted); font-size:13px; line-height:1.7;">
                    <span style="font-size:26px; display:block; margin-bottom:8px;">📊</span>
                    <b style="color:#f8fafc;">${legendText}</b><br>
                    ${isArabic ? 'لا توجد بيانات مسجلة لهذا المقياس ضمن الأيام المستوردة — يمكنك اختيار تبويب آخر لعرض الإحصائيات المتوفرة.' : 'No recorded data for this metric in the selected date range.'}
                </div>
            `;
            if (el('chartBenchmarkVal')) el('chartBenchmarkVal').textContent = '—';
            return;
        }

        const count = values.length;
        const maxVal = Math.max(...values, minMaxBaseline) * (chartType === 'csat' ? 1.05 : 1.15);
        const minVal = 0;
        const nonZeroValues = values.filter(v => v > 0);
        const total = nonZeroValues.reduce((a, b) => a + b, 0);
        const avgVal = nonZeroValues.length > 0 ? (total / nonZeroValues.length) : 0;

        let benchmarkText = `${avgVal.toFixed(1)} ${unit}`;
        if (chartType === 'csat') {
            benchmarkText = `${avgVal.toFixed(1)}%`;
        } else if (chartType === 'abst' || chartType === 'agbt') {
            const m = Math.floor(avgVal);
            const s = Math.round((avgVal % 1) * 60);
            benchmarkText = `${m}:${String(s).padStart(2, '0')} ${unit}`;
        }
        if (el('chartBenchmarkVal')) el('chartBenchmarkVal').textContent = benchmarkText;

        const width = 820;
        const height = 240;
        const padX = 55;
        const padY = 32;
        const chartW = width - padX * 2;
        const chartH = height - padY * 2;
        const days = activeDays.map(d => (d.displayDay || (d.day ? d.day.slice(5) : '')));

        function getCsatColor(score) {
            if (score >= 90) return '#10b981';
            if (score < 75) return '#ef4444';
            return '#f59e0b';
        }

        function formatDisplayVal(val) {
            if (chartType === 'csat') return `${Math.round(val)}%`;
            if (chartType === 'abst' || chartType === 'agbt') {
                const m = Math.floor(val);
                const s = Math.round((val % 1) * 60);
                return `${m}:${String(s).padStart(2, '0')}`;
            }
            return `${val}`;
        }

        const getX = i => padX + (count === 1 ? chartW / 2 : (i / (count - 1)) * chartW);
        const getY = val => height - padY - ((val - minVal) / (maxVal - minVal || 1)) * chartH;

        // خطوط الشبكة الأفقية (4 مستويات)
        let gridLines = '';
        const steps = 4;
        for (let s = 0; s <= steps; s++) {
            const v = minVal + (maxVal - minVal) * (s / steps);
            const y = getY(v);
            let labelText = '';
            if (chartType === 'csat') labelText = `${Math.round(v)}%`;
            else if (chartType === 'abst' || chartType === 'agbt') labelText = `${v.toFixed(1)} ${unit}`;
            else labelText = `${Math.round(v)}`;

            gridLines += `
                <line x1="${padX}" y1="${y}" x2="${width - padX}" y2="${y}" stroke="rgba(148, 163, 184, 0.12)" stroke-dasharray="3 4" stroke-width="1" />
                <text x="${padX - 8}" y="${y + 4}" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono', monospace" text-anchor="end">${labelText}</text>
            `;
        }

        // خط المتوسط المرجعي (Benchmark line)
        const avgY = getY(avgVal);
        const avgLine = `
            <line x1="${padX}" y1="${avgY}" x2="${width - padX}" y2="${avgY}" stroke="#f59e0b" stroke-dasharray="5 5" stroke-width="1.5" opacity="0.85" />
            <text x="${width - padX}" y="${avgY - 6}" fill="#fbbf24" font-size="10.5" font-weight="700" font-family="'IBM Plex Sans Arabic', sans-serif" text-anchor="end">${isArabic ? 'المتوسط: ' : 'Avg: '}${benchmarkText}</text>
        `;

        let dataElements = '';

        if (displayMode === 'bar') {
            const barW = Math.min(32, Math.max(10, (chartW / count) * 0.58));
            dataElements = values.map((val, i) => {
                const x = count === 1
                    ? padX + chartW / 2 - barW / 2
                    : padX + (i / count) * chartW + ((chartW / count) - barW) / 2;
                const bHeight = Math.max(3, ((val - minVal) / (maxVal - minVal || 1)) * chartH);
                const y = height - padY - bHeight;
                let barColor = chartColor;
                if (chartType === 'csat') barColor = getCsatColor(val);
                const displayVal = formatDisplayVal(val);

                return `
                    <g class="chart-bar-group" tabindex="0">
                        <title>${days[i]}: ${displayVal}</title>
                        <rect x="${x}" y="${y}" width="${barW}" height="${bHeight}" rx="4" fill="${barColor}" opacity="0.9"></rect>
                        ${val > 0 ? `<text x="${x + barW / 2}" y="${y - 6}" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">${displayVal}</text>` : ''}
                        <text x="${x + barW / 2}" y="${height - 10}" fill="var(--muted)" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', monospace">${days[i]}</text>
                    </g>
                `;
            }).join('');
        } else {
            // نمط المنحنى الانسيابي الناعم والمساحة المتدرجة
            const linePoints = values.map((val, i) => ({
                x: getX(i),
                y: getY(val),
                val,
                day: days[i],
                displayVal: formatDisplayVal(val)
            }));

            const pathD = linePoints.reduce((acc, pt, i) => {
                if (i === 0) return `M ${pt.x} ${pt.y}`;
                const prev = linePoints[i - 1];
                const cx = (prev.x + pt.x) / 2;
                return `${acc} C ${cx} ${prev.y}, ${cx} ${pt.y}, ${pt.x} ${pt.y}`;
            }, '');

            const fillD = `${pathD} L ${linePoints[linePoints.length - 1].x} ${height - padY} L ${linePoints[0].x} ${height - padY} Z`;

            const dots = linePoints.map((pt, i) => {
                let dotColor = chartColor;
                if (chartType === 'csat') dotColor = getCsatColor(pt.val);
                return `
                    <g class="chart-point-group" tabindex="0">
                        <title>${pt.day}: ${pt.displayVal}</title>
                        <circle cx="${pt.x}" cy="${pt.y}" r="4.5" fill="${dotColor}" stroke="#0b1329" stroke-width="2" class="chart-dot"></circle>
                        ${pt.val > 0 ? `<text x="${pt.x}" y="${pt.y - 8}" fill="#f8fafc" font-size="10.5" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">${pt.displayVal}</text>` : ''}
                        ${(count <= 14 || i % 2 === 0) ? `<text x="${pt.x}" y="${height - 10}" fill="var(--muted)" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', monospace">${pt.day}</text>` : ''}
                    </g>
                `;
            }).join('');

            dataElements = `
                <path d="${fillD}" fill="url(#chartGradDynamic)" opacity="0.3"></path>
                <path d="${pathD}" fill="none" stroke="${chartColor}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
                ${dots}
            `;
        }

        wrap.innerHTML = `
            <svg viewBox="0 0 ${width} ${height}" class="analytics-svg-chart" style="width:100%; height:auto; overflow:visible;" preserveAspectRatio="xMidYMid meet">
                <defs>
                    <linearGradient id="chartGradDynamic" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="${chartColor}" stop-opacity="0.8"></stop>
                        <stop offset="100%" stop-color="${chartColor}" stop-opacity="0.0"></stop>
                    </linearGradient>
                </defs>
                ${gridLines}
                ${avgLine}
                <line x1="${padX}" y1="${height - padY}" x2="${width - padX}" y2="${height - padY}" stroke="var(--border)" stroke-width="1.5"></line>
                ${dataElements}
            </svg>
        `;
    }

    function loadLocalPreviewMode() {
        // 1. Check for real local saved data first
        try {
            const raw = localStorage.getItem('gas_agent_dashboard_local_data');
            if (raw) {
                const parsed = JSON.parse(raw);
                if (parsed && Array.isArray(parsed.agents) && parsed.agents.length > 0) {
                    handleSheetDataSuccess(parsed);
                    message(`✓ تم استعادة بياناتك الحقيقية المحفوظة محلياً (${parsed.agents.length} وكيل) بنجاح 🟢.`);
                    return;
                }
            }
        } catch (e) {
            console.warn('Error loading local preview data:', e);
        }

        // 2. Demo fallback
        const mockAgents = [
            { name: 'سلطان العتيبي', email: 'sultan.o@company.com', csat: 95.2, agbt: '03:45', abst: '01:20', breakBreach: '0', lateness: 0, idle: '12m', productivity: '96%' },
            { name: 'أحمد الشهري', email: 'ahmed.sh@company.com', csat: 89.5, agbt: '04:15', abst: '02:05', breakBreach: '1', lateness: 15, idle: '25m', productivity: '88%' },
            { name: 'فاطمة القحطاني', email: 'fatimah.q@company.com', csat: 98.0, agbt: '03:10', abst: '00:55', breakBreach: '0', lateness: 0, idle: '08m', productivity: '98%' },
            { name: 'محمد الحربي', email: 'mohammed.h@company.com', csat: 91.0, agbt: '04:30', abst: '01:45', breakBreach: '2', lateness: 5, idle: '18m', productivity: '92%' },
            { name: 'نورة الدوسري', email: 'noura.d@company.com', csat: 96.5, agbt: '03:25', abst: '01:10', breakBreach: '0', lateness: 0, idle: '10m', productivity: '95%' },
            { name: 'خالد المطيري', email: 'khaled.m@company.com', csat: 82.0, agbt: '05:10', abst: '02:50', breakBreach: '3', lateness: 25, idle: '40m', productivity: '79%' },
            { name: 'سارة الغامدي', email: 'sara.gh@company.com', csat: 95.0, agbt: '03:50', abst: '01:15', breakBreach: '0', lateness: 0, idle: '14m', productivity: '94%' }
        ];

        handleSheetDataSuccess({
            success: true,
            agents: mockAgents,
            summary: { totalAgents: mockAgents.length, totalDrillRows: mockAgents.length * 7 },
            historicalDays: [
                { day: '2026-09-08', sessions: 135, abstSecs: 78, agbtSecs: 225, csat: 93, long: 4 },
                { day: '2026-09-09', sessions: 142, abstSecs: 75, agbtSecs: 215, csat: 94, long: 6 },
                { day: '2026-09-10', sessions: 155, abstSecs: 82, agbtSecs: 240, csat: 72, long: 8 },
                { day: '2026-09-11', sessions: 168, abstSecs: 78, agbtSecs: 230, csat: 88, long: 12 },
                { day: '2026-09-12', sessions: 160, abstSecs: 85, agbtSecs: 255, csat: 68, long: 10 },
                { day: '2026-09-13', sessions: 0,   abstSecs: 0,  agbtSecs: 0,   csat: 0,  long: 0 },
                { day: '2026-09-14', sessions: 178, abstSecs: 70, agbtSecs: 205, csat: 82, long: 9 },
                { day: '2026-09-15', sessions: 195, abstSecs: 68, agbtSecs: 195, csat: 95, long: 7 },
                { day: '2026-09-16', sessions: 210, abstSecs: 65, agbtSecs: 190, csat: 96, long: 5 }
            ]
        });
    }

    function buildLocalDashboardData(payload) {
        const rawResults = payload.results || (Array.isArray(payload) && payload[0]?.metric ? payload : (payload.header ? [payload] : []));
        if (!rawResults || !rawResults.length) {
            throw new Error('لم يتم العثور على أي مقاييس صالحة في ملف النتائج.');
        }

        const normalized = rawResults.map((r, idx) => ({
            agent: String(r.agent || 'مستخدم').trim(),
            metric: String(r.metric || '').toLowerCase().trim(),
            title: String(r.title || ''),
            header: Array.isArray(r.header) ? r.header : [],
            rows: Array.isArray(r.rows) ? r.rows : []
        }));

        function localDayFromRow(row, header) {
            const h = header.map(c => String(c).toLowerCase().trim());
            const dIdx = h.findIndex(c => c === 'day' || c === 'report_dt' || c.includes('date') || c.includes('shift_date'));
            if (dIdx === -1 || !row[dIdx]) return null;
            const m = String(row[dIdx]).match(/\b\d{4}-\d{2}-\d{2}\b/);
            return m ? m[0] : null;
        }

        function localTimeToSecs(v) {
            const s = String(v || '').trim();
            if (s.includes(':')) {
                const p = s.split(':');
                return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0);
            }
            const n = parseFloat(s);
            return isNaN(n) ? 0 : n * 60;
        }

        // حساب الخط الزمني العام من الصفوف الفعلية بدلاً من أرقام وهمية
        const timelineMap = {};
        function timelineEntry(day) {
            if (!timelineMap[day]) {
                timelineMap[day] = {
                    day,
                    displayDay: day.slice(5),
                    sessions: 0,
                    abstSecsSum: 0,
                    abstCount: 0,
                    agbtSecsSum: 0,
                    agbtCount: 0,
                    csatGood: 0,
                    csatBad: 0,
                    long: 0
                };
            }
            return timelineMap[day];
        }

        normalized.forEach(r => {
            const metric = r.metric;
            const header = r.header;
            const h = header.map(c => String(c).toLowerCase().trim());
            const cIdx = h.findIndex(c => c.includes('csat_adjusted') || c === 'csat' || c.includes('score'));
            const aIdx = h.findIndex(c => c === 'abst' || c.includes('basket_session_time') || c.includes('session_time') || c === 'agbt' || c.includes('basket_time'));

            (Array.isArray(r.rows) ? r.rows : []).forEach(row => {
                const day = localDayFromRow(row, header);
                if (!day) return;
                const e = timelineEntry(day);
                e.sessions++;

                if (metric === 'abst' || metric === 'agbt') {
                    if (aIdx !== -1) {
                        const secs = localTimeToSecs(row[aIdx]);
                        if (metric === 'abst') { e.abstSecsSum += secs; e.abstCount++; }
                        else { e.agbtSecsSum += secs; e.agbtCount++; }
                    }
                    if (metric === 'abst' && aIdx !== -1 && localTimeToSecs(row[aIdx]) >= 20 * 60) e.long++;
                } else if (metric === 'csat') {
                    const val = cIdx !== -1 ? String(row[cIdx] || '').toLowerCase().trim() : '';
                    if (val === 'good' || val === '5' || val === '4' || val === 'positive' || val.includes('ممتاز') || val.includes('جيد')) e.csatGood++;
                    else if (val === 'bad' || val === '1' || val === '2' || val === 'negative' || val.includes('سيء')) e.csatBad++;
                }
            });
        });

        const historicalDays = Object.keys(timelineMap).sort().map(day => {
            const e = timelineMap[day];
            const csatEval = e.csatGood + e.csatBad;
            return {
                day,
                displayDay: e.displayDay,
                sessions: e.sessions,
                abstSecs: e.abstCount > 0 ? Math.round(e.abstSecsSum / e.abstCount) : 0,
                agbtSecs: e.agbtCount > 0 ? Math.round(e.agbtSecsSum / e.agbtCount) : 0,
                csat: csatEval > 0 ? Math.round((e.csatGood / csatEval) * 100) : 0,
                long: e.long
            };
        });

        const agentMap = new Map();
        normalized.forEach(r => {
            if (!r.agent) return;
            if (!agentMap.has(r.agent)) agentMap.set(r.agent, []);
            agentMap.get(r.agent).push(r);
        });

        const agents = [];
        for (const [agentName, recs] of agentMap.entries()) {
            const email = agentName.includes('@') ? agentName : `${agentName.replace(/\s+/g, '.')}@tabby.ai`;

            // CSAT
            let csatGood = 0, csatTotal = 0;
            recs.filter(r => r.metric === 'csat').forEach(r => {
                const h = r.header.map(c => String(c).toLowerCase().trim());
                const cIdx = h.findIndex(c => c.includes('csat_adjusted') || c === 'csat' || c.includes('score'));
                r.rows.forEach(row => {
                    csatTotal++;
                    const val = cIdx !== -1 ? String(row[cIdx] || '').toLowerCase().trim() : '';
                    if (val === 'good' || val === '5' || val === '4' || val === 'positive' || val.includes('ممتاز') || val.includes('جيد')) csatGood++;
                });
            });
            const csatPct = csatTotal > 0 ? parseFloat(((csatGood / csatTotal) * 100).toFixed(1)) : 94.5;

            // AGBT
            let agbtSum = 0, agbtCount = 0;
            recs.filter(r => r.metric === 'agbt').forEach(r => {
                const h = r.header.map(c => String(c).toLowerCase().trim());
                const aIdx = h.findIndex(c => c === 'agbt' || c.includes('agbt'));
                r.rows.forEach(row => {
                    if (aIdx !== -1) {
                        const m = parseFloat(row[aIdx]);
                        if (!isNaN(m)) { agbtSum += m; agbtCount++; }
                    }
                });
            });
            const agbtMins = agbtCount > 0 ? Math.round(agbtSum / agbtCount) : 210;
            const agbtStr = `${String(Math.floor(agbtMins / 60)).padStart(2, '0')}:${String(agbtMins % 60).padStart(2, '0')}`;

            // ABST
            let abstSum = 0, abstCount = 0;
            recs.filter(r => r.metric === 'abst').forEach(r => {
                const h = r.header.map(c => String(c).toLowerCase().trim());
                const aIdx = h.findIndex(c => c === 'abst' || c.includes('abst'));
                r.rows.forEach(row => {
                    if (aIdx !== -1) {
                        const m = parseFloat(row[aIdx]);
                        if (!isNaN(m)) { abstSum += m; abstCount++; }
                    }
                });
            });
            const abstMins = abstCount > 0 ? Math.round(abstSum / abstCount) : 75;
            const abstStr = `${String(Math.floor(abstMins / 60)).padStart(2, '0')}:${String(abstMins % 60).padStart(2, '0')}`;

            // Break breaches
            let breakBreaches = 0;
            recs.filter(r => r.metric === 'breakbreach' || r.metric === 'break_breach' || r.metric === 'break').forEach(r => {
                breakBreaches += r.rows.length;
            });

            // Lateness
            let latenessMins = 0;
            recs.filter(r => r.metric === 'lateness').forEach(r => {
                const h = r.header.map(c => String(c).toLowerCase().trim());
                const lIdx = h.findIndex(c => c === 'exceed mins' || c === 'exceed_mins');
                r.rows.forEach(row => {
                    if (lIdx !== -1) {
                        const m = parseFloat(row[lIdx]);
                        if (!isNaN(m)) latenessMins += m;
                    } else {
                        latenessMins += 5;
                    }
                });
            });

            // Idle
            let idleHours = 0;
            recs.filter(r => r.metric === 'idle').forEach(r => {
                const h = r.header.map(c => String(c).toLowerCase().trim());
                const iIdx = h.findIndex(c => c.includes('idle') || c.includes('not_working'));
                r.rows.forEach(row => {
                    if (iIdx !== -1) {
                        const m = parseFloat(row[iIdx]);
                        if (!isNaN(m)) idleHours += m;
                    }
                });
            });
            const idleStr = idleHours > 0 ? `${idleHours.toFixed(1)}h` : '15m';

            agents.push({
                name: agentName,
                email: email,
                csat: csatPct,
                agbt: agbtStr,
                abst: abstStr,
                breakBreach: String(breakBreaches),
                lateness: Math.round(latenessMins),
                idle: idleStr,
                productivity: `${Math.max(70, Math.min(100, Math.round(csatPct - (breakBreaches * 2) - (latenessMins > 30 ? 5 : 0))))}%`
            });
        }

        const totalDrillRows = normalized.reduce((sum, r) => sum + r.rows.length, 0);

        return {
            success: true,
            agents: agents,
            summary: {
                totalAgents: agents.length,
                totalDrillRows: totalDrillRows
            },
            savedAt: new Date().toISOString(),
            historicalDays: historicalDays
        };
    }

    function message(text, isError = false) {
        const s = el('status');
        if (!s) return;
        s.textContent = text;
        s.style.color = isError ? 'var(--danger)' : 'var(--text-sub)';
    }

})();
</script>
