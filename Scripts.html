        t(key, params = {}) {
            const lang = this.currentLang || 'en';
            let text = this.translations[lang]?.[key] || this.translations['en']?.[key] || key;
            for (const [pKey, pVal] of Object.entries(params)) {
                text = text.replace(new RegExp(`\\{${pKey}\\}`, 'g'), pVal);
            }
            return text;
        },
        init(lang) {
            this.setLang(lang || 'en', false);
        },
        setLang(lang, reRender = true) {
            this.currentLang = lang;
            try {
                localStorage.setItem('agent_dashboard_lang', lang);
            } catch (e) {}

            document.documentElement.lang = lang;
            document.documentElement.dir = (lang === 'ar' ? 'rtl' : 'ltr');

            // Update language toggle button label and title
            const labelEl = el('currentLangLabel');
            const btnToggle = el('btnLangToggle');
            if (labelEl) labelEl.textContent = (lang === 'ar' ? 'English' : 'العربية');
            if (btnToggle) btnToggle.title = this.t('langSwitchTitle');

            // Update all DOM elements with data-i18n attributes
            document.querySelectorAll('[data-i18n]').forEach(elem => {
                const k = elem.getAttribute('data-i18n');
                elem.textContent = this.t(k);
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(elem => {
                const k = elem.getAttribute('data-i18n-placeholder');
                elem.placeholder = this.t(k);
            });
            document.querySelectorAll('[data-i18n-title]').forEach(elem => {
                const k = elem.getAttribute('data-i18n-title');
                elem.title = this.t(k);
            });

            if (reRender && AppState.agents.length > 0) {
                populateDropdowns();
                renderMonthOptions(AppState.availableMonths, AppState.selectedMonth);
                renderResultsList();
                renderDetailView();
                if (AppState.currentMainTab === 'stats') {
                    renderAnalyticsView();
                }
            }
        }
    };

    // Page-memory only: coalesce identical reads, expire results, and bound memory.
    // Writes deliberately keep using google.script.run directly.
    const DashboardReads = { pending: new Map(), cache: new Map(), generation: 0, ttl: 30000 };

    function dashboardReadRunner_() {
        let success = () => {};
        let failure = err => message(loadErrorText_(err), true);
        const runner = {
            withSuccessHandler(fn) { success = fn; return runner; },
            withFailureHandler(fn) { failure = fn; return runner; }
        };
        ['getDashboardDataFromSheet', 'getAgentsPeriodTable', 'getAgentDailyTimeline',
            'getAgentsChartData', 'getAgentDrillPageFromSheet', 'getAgentChartDrilldown',
            'getAgbtTicketAttribution', 'getAgbtTicketDetails'].forEach(method => {
            runner[method] = (...args) => dashboardRead_(method, args, success, failure);
        });
        return runner;
    }

    function dashboardRead_(method, args, success, failure) {
        const key = JSON.stringify([DashboardReads.generation, method, args]);
        const cached = DashboardReads.cache.get(key);
        if (cached && Date.now() - cached.at < DashboardReads.ttl) {
            const generation = DashboardReads.generation;
            Promise.resolve().then(() => {
                if (generation === DashboardReads.generation) success(JSON.parse(cached.json));
            }).catch(failure);
            return;
        }
        DashboardReads.cache.delete(key);
        const waiting = DashboardReads.pending.get(key);
        if (waiting) { waiting.listeners.push({ success, failure }); return; }
        const entry = { listeners: [{ success, failure }], generation: DashboardReads.generation };
        DashboardReads.pending.set(key, entry);
        let settled = false;
        const finish = (err, result) => {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            DashboardReads.pending.delete(key);
            if (!err && (!result || result.success !== true)) {
                err = { message: result && (result.message || result.error), code: result && result.code };
            }
            const fields = { getDashboardDataFromSheet: ['agents'], getAgentsPeriodTable: ['agents', 'periods'],
                getAgentDailyTimeline: ['days'], getAgentsChartData: ['agents'], getAgentDrillPageFromSheet: ['rows', 'header'] };
            if (!err && (fields[method] || []).some(field => !Array.isArray(result[field]))) {
                err = { code: 'INVALID_RESPONSE' };
            }
            if (!err && entry.generation === DashboardReads.generation) {
                try {
                    const json = JSON.stringify(result);
                    if (json.length <= 300000) {
                        DashboardReads.cache.set(key, { json, at: Date.now() });
                        while (DashboardReads.cache.size > 20) DashboardReads.cache.delete(DashboardReads.cache.keys().next().value);
                    }
                } catch (e) { /* Cache failure must not fail a successful read. */ }
            }
            entry.listeners.forEach(listener => {
                try { if (err) listener.failure(err); else listener.success(result); }
                catch (e) { console.error('Dashboard render failed:', e); }
            });
        };
        // A late RPC cannot replace a timed-out result or leave a spinner forever.
        const timer = setTimeout(() => finish({ code: 'READ_TIMEOUT', message: I18N.currentLang === 'ar'
            ? 'استغرق التحميل وقتًا أطول من المتوقع. أعد المحاولة من زر التحديث.'
            : 'Loading took too long. Use Refresh to try again.' }), 60000);
        entry.cancel = () => { settled = true; clearTimeout(timer); entry.listeners = []; };
        try {
            google.script.run.withSuccessHandler(res => finish(null, res))
                .withFailureHandler(err => finish(err || {}))[method](...args);
        } catch (err) { finish(err); }
    }

    function loadErrorText_(err) {
        const detail = err && (err.message || err.error);
        return I18N.t('loadFailed') + (detail || (I18N.currentLang === 'ar'
            ? 'تعذر تحميل البيانات. أعد المحاولة من زر التحديث.' : 'Unable to load data. Use Refresh to retry.'));
    }

    function invalidateDashboardReads_() {
        DashboardReads.generation++;
        DashboardReads.cache.clear();
        DashboardReads.pending.forEach(entry => entry.cancel());
        DashboardReads.pending.clear();
        AppState.drillRequestId++;
        AppState.analyticsRequestId++;

        AppState.agentChartKey = '';

    /**
     * احتساب درجة ترتيب الحالة للمقاييس الفردية
     */
    function getStatusSortScore(agent, metric) {
        if (!agent) return 0;
        if (metric === 'csat') return agent.csat || 0;
        if (metric === 'abst') return -parseTimeToSeconds(agent.abst);
        if (metric === 'lateness') return -(agent.lateness || 0);
        if (metric === 'breakBreach') return -(Number(agent.breakExceedMins) || 0);
        if (metric === 'productivity') return parseFloat(String(agent.productivity || '0').replace('%', '')) || 0;
        return 0;
    }

    /**
     * تحويل الوقت بصيغة (mm:ss أو ثواني) إلى رقم ثواني نقي لسهولة المقارنة والترتيب
     */
    function parseTimeToSeconds(timeStr) {
        if (!timeStr) return 999999;
        const str = String(timeStr).trim();
        if (str.includes(':')) {
            const parts = str.split(':');
            return (parseInt(parts[0], 10) || 0) * 60 + (parseInt(parts[1], 10) || 0);
        }
        const num = parseFloat(str);
        return isNaN(num) ? 999999 : num * 60;
    }

    function formatSeconds(secs) {
        const total = Math.max(0, Math.round(secs || 0));
        const m = Math.floor(total / 60);
        const s = total % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    /**
     * ========================================================================
     * طبقة عرض الوقت المركزية (Global Time Formatting Layer)
     * - القيمة الأساسية canonical = دقائق (لا يتغير تخزينها أو حسابها).
     * - Decimal (افتراضي) = ساعات عشرية، مثال 4.50
     * - Time = ساعات/دقائق/ثواني، مثال 4h 30m 15s
     * ========================================================================
     */
    function parseDurationValueToMinutes(value) {
        if (value === null || value === undefined) return null;
        if (typeof value === 'number') return isFinite(value) ? value : null;
        const s = String(value).trim();
        if (!s || s === '—') return null;
        // MM:SS أو HH:MM:SS (القيم القادمة من الخادم بصيغة mm:ss)
        if (s.indexOf(':') !== -1) {
            const p = s.split(':');
            if (p.length >= 3) {
                return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0) + (parseInt(p[2], 10) || 0) / 60;
            }
            return (parseInt(p[0], 10) || 0) + (parseInt(p[1], 10) || 0) / 60;
        }
        // 2h 15m 30s / 12m ...
        const hm = s.match(/(\d+(?:[.,]\d+)?)\s*h/i);
        const mm = s.match(/(\d+(?:[.,]\d+)?)\s*m(?!s)/i);
        const sm = s.match(/(\d+(?:[.,]\d+)?)\s*s(?:ec)?/i);
        if (hm || mm || sm) {
            return (hm ? parseFloat(hm[1].replace(',', '.')) * 60 : 0)
                + (mm ? parseFloat(mm[1].replace(',', '.')) : 0)
                + (sm ? parseFloat(sm[1].replace(',', '.')) / 60 : 0);
        }
        const n = parseFloat(s.replace(',', '.'));
        return isNaN(n) ? null : n; // رقم مجرد = دقائق
    }

    // يحوّل قيمة بالساعات (مثل Idle من الخادم، أو نص مثل "12m") إلى دقائق
    function hoursValueToMinutes(value) {
        if (value === null || value === undefined || value === '') return null;
        if (typeof value === 'number') return isFinite(value) ? value * 60 : null;
        const s = String(value).trim();
        if (!s || s === '—') return null;
        if (/[a-z:]/i.test(s)) return parseDurationValueToMinutes(s);
        const n = parseFloat(s.replace(',', '.'));
        return isNaN(n) ? null : n * 60;
    }

    function formatDuration(minutes, mode) {
        const m = mode || AppState.timeMode || 'decimal';
        if (minutes === null || minutes === undefined || minutes === '' || !isFinite(Number(minutes))) return '—';
        const total = Number(minutes);
        if (m === 'time') {
            const neg = total < 0;
            const totalSecs = Math.round(Math.abs(total) * 60);
            const h = Math.floor(totalSecs / 3600);
            const mi = Math.floor((totalSecs % 3600) / 60);
            const se = totalSecs % 60;
            // لا نُظهر أي مكوّن صفري (لا 0h ولا 0m ولا 0s)
            const parts = [];
            if (h > 0) parts.push(h + 'h');
            if (mi > 0) parts.push(mi + 'm');
            if (se > 0) parts.push(se + 's');
            if (parts.length === 0) parts.push('0m');
            return (neg ? '-' : '') + parts.join(' ');
        }
        return total.toFixed(2);
    }

    // أغلفة مختصرة حسب نوع القيمة المصدرية
    function fmtMinutes(value) {
        if (value === null || value === undefined || value === '' || !isFinite(Number(value))) return '—';
        if (AppState.timeMode === 'time') return formatDuration(Number(value), 'time');
        return Number(value).toFixed(1);
    }
    function fmtTimeStr(value) {
        if (value === null || value === undefined || value === '' || !isFinite(Number(value))) return '—';
        if (AppState.timeMode === 'time') return formatDuration(Number(value), 'time');
        return Number(value).toFixed(2);
    }
    function fmtHours(value) {
        if (value === null || value === undefined || value === '' || !isFinite(Number(value))) return '—';
        if (AppState.timeMode === 'time') return formatDuration(Number(value) * 60, 'time');
        return Number(value).toFixed(1);
    }

    function parseMinutesFromString(str) {
        const s = String(str || '').trim().toLowerCase();
        const num = parseFloat(s.replace(/[^0-9.]/g, ''));
        if (isNaN(num)) return 0;
        return num;
    }

    const el = id => document.getElementById(id);

    function escapeHtml(value) {
        return String(value == null ? '' : value)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // القيمة فاضية أصلًا (لا يوجد رقم) => تُعرض كشرطة "—" بدل صفر
    function isBlank(value) {
        return value === null || value === undefined || String(value).trim() === '';
    }
    function blankDash(value) { return isBlank(value) ? '—' : String(value); }

    // يعيد رسم كل الأماكن التي تعرض مددًا زمنية بعد تبديل الوضع

    function formatMonthLabel(monthStr) {
        if (!monthStr || typeof monthStr !== 'string') return '';
        const parts = monthStr.split('-');
        if (parts.length < 2) return monthStr;
        const year = parts[0];
        const monthNum = parseInt(parts[1], 10);
        const monthNamesEn = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const monthNamesAr = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
        if (monthNum >= 1 && monthNum <= 12) {
            const name = (I18N.currentLang === 'ar') ? monthNamesAr[monthNum - 1] : monthNamesEn[monthNum - 1];
            return `${name} ${year} (${monthStr})`;
        }
        return monthStr;
    }

    function setupMonthSelector() {
        const sel = el('monthSelect');
        if (!sel) return;
        sel.addEventListener('change', (e) => {
            const chosen = e.target.value;
            if (chosen === AppState.selectedMonth) return;
            AppState.selectedMonth = chosen;
            // تصفير سجلات الدريل والصفحات الخاصة بالشهور السابقة
            AppState.drillRecords = {};
            AppState.activeDrillData = null;
            AppState.agentChartKey = '';
            AppState.page = 0;
            loadSheetData();
        });
    }

    function renderMonthOptions(availableMonths, selectedMonth) {
        const sel = el('monthSelect');
        if (!sel) return;
        const months = Array.isArray(availableMonths) ? availableMonths : [];
        let html = `<option value="">${I18N.t('currentMonthOpt')}</option>`;
        months.forEach(m => {
            const label = formatMonthLabel(m);
            const isSelected = (m === selectedMonth) ? ' selected' : '';
            html += `<option value="${escapeHtml(m)}"${isSelected}>${escapeHtml(label)}</option>`;
        });
        sel.innerHTML = html;
        sel.value = selectedMonth || '';
    }

    function setupTabNavigation() {
        const tabs = [
            { name: 'data', btn: el('tabDataView'), section: el('viewDataSection') },
            { name: 'stats', btn: el('tabStatsView'), section: el('viewStatsSection') },
            { name: 'weekly', btn: el('tabWeeklyView'), section: el('viewWeeklySection') },
            { name: 'monthly', btn: el('tabMonthlyView'), section: el('viewMonthlySection') }
        ].filter(t => t.btn && t.section);

        function activate(name) {
            AppState.currentMainTab = name;
            tabs.forEach(t => {
                const active = (t.name === name);
                t.btn.classList.toggle('active', active);
                t.btn.setAttribute('aria-selected', active ? 'true' : 'false');
                t.section.hidden = !active;
            });
            if (name === 'stats') renderAnalyticsView();
            if (name === 'weekly') loadPeriodTable('weekly');
            if (name === 'monthly') loadPeriodTable('monthly');

        tabs.forEach(t => t.btn.addEventListener('click', () => activate(t.name)));

        // منتقي المقياس وحقول البحث لجداول الأسبوعي/الشهري
        const weeklySel = el('weeklyMetricSelect');
        const monthlySel = el('monthlyMetricSelect');
        if (weeklySel) weeklySel.addEventListener('change', () => loadPeriodTable('weekly'));
        if (monthlySel) monthlySel.addEventListener('change', () => loadPeriodTable('monthly'));

        const weeklySearch = el('weeklySearch');

                    renderPeriodTable(AppState.periodData['weekly'], 'weekly');
                }
            });

                    renderPeriodTable(AppState.periodData['monthly'], 'monthly');
                }
