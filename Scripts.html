    // ============ جداول الأسبوعي / الشهري (Weekly / Monthly Pivot) ============
    function escPeriod(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function loadPeriodTable(periodType) {
        if (AppState.sheetLoading) return;
        const requestId = (AppState.periodRequestIds[periodType] || 0) + 1;
        AppState.periodRequestIds[periodType] = requestId;
        const metricSelect = el(periodType === 'weekly' ? 'weeklyMetricSelect' : 'monthlyMetricSelect');
        const tableEl = el(periodType === 'weekly' ? 'weeklyTable' : 'monthlyTable');
        const emptyEl = el(periodType === 'weekly' ? 'weeklyEmpty' : 'monthlyEmpty');
        const metric = metricSelect ? metricSelect.value : 'csat';

        if (tableEl) tableEl.innerHTML = '<tbody><tr><td colspan="100%" class="period-cell empty" style="padding:28px 20px; text-align:center; font-size:13px; color:var(--muted);">' + I18N.t('periodLoadingTable') + '</td></tr></tbody>';
        if (emptyEl) emptyEl.hidden = true;

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            dashboardReadRunner_()
                .withSuccessHandler(res => {
                    if (requestId !== AppState.periodRequestIds[periodType]) return;
                    renderPeriodTable(res, periodType);
                })
                .withFailureHandler(err => {
                    if (requestId !== AppState.periodRequestIds[periodType]) return;
                    if (tableEl) tableEl.innerHTML = '<tbody><tr><td colspan="100%" class="period-cell empty" style="padding:28px 20px; text-align:center; color:var(--danger);">' + escPeriod(loadErrorText_(err)) + '</td></tr></tbody>';
                })
                .getAgentsPeriodTable(metric, periodType, I18N.currentLang, AppState.selectedMonth || '');
        } else {
            // وضع المعاينة المحلي: محاكاة فورية لبيانات حقيقية أنيقة
            setTimeout(() => {
                if (requestId !== AppState.periodRequestIds[periodType]) return;
                const mockRes = getMockPeriodTableData(periodType, metric);
                renderPeriodTable(mockRes, periodType);
            }, 100);
        }
    }

    function getMockPeriodTableData(periodType, metric) {
        if (typeof window !== 'undefined' && typeof window.__LOCAL_PREVIEW_GET_PERIOD_DATA__ === 'function') {
            return window.__LOCAL_PREVIEW_GET_PERIOD_DATA__(periodType, metric, AppState.agents, I18N.currentLang, AppState.selectedMonth || '');
        }
        return { success: false, metric: metric, periodType: periodType, periods: [], agents: [] };
    }

    function renderPeriodTable(res, periodType) {
        const tableEl = el(periodType === 'weekly' ? 'weeklyTable' : 'monthlyTable');
        const emptyEl = el(periodType === 'weekly' ? 'weeklyEmpty' : 'monthlyEmpty');
        if (!tableEl) return;

        AppState.periodData = AppState.periodData || {};
        AppState.periodData[periodType] = res;

        const allAgents = (res && Array.isArray(res.agents)) ? res.agents : [];
        const periods = (res && Array.isArray(res.periods)) ? res.periods : [];
        const metric = (res && res.metric) || 'csat';

        const searchInput = el(periodType === 'weekly' ? 'weeklySearch' : 'monthlySearch');
        const query = (searchInput ? searchInput.value : '').toLowerCase().trim();

        const agents = query
            ? allAgents.filter(a => (a.name || '').toLowerCase().includes(query) || (a.email || '').toLowerCase().includes(query))
            : allAgents;

        if (!allAgents.length || !periods.length) {
            tableEl.innerHTML = '';
            if (emptyEl) emptyEl.hidden = false;
            return;
        }
        if (emptyEl) emptyEl.hidden = true;

        if (!agents.length) {
            tableEl.innerHTML = '<tbody><tr><td colspan="100%" class="period-cell empty" style="padding:28px 20px; text-align:center; font-size:13px; color:var(--muted);">' + I18N.t('noMatchingRows') + '</td></tr></tbody>';
            return;
        }

        let html = '<thead><tr><th class="period-agent-col">' + I18N.t('periodAgentCol') + ' (' + agents.length + ')</th>';
        periods.forEach(p => {
            html += '<th>' + escPeriod(p.label) + (p.range ? '<small>(' + escPeriod(p.range) + ')</small>' : '') + '</th>';
        });
        html += '</tr></thead><tbody>';

        agents.forEach(a => {
            const emailAttr = escPeriod(a.email || '');
            html += '<tr><td class="period-agent-col" dir="auto"><button type="button" class="agent-name-link" data-email="' + emailAttr + '" style="font-weight:600;">' + escPeriod(a.name || a.email) + '</button></td>';
            periods.forEach(p => {
                const v = (a.values && a.values[p.key] !== undefined) ? a.values[p.key] : null;
                html += periodCellHtml(v, metric);
            });
            html += '</tr>';
        });
        html += '</tbody>';
        tableEl.innerHTML = html;

        // تفعيل النقر على اسم الوكيل لفتح تفاصيله
        tableEl.querySelectorAll('.agent-name-link').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const em = e.currentTarget.getAttribute('data-email');
                if (em) selectAgent(em);
            });
        });
    }

    function periodCellHtml(v, metric) {
        const mAttr = ' data-metric="' + escPeriod(metric) + '"';
        if (v === null || v === undefined) {
            return '<td' + mAttr + '><span class="period-cell empty">—</span></td>';
        }
        let cls = '';
        let text = '';
        if (metric === 'csat') {
            if (v >= 90) cls = 'good';
            else if (v < 75) cls = 'bad';
            else cls = 'mid';
            text = v + '%';
        } else if (metric === 'abst') {
            text = formatDuration(v);
        } else {
            text = String(v);
        }
        return '<td' + mAttr + '><span class="period-cell ' + cls + '" title="' + text + '">' + text + '</span></td>';
    }

    function activeChartMetricKey_() {
        return (AppState.chartGroupBy === 'agent')
            ? (AppState.agentChartMetric || 'abst')
            : (AppState.currentChartTab || 'csat');
    }

    // يبني نفس تبويبات المقياس حسب الوضع الحالي (By Day / By Agent)
    function renderChartMetricTabs() {
        const group = el('chartTabsGroup');
        if (!group) return;
        const mode = (AppState.chartGroupBy === 'agent') ? 'agent' : 'day';
        const active = activeChartMetricKey_();
        group.innerHTML = CHART_METRIC_TABS[mode].map(key => {
            const label = I18N.t(chartTabLabelKey_(key)) || (METRIC_LABELS[key] || key);
            const isActive = key === active;
            const color = (chartMetricMeta_(key, false).color) || '';
            return `<button type="button" class="chart-tab-btn${isActive ? ' active' : ''}" role="tab" aria-selected="${isActive ? 'true' : 'false'}" data-chart="${key}" style="--mc:${color}">${escPeriod(label)}</button>`;
        }).join('');
    }

    function setActiveChartMetric(key) {
        if (AppState.chartGroupBy === 'agent') {
            if (CHART_METRIC_TABS.agent.indexOf(key) === -1) return;
            AppState.agentChartMetric = key;
            AppState.agentChartKey = '';
        } else {
            if (CHART_METRIC_TABS.day.indexOf(key) === -1) return;
            AppState.currentChartTab = key;
        }
        renderChartMetricTabs();
        renderSvgChart();
    }

    function setupChartTabs() {
        const tabsGroup = el('chartTabsGroup');
        if (tabsGroup) {
            tabsGroup.addEventListener('click', (e) => {
                const btn = e.target && e.target.closest ? e.target.closest('.chart-tab-btn') : null;
                if (!btn) return;
                const key = btn.getAttribute('data-chart');
                if (key) setActiveChartMetric(key);
            });
        }
        renderChartMetricTabs();

        // Chart Display Mode Toggle (Bars vs Line)
        const btnBar = el('btnChartModeBar');
        const btnLine = el('btnChartModeLine');
        if (btnBar) {
            btnBar.addEventListener('click', () => {
                AppState.chartDisplayMode = 'bar';
                btnBar.classList.add('active');
                if (btnLine) btnLine.classList.remove('active');
                renderSvgChart();
            });
        }
        if (btnLine) {
            btnLine.addEventListener('click', () => {
                AppState.chartDisplayMode = 'line';
                btnLine.classList.add('active');
                if (btnBar) btnBar.classList.remove('active');
                renderSvgChart();
            });
        }

        // منتقي نطاق تاريخ المخطط
        const datePresetSelect = el('chartDateRangePreset');
        const customWrap = el('chartCustomCalendarWrap');
        if (datePresetSelect) {
            datePresetSelect.addEventListener('change', (e) => {
                const val = e.target.value;
                AppState.chartDatePreset = val;
                if (customWrap) {
                    customWrap.style.display = val === 'custom' ? 'inline-flex' : 'none';
                    if (val === 'custom') {
                        const startInput = el('chartStartDate');
                        const endInput = el('chartEndDate');
                        const toIsoDay = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
                        if (startInput && !startInput.value) {
                            const start = new Date();
                            start.setDate(start.getDate() - 13);
                            startInput.value = toIsoDay(start);
                        }
                        if (endInput && !endInput.value) {
                            endInput.value = toIsoDay(new Date());
                        }
                        AppState.chartStartDate = startInput?.value || '';
                        AppState.chartEndDate = endInput?.value || '';
                    }
                }
                renderSvgChart();
            });
        }

        const btnApplyCustom = el('btnApplyChartCustomDates');
        if (btnApplyCustom) {
            btnApplyCustom.addEventListener('click', () => {
                AppState.chartStartDate = el('chartStartDate')?.value || '';
                AppState.chartEndDate = el('chartEndDate')?.value || '';
                renderSvgChart();
            });
        }

        const startInput = el('chartStartDate');
        const endInput = el('chartEndDate');
        if (startInput) {
            startInput.addEventListener('change', () => {
                AppState.chartStartDate = startInput.value;
                renderSvgChart();
            });
        }
        if (endInput) {
            endInput.addEventListener('change', () => {
                AppState.chartEndDate = endInput.value;
                renderSvgChart();
            });
        }

        // وضع التجميع: حسب اليوم | حسب الشفت (الشفت للوكيل الفردي فقط — بدون إعداد يدوي)
        const btnByDay = el('btnChartByDay');
        const btnByShift = el('btnChartByShift');

        function refreshShiftAnalytics() {
            const email = currentAnalyticsEmail();
            if (email) {
                loadSingleAgentAnalytics(email);
            } else {
                renderAnalyticsQuickStripAndChart();
            }
        }

        function setGroupingMode(byShift) {
            // All Agents: الشفت معطّل ويُفرض الوضع التقويمي
            if (byShift && !currentAnalyticsEmail()) return;
            AppState.chartByShift = !!byShift;
            AppState.shiftConfigNeeded = false;
            if (btnByDay) btnByDay.classList.toggle('active', !AppState.chartByShift);
            if (btnByShift) btnByShift.classList.toggle('active', AppState.chartByShift);
            refreshShiftAnalytics();
        }

        if (btnByDay) btnByDay.addEventListener('click', () => setGroupingMode(false));
        if (btnByShift) btnByShift.addEventListener('click', () => {
            if (!currentAnalyticsEmail()) {
                if (el('status')) message(I18N.t('chartShiftSingleAgentOnly'), true);
                return;
            }
            setGroupingMode(true);
        });

        // مفتاح التجميع: حسب اليوم | حسب الوكيل (نفس تبويبات المقياس في الوضعين)
        const btnGroupDay = el('btnChartGroupDay');
        const btnGroupAgent = el('btnChartGroupAgent');

        function applyChartGroupVisibility() {
            refreshChartToolbar();
        }

        function setChartGroupBy(mode) {
            // "حسب الوكيل" متاح في وضع All Agents فقط (المقارنة بين الوكلاء)
            if (mode === 'agent' && isSingleAgentSelected()) return;
            if (mode === 'agent' && AppState.chartByShift) AppState.chartByShift = false;
            AppState.chartGroupBy = (mode === 'agent') ? 'agent' : 'day';
            AppState.agentChartKey = '';
            refreshChartToolbar();
            renderSvgChart();
        }

        if (btnGroupDay) btnGroupDay.addEventListener('click', () => setChartGroupBy('day'));
        if (btnGroupAgent) btnGroupAgent.addEventListener('click', () => setChartGroupBy('agent'));
        applyChartGroupVisibility();
    }

    // هل يوجد وكيل محدّد في فلتر الإحصائيات؟
    function isSingleAgentSelected() {
        const sel = el('analyticsAgentSelect');
        const val = sel ? String(sel.value || '').trim() : '';
        if (!val) return false;
        return (AppState.agents || []).some(a => String(a.email || '').toLowerCase() === val.toLowerCase());
    }

    // يتحكم بإظهار/إخفاء أزرار المخطط حسب الوضع الحالي (All Agents مقابل وكيل محدد)
    function refreshChartToolbar() {
        const single = isSingleAgentSelected();
        const isAgentGroup = AppState.chartGroupBy === 'agent';

        // في وضع وكيل محدد: أخفِ مجموعة "حسب اليوم | حسب الوكيل" (لا معنى للمقارنة)
        const groupToggle = el('chartGroupByToggle');
        if (groupToggle) groupToggle.style.display = single ? 'none' : 'inline-flex';

        // في وضع All Agents: أخفِ مجموعة "حسب اليوم | حسب الشفت" بالكامل
        const shiftGroup = el('chartShiftGroup');
        if (shiftGroup) shiftGroup.style.display = single ? 'inline-flex' : 'none';

        // فرض اتساق الحالة قبل رسم التبويبات
        if (!single && AppState.chartByShift) AppState.chartByShift = false;
        if (single && AppState.chartGroupBy === 'agent') { AppState.chartGroupBy = 'day'; AppState.agentChartKey = ''; }
        if (!isAgentGroup && CHART_METRIC_TABS.day.indexOf(AppState.currentChartTab) === -1) AppState.currentChartTab = 'csat';
        if (isAgentGroup && CHART_METRIC_TABS.agent.indexOf(AppState.agentChartMetric) === -1) { AppState.agentChartMetric = 'abst'; AppState.agentChartKey = ''; }

        // تبويبات المقياس: نفس المكوّن في وضعي By Day و By Agent
        const tabs = el('chartTabsGroup');
        if (tabs) tabs.style.display = '';
        renderChartMetricTabs();

        // وضع العرض: يبقى ظاهرًا في الوضعين للحفاظ على ثبات التخطيط.
        // By Agent = أعمدة فقط، لذا يُثبَّت Bars ويُعطَّل Line.
        const displayToggle = el('chartDisplayModeToggle');
        if (displayToggle) displayToggle.style.display = '';
        const btnBar = el('btnChartModeBar');
        const btnLine = el('btnChartModeLine');
        if (isAgentGroup) {
            if (btnBar) btnBar.classList.add('active');
            if (btnLine) {
                btnLine.classList.remove('active');
                btnLine.disabled = true;
                btnLine.style.opacity = '0.45';
                btnLine.style.cursor = 'not-allowed';
            }
        } else {
            const dm = AppState.chartDisplayMode || ((AppState.currentChartTab === 'sessions' || AppState.currentChartTab === 'long') ? 'bar' : 'line');
            if (btnBar) btnBar.classList.toggle('active', dm === 'bar');
            if (btnLine) {
                btnLine.classList.toggle('active', dm === 'line');
                btnLine.disabled = false;
                btnLine.style.opacity = '';
                btnLine.style.cursor = '';
            }
        }

        // حالات الأزرار النشطة
        if (el('btnChartByDay')) el('btnChartByDay').classList.toggle('active', !AppState.chartByShift);
        if (el('btnChartByShift')) el('btnChartByShift').classList.toggle('active', AppState.chartByShift);
        if (el('btnChartGroupDay')) el('btnChartGroupDay').classList.toggle('active', AppState.chartGroupBy !== 'agent');
        if (el('btnChartGroupAgent')) el('btnChartGroupAgent').classList.toggle('active', AppState.chartGroupBy === 'agent');
    }

    // للتوافق: تُستدعى من renderAnalyticsView
    function updateShiftModeAvailability(isSingleAgent) {
        refreshChartToolbar();
    }

    function setupEventListeners() {
        // Drill-down: النقر/لوحة المفاتيح على نقطة أو بار (Single Agent فقط عبر data-bucket-index)
        function handleChartBucketActivate(e) {
            const g = e.target && e.target.closest ? e.target.closest('.chart-point-group[data-bucket-index], .chart-bar-group[data-bucket-index]') : null;
            if (!g) return false;
            const idx = parseInt(g.getAttribute('data-bucket-index'), 10);
            if (isNaN(idx)) return false;
            e.preventDefault();
            openChartDrilldown(idx);
            return true;
        }
        document.addEventListener('click', (e) => { handleChartBucketActivate(e); });
        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
            handleChartBucketActivate(e);
        });

        // تفويض نقر زر "تفاصيل" في عمود المساهمة (AGBT)
        document.addEventListener('click', (e) => {
            const btn = e.target && e.target.closest ? e.target.closest('.agbt-details-btn') : null;
            if (btn) {
                const ticketId = btn.getAttribute('data-ticket-id');
                const baseMins = btn.getAttribute('data-base-mins') || '';
                if (ticketId) openAgbtDetails(ticketId, baseMins);
                return;
            }
            const detailBtn = e.target && e.target.closest ? e.target.closest('.agent-detail-btn') : null;
            if (detailBtn) {
                const email = detailBtn.getAttribute('data-email');
                if (email) window.selectAgentFromTable(email);
                return;
            }
            // النقر على اسم الوكيل يفتح تفاصيله
            const nameLink = e.target && e.target.closest ? e.target.closest('.agent-name-link') : null;
            if (nameLink) {
                const email = nameLink.getAttribute('data-email');
                if (email) window.selectAgentFromTable(email);
                return;
            }
            // النقر على أي خلية مقياس في جدول All Agents يفتح صفحة ذلك المقياس للوكيل
            const metricCell = e.target && e.target.closest ? e.target.closest('.agent-metric-cell') : null;
            if (metricCell) {
                const email = metricCell.getAttribute('data-email');
                const metricKey = metricCell.getAttribute('data-metric');
                if (email && metricKey) openAgentTabWithMetric(email, metricKey);
            }
        });

        // زر تبديل اللغة الفوري (English / العربية)
        const btnLangToggle = el('btnLangToggle');
        if (btnLangToggle) {
            btnLangToggle.addEventListener('click', () => {
                const nextLang = I18N.currentLang === 'en' ? 'ar' : 'en';
                I18N.setLang(nextLang, true);
                updateTimeModeUI();
            });
        }

        // زر التبديل العالمي لعرض الوقت (Decimal ↔ Time)
        const btnTimeMode = el('btnTimeModeToggle');
        if (btnTimeMode) {
            btnTimeMode.addEventListener('click', () => {
                AppState.timeMode = (AppState.timeMode === 'time') ? 'decimal' : 'time';
                try { localStorage.setItem('gas_agent_dashboard_time_mode', AppState.timeMode); } catch (e) {}
                updateTimeModeUI();
                rerenderTimeViews();
            });
        }

        // نافذة بوابة الإدارة (Admin Modal)
        // setupAdminModal تُخفي زر الإدارة لغير المدراء، أما بقية إعدادات الإدارة فلا تُشغَّل إلا للمدراء
        setupAdminModal();
        const initData = (typeof window !== 'undefined' && window.APP_INITIAL_DATA) ? window.APP_INITIAL_DATA : {};
        AppState.isAdmin = Boolean(initData.isAdmin);
        AppState.isPrimaryAdmin = Boolean(initData.isPrimaryAdmin);
        AppState.currentUserEmail = String(initData.currentUserEmail || '');
        if (initData.isAdmin) {
            setupAdminUserManagement();
            setupAdminManagement();
        }

        // زر التحديث المباشر من الشيت
        const btnRefresh = el('btnRefreshSheet');
        if (btnRefresh) {
            btnRefresh.addEventListener('click', loadSheetData);
        }

        // زر العودة لجميع الوكلاء (يظهر في وضع الوكيل الفردي)
        const btnBackToAll = el('btnBackToAllAgents');
        if (btnBackToAll) {
            btnBackToAll.addEventListener('click', () => {
                AppState.page = 0;
                AppState.searchQuery = '';
                if (el('search')) el('search').value = '';
                resetDetailFilters();
                activateAgentTab('all');
            });
        }

        // منتقي المقياس العلوي في وضع جميع الوكلاء
        const topMetricSel = el('topMetricSelect');
        if (topMetricSel) {
            topMetricSel.addEventListener('change', (e) => {
                AppState.selectedMetric = e.target.value;
                const sidebarMetric = el('metric');
                if (sidebarMetric) sidebarMetric.value = e.target.value;
                AppState.page = 0;
                renderDetailView();
            });
        }

        // منتقي الوكيل في الشريط الجانبي
        const agentSelect = el('agent');
        if (agentSelect) {
            agentSelect.addEventListener('change', (e) => {
                AppState.page = 0;
                AppState.searchQuery = '';
                if (el('search')) el('search').value = '';
                resetDetailFilters();
                if (e.target.value) {
                    openAgentTab(e.target.value);
                } else {
                    activateAgentTab('all');
                }
            });
        }

        // منتقي المقياس في الشريط الجانبي
        const metricSelect = el('metric');
        if (metricSelect) {
            metricSelect.addEventListener('change', (e) => {
                AppState.selectedMetric = e.target.value;
                const topSelect = el('topMetricSelect');
                if (topSelect) topSelect.value = e.target.value;
                AppState.page = 0;
                AppState.searchQuery = '';
                if (el('search')) el('search').value = '';
                resetDetailFilters();
                renderResultsList();
                renderDetailView();
            });
        }

        // منتقي الوكيل في تبويب الإحصائيات
        const analyticsAgentSelect = el('analyticsAgentSelect');
        if (analyticsAgentSelect) {
            analyticsAgentSelect.addEventListener('change', () => {
                renderAnalyticsView();
            });
        }

        // شريط البحث داخل الجدول
        const searchInput = el('search');
        const clearBtn = el('clearSearch');
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                AppState.searchQuery = (e.target.value || '').trim().toLowerCase();
                AppState.page = 0;
                if (clearBtn) clearBtn.hidden = !AppState.searchQuery;
                onDrillQueryChanged();
            });
        }

        if (clearBtn) {
            clearBtn.addEventListener('click', () => {
                if (searchInput) searchInput.value = '';
                AppState.searchQuery = '';
                clearBtn.hidden = true;
                AppState.page = 0;
                onDrillQueryChanged();
            });
        }

        // أزرار التنقل بين الصفحات
        const prevBtn = el('previous');
        const nextBtn = el('next');
        if (prevBtn) {
            prevBtn.addEventListener('click', () => {
                if (AppState.page > 0) {
                    AppState.page--;
                    onDrillPageChanged();
                }
            });
        }
        if (nextBtn) {
            nextBtn.addEventListener('click', () => {
                AppState.page++;
                onDrillPageChanged();
            });
        }

        // زر تصدير CSV
        const csvBtn = el('csv');
        if (csvBtn) {
            csvBtn.addEventListener('click', downloadTableCsv);
        }

        // زر إعادة تعيين الفلاتر
        const resetFiltersBtn = el('resetMetricFiltersBtn');
        if (resetFiltersBtn) {
            resetFiltersBtn.addEventListener('click', () => {
                resetDetailFilters();
                renderMetricFilterToolbar(AppState.selectedMetric);
                onDrillFiltersChanged();
            });
        }
    }

    // ================= إدارة المستخدمين في نافذة الإدارة (حظر / حذف) =================
    function setupAdminUserManagement() {
        const listEl = el('adminUsersList');
        const refreshBtn = el('adminBtnRefreshUsers');
        const deleteModal = el('adminDeleteModal');
        const deleteAgentName = el('adminDeleteAgentName');
        const deleteConfirmInput = el('adminDeleteConfirmInput');
        const btnConfirmDelete = el('adminBtnConfirmDelete');
        const btnCancelDelete = el('adminBtnCancelDelete');
        const btnCancelDelete2 = el('adminBtnCancelDelete2');
        if (!listEl) return;

        let deleteTargetEmail = '';

        function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

        function loadUsers() {
            listEl.innerHTML = '<p style="color:var(--muted);font-size:12px;margin:0;">' + I18N.t('adminLoading') + '</p>';
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(renderUsers)
                    .withFailureHandler(err => { listEl.innerHTML = '<p style="color:#f87171;font-size:12px;">❌ ' + esc(err.message) + '</p>'; })
                    .getAllAgentsForAdmin();
            } else {
                listEl.innerHTML = '<p style="color:var(--muted);font-size:12px;">' + I18N.t('adminUserMgmtPublishedOnly') + '</p>';
            }
        }

        function renderUsers(res) {
            const agents = (res && Array.isArray(res.agents)) ? res.agents : [];
            const bannedSet = new Set((res && Array.isArray(res.bannedAgents)) ? res.bannedAgents : []);
            const canDelete = Boolean(res && typeof res.isCurrentUserPrimaryAdmin === 'boolean' ? res.isCurrentUserPrimaryAdmin : AppState.isPrimaryAdmin);
            agents.forEach(u => { u.banned = bannedSet.has(String(u.email || '').toLowerCase().trim()); });
            if (!agents.length) { listEl.innerHTML = '<p style="color:var(--muted);font-size:12px;">' + I18N.t('adminNoAgents') + '</p>'; return; }
            listEl.innerHTML = '';
            agents.forEach(u => {
                const row = document.createElement('div');
                row.style.cssText = 'display:flex;align-items:center;gap:10px;padding:8px 10px;background:rgba(15,23,42,0.5);border:1px solid ' + (u.banned ? 'rgba(245,158,11,0.5)' : 'var(--border)') + ';border-radius:8px;';
                row.innerHTML = '<div style="flex:1;min-width:0;">' +
                    '<div style="font-size:12.5px;font-weight:700;color:#f1f5f9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(u.name || u.email) + (u.banned ? ' <span style="color:#fbbf24;font-size:11px;">' + I18N.t('adminBannedSuffix') + '</span>' : '') + '</div>' +
                    '<div style="font-size:11px;color:var(--muted);direction:ltr;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(u.email) + '</div></div>' +
                    '<button type="button" class="admin-btn-ghost" data-action="toggle" data-email="' + esc(u.email) + '" data-banned="' + u.banned + '" style="padding:5px 10px;font-size:11px;white-space:nowrap;">' + (u.banned ? I18N.t('adminUnban') : I18N.t('adminBan')) + '</button>' +
                    (canDelete ? '<button type="button" class="admin-btn-ghost" data-action="del" data-email="' + esc(u.email) + '" data-name="' + esc(u.name || u.email) + '" style="padding:5px 10px;font-size:11px;color:#f87171;white-space:nowrap;">' + I18N.t('adminDelete') + '</button>' : '<span style="padding:5px 10px;font-size:11px;color:var(--muted);opacity:0.4;user-select:none;" title="' + I18N.t('adminDeletePrimaryOnly') + '">🔒</span>');
                listEl.appendChild(row);
            });
            listEl.querySelectorAll('[data-action="toggle"]').forEach(b => b.addEventListener('click', () => {
                toggleBan(b.getAttribute('data-email'), b.getAttribute('data-banned') === 'true' ? false : true);
            }));
            listEl.querySelectorAll('[data-action="del"]').forEach(b => b.addEventListener('click', () => {
                openDeleteModal(b.getAttribute('data-email'), b.getAttribute('data-name'));
            }));
        }

    /**
     * إعداد نافذة الإدارة المنبثقة (Admin Portal Modal)
     */
        function toggleBan(email, banned) {
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run.withSuccessHandler(() => loadUsers()).withFailureHandler(() => loadUsers()).setAgentBanned(email, banned);
            }
        }

        function openDeleteModal(email, name) {
            if (!AppState.isPrimaryAdmin) {
                alert(I18N.t('adminDeletePrimaryOnly'));
                return;
            }
            deleteTargetEmail = email;
            deleteAgentName.textContent = name;
            deleteConfirmInput.value = '';
            btnConfirmDelete.disabled = true;
            deleteModal.style.display = 'flex';
            deleteConfirmInput.focus();
        }

        function closeDeleteModal() {
            deleteTargetEmail = '';
            deleteModal.style.display = 'none';
            deleteConfirmInput.value = '';
            btnConfirmDelete.disabled = true;
        }

        function confirmDelete() {
            if (!AppState.isPrimaryAdmin) {
                alert(I18N.t('adminDeletePrimaryOnly'));
                return;
            }
            if (!deleteTargetEmail || deleteConfirmInput.value.trim().toLowerCase() !== deleteTargetEmail.toLowerCase()) return;
            btnConfirmDelete.disabled = true;
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(() => { closeDeleteModal(); loadUsers(); })
                    .withFailureHandler(() => { closeDeleteModal(); loadUsers(); })
                    .deleteAgentData(deleteTargetEmail);
            }
        }

        if (refreshBtn) refreshBtn.addEventListener('click', loadUsers);
        if (btnCancelDelete) btnCancelDelete.addEventListener('click', closeDeleteModal);
        if (btnCancelDelete2) btnCancelDelete2.addEventListener('click', closeDeleteModal);
        if (deleteModal) deleteModal.addEventListener('click', e => { if (e.target === deleteModal) closeDeleteModal(); });
        if (deleteConfirmInput) deleteConfirmInput.addEventListener('input', () => {
            btnConfirmDelete.disabled = deleteConfirmInput.value.trim().toLowerCase() !== (deleteTargetEmail || '').toLowerCase();
        });
        if (btnConfirmDelete) btnConfirmDelete.addEventListener('click', confirmDelete);
    }

    // ================= إدارة المدراء + المستخدمين المصرح لهم + الإحصائيات =================
    function setupAdminManagement() {
        const adminsListEl = el('adminAdminsList');
        const newAdminInput = el('adminNewAdminInput');
        const btnAddAdmin = el('adminBtnAddAdmin');
        const adminsStatus = el('adminAdminsStatus');
        const allowedListEl = el('adminAllowedList');
        const newAllowedInput = el('adminNewAllowedInput');
        const btnAddAllowed = el('adminBtnAddAllowed');
        const allowedStatus = el('adminAllowedStatus');
        if (!adminsListEl && !allowedListEl) return;

        function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

        function loadStats() {
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run.withSuccessHandler(res => {
                    if (res && res.success) {
                        const ag = el('adminStatAgents');
                        const me = el('adminStatMetrics');
                        const ro = el('adminStatRows');
                        if (ag) ag.textContent = res.totalAgents || 0;
                        if (me) me.textContent = res.totalMetrics || 7;
                        if (ro) ro.textContent = (res.totalRows || 0).toLocaleString();
                    }
                }).getAdminStats();
            }
        }

        function loadAdmins() {
            if (!adminsListEl) return;
            adminsListEl.innerHTML = '<p style="color:var(--muted);font-size:12px;margin:0;">' + I18N.t('adminLoading') + '</p>';
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run.withSuccessHandler(renderAdmins).withFailureHandler(err => { adminsListEl.innerHTML = '<p style="color:#f87171;font-size:12px;">❌ ' + esc(err.message) + '</p>'; }).getAdminsList();
            }
        }
        function renderAdmins(res) {
            if (!adminsListEl) return;
            const admins = (res && Array.isArray(res.admins)) ? res.admins : [];
            const currentUser = (res && res.currentUser) || '';
            // الإيميل الأساسي يأتي من السيرفر (لا نضمّن هوية الأدمن في كود الواجهة)
            const primaryAdmin = (res && res.primaryAdminEmail) ? String(res.primaryAdminEmail).toLowerCase() : '';
            if (!admins.length) { adminsListEl.innerHTML = '<p style="color:var(--muted);font-size:12px;">' + I18N.t('adminNoAdmins') + '</p>'; return; }
            adminsListEl.innerHTML = '';
            admins.forEach(email => {
                const isPrimary = primaryAdmin !== '' && email.toLowerCase() === primaryAdmin;
                const isCurrent = email.toLowerCase() === currentUser.toLowerCase();
                const row = document.createElement('div');
                row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:7px 10px;background:rgba(15,23,42,0.5);border:1px solid var(--border);border-radius:8px;';
                row.innerHTML = '<span style="flex:1;min-width:0;font-size:12px;color:#f1f5f9;direction:ltr;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(email) + '</span>' +
                    (isCurrent ? '<span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(16,185,129,0.2);color:#34d399;white-space:nowrap;">' + I18N.t('adminYou') + '</span>' : '') +
                    (isPrimary ? '<span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(250,204,21,0.2);color:#fbbf24;white-space:nowrap;">' + I18N.t('adminPrimary') + '</span>' : '') +
                    (isPrimary ? '' : '<button type="button" class="admin-btn-ghost" data-email="' + esc(email) + '" style="padding:4px 9px;font-size:11px;color:#f87171;white-space:nowrap;">' + I18N.t('adminRemove') + '</button>');
                adminsListEl.appendChild(row);
            });
            adminsListEl.querySelectorAll('[data-email]').forEach(b => b.addEventListener('click', () => removeAdmin(b.getAttribute('data-email'))));
        }
        function addAdmin() {
            const email = newAdminInput ? newAdminInput.value.trim() : '';
            if (!email) { if (adminsStatus) { adminsStatus.textContent = I18N.t('adminEnterEmailFirst'); adminsStatus.style.color = '#fbbf24'; } return; }
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run.withSuccessHandler(res => {
                    if (res && res.success) { if (newAdminInput) newAdminInput.value = ''; if (adminsStatus) { adminsStatus.textContent = I18N.t('adminAdded'); adminsStatus.style.color = '#34d399'; } loadAdmins(); }
                    else if (adminsStatus) { adminsStatus.textContent = '❌ ' + (res && res.message ? res.message : I18N.t('adminFailed')); adminsStatus.style.color = '#f87171'; }
                }).withFailureHandler(err => { if (adminsStatus) { adminsStatus.textContent = '❌ ' + err.message; adminsStatus.style.color = '#f87171'; } }).addAdminEmail(email);
            }
        }
        function removeAdmin(email) {
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run.withSuccessHandler(res => {
                    if (res && res.success) { if (adminsStatus) { adminsStatus.textContent = I18N.t('adminRemoved'); adminsStatus.style.color = '#34d399'; } loadAdmins(); }
                    else if (adminsStatus) { adminsStatus.textContent = '❌ ' + (res && res.message ? res.message : I18N.t('adminFailed')); adminsStatus.style.color = '#f87171'; }
                }).withFailureHandler(err => { if (adminsStatus) { adminsStatus.textContent = '❌ ' + err.message; adminsStatus.style.color = '#f87171'; } }).removeAdminEmail(email);
            }
        }
        function loadAllowed() {
            if (!allowedListEl) return;
            allowedListEl.innerHTML = '<p style="color:var(--muted);font-size:12px;margin:0;">' + I18N.t('adminLoading') + '</p>';
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run.withSuccessHandler(renderAllowed).withFailureHandler(err => { allowedListEl.innerHTML = '<p style="color:#f87171;font-size:12px;">❌ ' + esc(err.message) + '</p>'; }).getAllowedList();
            }
        }
        function renderAllowed(res) {
            if (!allowedListEl) return;
            const allowed = (res && Array.isArray(res.allowed)) ? res.allowed : [];
            const currentUser = (res && res.currentUser) || '';
            if (!allowed.length) { allowedListEl.innerHTML = '<p style="color:var(--muted);font-size:12px;">' + I18N.t('adminNoAllowed') + '</p>'; return; }
            allowedListEl.innerHTML = '';
            allowed.forEach(email => {
                const isCurrent = email.toLowerCase() === currentUser.toLowerCase();
                const row = document.createElement('div');
                row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:7px 10px;background:rgba(15,23,42,0.5);border:1px solid var(--border);border-radius:8px;';
                row.innerHTML = '<span style="flex:1;min-width:0;font-size:12px;color:#f1f5f9;direction:ltr;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(email) + '</span>' +
                    (isCurrent ? '<span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(16,185,129,0.2);color:#34d399;white-space:nowrap;">' + I18N.t('adminYou') + '</span>' : '') +
                    '<button type="button" class="admin-btn-ghost" data-email="' + esc(email) + '" style="padding:4px 9px;font-size:11px;color:#f87171;white-space:nowrap;">' + I18N.t('adminRemove') + '</button>';
                allowedListEl.appendChild(row);
            });
            allowedListEl.querySelectorAll('[data-email]').forEach(b => b.addEventListener('click', () => removeAllowed(b.getAttribute('data-email'))));
        }
        function addAllowed() {
            const email = newAllowedInput ? newAllowedInput.value.trim() : '';
            if (!email) { if (allowedStatus) { allowedStatus.textContent = I18N.t('adminEnterEmailFirst'); allowedStatus.style.color = '#fbbf24'; } return; }
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run.withSuccessHandler(res => {
                    if (res && res.success) { if (newAllowedInput) newAllowedInput.value = ''; if (allowedStatus) { allowedStatus.textContent = I18N.t('adminAdded'); allowedStatus.style.color = '#34d399'; } loadAllowed(); }
                    else if (allowedStatus) { allowedStatus.textContent = '❌ ' + (res && res.message ? res.message : I18N.t('adminFailed')); allowedStatus.style.color = '#f87171'; }
                }).withFailureHandler(err => { if (allowedStatus) { allowedStatus.textContent = '❌ ' + err.message; allowedStatus.style.color = '#f87171'; } }).addAllowedEmail(email);
            }
        }
        function removeAllowed(email) {
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run.withSuccessHandler(res => {
                    if (res && res.success) { if (allowedStatus) { allowedStatus.textContent = I18N.t('adminRemoved'); allowedStatus.style.color = '#34d399'; } loadAllowed(); }
                    else if (allowedStatus) { allowedStatus.textContent = '❌ ' + (res && res.message ? res.message : I18N.t('adminFailed')); allowedStatus.style.color = '#f87171'; }
                }).withFailureHandler(err => { if (allowedStatus) { allowedStatus.textContent = '❌ ' + err.message; allowedStatus.style.color = '#f87171'; } }).removeAllowedEmail(email);
            }
        }

        if (btnAddAdmin) btnAddAdmin.addEventListener('click', addAdmin);
        if (newAdminInput) newAdminInput.addEventListener('keydown', e => { if (e.key === 'Enter') addAdmin(); });

        loadStats();
        loadAdmins();
        if (btnAddAllowed) btnAddAllowed.addEventListener('click', addAllowed);
        if (newAllowedInput) newAllowedInput.addEventListener('keydown', e => { if (e.key === 'Enter') addAllowed(); });
        loadAllowed();

        const btnRunMigration = el('btnRunMigration');
        const migrationConfirmBox = el('migrationConfirmBox');
        const btnConfirmMigration = el('btnConfirmMigration');
        const btnCancelMigration = el('btnCancelMigration');
        const migrationStatus = el('migrationStatus');
        const migrationPrimaryLockNotice = el('migrationPrimaryLockNotice');

        if (btnRunMigration) {
            if (!AppState.isPrimaryAdmin) {
                btnRunMigration.disabled = true;
                btnRunMigration.style.opacity = '0.4';
                btnRunMigration.style.cursor = 'not-allowed';
                btnRunMigration.title = I18N.t('adminPrimaryAdminOnly');
                if (migrationPrimaryLockNotice) migrationPrimaryLockNotice.style.display = 'inline';
            } else {
                btnRunMigration.disabled = false;
                btnRunMigration.style.opacity = '1';
                btnRunMigration.style.cursor = 'pointer';
                btnRunMigration.title = '';
                if (migrationPrimaryLockNotice) migrationPrimaryLockNotice.style.display = 'none';

                btnRunMigration.addEventListener('click', () => {
                    if (migrationConfirmBox) {
                        migrationConfirmBox.style.display = 'block';
                    }
                });
                if (btnCancelMigration) {
                    btnCancelMigration.addEventListener('click', () => {
                        if (migrationConfirmBox) migrationConfirmBox.style.display = 'none';
                    });
                }
                if (btnConfirmMigration) {
                    btnConfirmMigration.addEventListener('click', () => {
                        if (migrationConfirmBox) migrationConfirmBox.style.display = 'none';
                        executeMigration();
                    });
                }
            }
        }

        function executeMigration() {
            if (!AppState.isPrimaryAdmin) {
                alert(I18N.t('adminPrimaryAdminOnly'));
                return;
            }
            btnRunMigration.disabled = true;
            btnRunMigration.textContent = '⏳ جاري الترحيل...';
            if (migrationStatus) {
                migrationStatus.style.display = 'block';
                migrationStatus.style.background = 'rgba(14,165,233,0.12)';
                migrationStatus.style.border = '1px solid rgba(14,165,233,0.4)';
                migrationStatus.style.color = '#38bdf8';
                migrationStatus.textContent = '⏳ جاري مسح الملفات القديمة وتقسيمها شهرياً وتوليد ملخصات summary.json...';
            }
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(res => {
                        btnRunMigration.disabled = false;
                        btnRunMigration.textContent = I18N.t('adminBtnMigration');
                        if (migrationStatus) {
                            if (res && res.success) {
                                migrationStatus.style.background = 'rgba(16,185,129,0.12)';
                                migrationStatus.style.border = '1px solid rgba(16,185,129,0.4)';
                                migrationStatus.style.color = '#34d399';
                                migrationStatus.textContent = `✓ ${res.message || 'تم الترحيل بنجاح!'}`;
                                setTimeout(loadSheetData, 800);
                            } else {
                                migrationStatus.style.background = 'rgba(239,68,68,0.12)';
                                migrationStatus.style.border = '1px solid rgba(239,68,68,0.4)';
                                migrationStatus.style.color = '#f87171';
                                migrationStatus.textContent = `❌ ${res && res.message ? res.message : 'فشلت عملية الترحيل'}`;
                            }
                        }
                    })
                    .withFailureHandler(err => {
                        btnRunMigration.disabled = false;
                        btnRunMigration.textContent = I18N.t('adminBtnMigration');
                        if (migrationStatus) {
                            migrationStatus.style.background = 'rgba(239,68,68,0.12)';
                            migrationStatus.style.border = '1px solid rgba(239,68,68,0.4)';
                            migrationStatus.style.color = '#f87171';
                            migrationStatus.textContent = `❌ خطأ في السكربت: ${err.message}`;
                        }
                    })
                    .migrateExistingDataToMonthlyPartitions();
            } else {
                setTimeout(() => {
                    btnRunMigration.disabled = false;
                    btnRunMigration.textContent = I18N.t('adminBtnMigration');
                    if (migrationStatus) {
                        migrationStatus.style.background = 'rgba(16,185,129,0.12)';
                        migrationStatus.style.border = '1px solid rgba(16,185,129,0.4)';
                        migrationStatus.style.color = '#34d399';
                        migrationStatus.textContent = '✓ (وضع المعاينة المحلي) تم محاكاة الترحيل بنجاح لجميع الأشهر وإنشاء summary.json.';
                    }
                }, 600);
            }
        }
    }

    function setupAdminModal() {
        const overlay = el('adminModalOverlay');
        const btnOpen = el('btnAdminPortal');
        const btnClose = el('btnCloseAdminModal');
        const jsonInput = el('adminJsonInput');
        const fileInput = el('adminFileInput');
        const btnClear = el('adminBtnClear');
        const btnSave = el('adminBtnSave');
        const btnOpenSheet = el('adminBtnOpenSheet');
        const statusBox = el('adminStatusBox');

        if (!overlay) return;

        let parsedPayload = null;

        function openModal() {
            overlay.style.display = 'flex';
            overlay.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
            if (jsonInput) jsonInput.focus();
        }

        function closeModal() {
            overlay.style.display = 'none';
            overlay.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
        }

        // زر الإدارة يفتح نافذة الإدارة المنبثقة، ويظهر فقط للمدراء المسموح لهم
        const initData = (typeof window !== 'undefined' && window.APP_INITIAL_DATA) ? window.APP_INITIAL_DATA : {};
        if (btnOpen) {
            if (!initData.isAdmin) {
                btnOpen.style.display = 'none';
            } else {
                btnOpen.addEventListener('click', openModal);
            }
        }
        if (btnClose) btnClose.addEventListener('click', closeModal);

        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && overlay.style.display === 'flex') {
                closeModal();
            }
        });

        // فحص الباراميتر لفتح النافذة تلقائياً إذا طلب المستخدم ?page=admin
        try {
            const urlParams = new URLSearchParams(window.location.search);
            const openFromUrl = urlParams.get('page') === 'admin' || urlParams.get('p') === 'admin';
            const openFromInit = window.APP_INITIAL_DATA && window.APP_INITIAL_DATA.openAdmin;
            const canOpenAdmin = Boolean(window.APP_INITIAL_DATA && window.APP_INITIAL_DATA.isAdmin);
            // لا تُفتح بوابة الإدارة إلا للأدمن (حماية واجهة إضافية؛ القرار النهائي في السيرفر)
            if (canOpenAdmin && (openFromUrl || openFromInit)) {
                setTimeout(openModal, 150);
            }
        } catch (e) {}

        // فحص الـ JSON لحظياً
        if (jsonInput) {
            jsonInput.addEventListener('input', analyzeInput);
        }

        if (fileInput) {
            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    if (jsonInput) {
                        jsonInput.value = evt.target.result;
                        analyzeInput();
                    }
                };
                reader.readAsText(file);
            });
        }

        const btnLoadSample = el('adminBtnLoadSample');
        if (btnLoadSample) {
            btnLoadSample.addEventListener('click', () => {
                if (typeof window !== 'undefined' && window.__LOCAL_PREVIEW_SAMPLE_DATASET__) {
                    if (jsonInput) {
                        jsonInput.value = JSON.stringify(window.__LOCAL_PREVIEW_SAMPLE_DATASET__, null, 2);
                        analyzeInput();
                    }
                    showAdminStatus('info', I18N.currentLang === 'ar' ? '✅ تم تحميل البيانات التجريبية! اضغط "حفظ واستيراد" للاعتماد فوراً.' : '✅ Sample dataset loaded! Click Save & Import to apply.');
                } else {
                    alert(I18N.currentLang === 'ar' ? 'ملف البيانات التجريبية متوفر في مجلد sample-data/' : 'Sample data is available in sample-data/ folder');
                }
            });
        }

        if (btnClear) {
            btnClear.addEventListener('click', () => {
                if (jsonInput) jsonInput.value = '';
                parsedPayload = null;
                updatePreview(0, 0, 0, I18N.t('adminPrevStatusWaiting'), 'var(--muted)');
                if (statusBox) statusBox.style.display = 'none';
            });
        }

        function analyzeInput() {
            if (!jsonInput) return;
            const text = jsonInput.value.trim();
            if (!text) {
                parsedPayload = null;
                updatePreview(0, 0, 0, I18N.t('adminPrevStatusWaiting'), 'var(--muted)');
                if (btnSave) btnSave.disabled = false;
                return;
            }

            try {
                const data = JSON.parse(text);
                parsedPayload = data;

                let agentsCount = 0;
                let drillsCount = 0;
                let ticketsCount = 0;

                const results = data.results || (Array.isArray(data) ? data : []);
                drillsCount = results.length;

                const agents = data.agents || data.summaryAgents || [];
                agentsCount = agents.length;

                results.forEach(r => {
                    if (r.rows && Array.isArray(r.rows)) {
                        ticketsCount += r.rows.length;
                    }
                });

                if (agentsCount === 0 && results.length > 0) {
                    const uniqueEm = new Set(results.map(r => r.agent).filter(Boolean));
                    agentsCount = uniqueEm.size;
                }

                updatePreview(agentsCount, drillsCount, ticketsCount, I18N.t('adminPreviewValid'), '#34d399');
                if (btnSave) btnSave.disabled = false;
            } catch (e) {
                parsedPayload = null;
                updatePreview(0, 0, 0, I18N.t('adminPreviewInvalid'), '#f87171');
                if (btnSave) btnSave.disabled = true;
            }
        }

        function updatePreview(agents, drills, tickets, statusText, statusColor) {
            const pAgents = el('adminPrevAgents');
            const pDrills = el('adminPrevDrills');
            const pTickets = el('adminPrevTickets');
            const pStatus = el('adminPrevStatus');
            if (pAgents) pAgents.textContent = agents;
            if (pDrills) pDrills.textContent = drills;
            if (pTickets) pTickets.textContent = tickets;
            if (pStatus) {
                pStatus.textContent = statusText;
                pStatus.style.color = statusColor;
            }
        }

        function showAdminStatus(type, message) {
            if (!statusBox) return;
            statusBox.style.display = 'block';
            statusBox.className = 'admin-status-box ' + type;
            statusBox.textContent = message;
        }

        // الحفظ إلى Google Sheets
        if (btnSave) {
            btnSave.addEventListener('click', () => {
                if (!jsonInput) return;
                const text = jsonInput.value.trim();
                if (!text) {
                    showAdminStatus('error', I18N.t('adminNeedPaste'));
                    return;
                }

                if (!parsedPayload) {
                    showAdminStatus('error', I18N.t('adminInvalidJson'));
                    return;
                }

                const options = {
                    smartDates: el('adminChkSmartDates')?.checked ?? true,
                    updateSummary: el('adminChkUpdateSummary')?.checked ?? true,
                    updateArchive: el('adminChkUpdateArchive')?.checked ?? true
                };

                btnSave.disabled = true;
                showAdminStatus('loading', I18N.t('adminSaving'));

                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler((res) => {
                            btnSave.disabled = false;
                            if (res && res.success) {
                                showAdminStatus('success', I18N.t('adminSaveSuccess', { agents: (res.agentsCount || 0), drills: (res.drillCount || 0), tickets: (res.ticketsCount || 0) }));
                                // تحديث أرقام الداشبورد فوراً!
                                setTimeout(loadSheetData, 500);
                            } else {
                                showAdminStatus('error', '❌ ' + (res?.message || I18N.t('adminSaveFail')));
                            }
                        })
                        .withFailureHandler((err) => {
                            btnSave.disabled = false;
                            showAdminStatus('error', I18N.t('adminSaveError') + err.message);
                        })
                        .importDataFromAdminPortal(text, options);
                } else {
                    // حفظ حقيقي في التخزين المحلي لوضع المعاينة
                    setTimeout(() => {
                        try {
                            const parsed = JSON.parse(text.replace(/^\uFEFF/, ''));
                            const localData = buildLocalDashboardData(parsed);
                            try {
                                localStorage.setItem('gas_agent_dashboard_local_data', JSON.stringify(localData));
                            } catch (e) {
                                console.warn('Could not cache localData in localStorage:', e);
                            }
                            try {
                                localStorage.setItem('gas_agent_dashboard_raw_json', text);
                            } catch (e) {
                                console.warn('Large dataset (>5MB) exceeded localStorage quota, storing in memory for preview:', e);
                            }
                            window.__RAW_JSON_IN_MEMORY__ = text;
                            window.__LOCAL_DASHBOARD_DATA_MEM__ = localData;
                            btnSave.disabled = false;
                            showAdminStatus('success', I18N.t('adminLocalSaveSuccess', { agents: localData.agents.length, rows: localData.summary.totalDrillRows }));
                            setTimeout(loadLocalPreviewMode, 400);
                        } catch (err) {
                            btnSave.disabled = false;
                            showAdminStatus('error', I18N.t('adminLocalSaveError') + err.message);
                        }
                    }, 500);
                }
            });
        }

        // فتح رابط Google Sheet
        if (btnOpenSheet) {
            btnOpenSheet.addEventListener('click', () => {
                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler(url => {
                            if (url) window.open(url, '_blank');
                            else alert(I18N.t('adminOpenSheetHint'));
                        })
                        .getSpreadsheetUrl();
                } else {
                    alert(I18N.t('adminOpenSheetPublishedHint'));
                }
            });
        }
    }

    function resetDetailFilters() {
        AppState.detailFilters = {
            datePreset: 'all',
            csatScore: 'all',
            channel: 'all',
            topSessions: 'all',
            breachOnly: 'all'
        };
        const badge = el('filterActiveBadge');
        if (badge) badge.hidden = true;
    }

    function loadSheetData() {
        const month = AppState.selectedMonth || '';
        if (AppState.sheetLoading && AppState.sheetLoadMonth === month) return;
        const changedMonth = AppState.sheetLoadMonth !== null && AppState.sheetLoadMonth !== month;
        const requestId = ++AppState.sheetRequestId;
        invalidateDashboardReads_();
        AppState.sheetLoading = true;
        AppState.sheetLoadMonth = month;
        if (changedMonth) {
            AppState.agents = [];
            AppState.historicalDays = [];
            AppState.chartDays = [];
            AppState.activeDrillData = null;
            if (el('detail')) el('detail').hidden = true;
            if (el('analyticsContent')) el('analyticsContent').hidden = true;
            ['weeklyTable', 'monthlyTable'].forEach(id => { if (el(id)) el(id).innerHTML = ''; });
        }
        const refresh = el('btnRefreshSheet');
        if (refresh) { refresh.disabled = true; refresh.setAttribute('aria-busy', 'true'); }
        const label = el('cloudStatusLabel');
        if (label) label.textContent = I18N.t('cloudUpdating');
        message(I18N.t('cloudUpdating'));

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            dashboardReadRunner_()
                .withSuccessHandler(res => {
                    if (requestId !== AppState.sheetRequestId) return;
                    handleSheetDataSuccess(res);
                })
                .withFailureHandler(err => {
                    if (requestId !== AppState.sheetRequestId) return;
                    handleSheetDataError(err);
                })
                .getDashboardDataFromSheet(month);
        } else {
            // وضع المعاينة المحلي (Local Preview Mode)
            setTimeout(() => { if (requestId === AppState.sheetRequestId) loadLocalPreviewMode(); }, 0);
        }
    }

    function handleSheetDataSuccess(response) {
        if (!response || response.success !== true || !Array.isArray(response.agents)) {
            handleSheetDataError(response);
            return;
        }
        AppState.sheetLoading = false;
        const refresh = el('btnRefreshSheet');
        if (refresh) { refresh.disabled = false; refresh.removeAttribute('aria-busy'); }
        const label = el('cloudStatusLabel');
        if (label) label.textContent = I18N.t('cloudRefresh');

        if (response && Array.isArray(response.availableMonths)) {
            AppState.availableMonths = response.availableMonths;
        }
        if (response.selectedMonth || response.month) {
            AppState.selectedMonth = response.selectedMonth || response.month;
        }
        AppState.sheetLoadMonth = AppState.selectedMonth || '';
        AppState.historicalDays = Array.isArray(response.historicalDays) ? response.historicalDays : [];
        AppState.chartDays = AppState.historicalDays;
        renderMonthOptions(AppState.availableMonths, AppState.selectedMonth);

        if (!response || !response.success || response.isEmpty || !response.agents || response.agents.length === 0) {
            AppState.agents = [];
            AppState.agentTabs = [];
            AppState.selectedAgent = '';
            AppState.activeTabId = 'all';
            AppState.activeDrillData = null;
            AppState.chartDays = AppState.historicalDays = [];
            renderAgentTabs();
            populateDropdowns();
            if (el('analyticsContent')) el('analyticsContent').hidden = true;
            ['weeklyTable', 'monthlyTable'].forEach(id => { if (el(id)) el(id).innerHTML = ''; });
            el('empty').hidden = false;
            el('detail').hidden = true;
            updateTopStats({ totalAgents: 0, totalDrillRows: 0 });
            message(response?.message || I18N.t('emptyDataDesc'), true);
            return;
        }

        AppState.agents = response.agents;
        AppState.agentChartKey = ''; // إجبار إعادة بناء مخطط الوكلاء بعد تحميل بيانات جديدة
        if (response.historicalDays && Array.isArray(response.historicalDays) && response.historicalDays.length > 0) {
            AppState.historicalDays = response.historicalDays;
        }
        AppState.chartDays = AppState.historicalDays;

        // إزالة تبويبات الوكلاء الذين لم يعودوا موجودين (محذوفون/محظورون) وإعادة التبويب النشط لكل الوكلاء عند الحاجة
        AppState.agentTabs = (AppState.agentTabs || []).filter(t => AppState.agents.some(a => a.email === t.email));
        if (AppState.activeTabId !== 'all') {
            const activeEmail = AppState.activeTabId.startsWith('agent:') ? AppState.activeTabId.slice(6) : '';
            if (!AppState.agents.some(a => a.email === activeEmail)) {
                AppState.activeTabId = 'all';
                AppState.selectedAgent = '';
            }
        }

        el('empty').hidden = true;
        el('detail').hidden = false;

        updateTopStats(response.summary);
        populateDropdowns();
        renderResultsList();
        renderDetailView();

        message(I18N.t('dataLoadedSuccess', { count: AppState.agents.length }));

        // Auto-Setup لمرة واحدة للمستخدم الحالي إن كان وكيلاً (يعمل فقط بعد جهوزية الوكلاء/التبويبات)
        autoSetupForLoggedInAgentOnce();
        if (AppState.currentMainTab === 'stats') renderAnalyticsView();
        if (AppState.currentMainTab === 'weekly') loadPeriodTable('weekly');
        if (AppState.currentMainTab === 'monthly') loadPeriodTable('monthly');
    }

    /**
     * Auto-Setup لمرة واحدة عند التحميل: إذا كان المستخدم الحالي (هوية الخادم الموثّقة) وكيلاً موجودًا،
     * نفعّل تبويبه في جدول البيانات ونضبط Analytics & Charts على وكيل مفرد = نفسه.
     * يعيد استخدام نفس الدوال/الحالة الحالية، ولا يمنح أي صلاحية إضافية.
     */
    function autoSetupForLoggedInAgentOnce() {
        if (AppState._autoAgentSetupDone) return;
        AppState._autoAgentSetupDone = true; // مرة واحدة فقط لكل تحميل صفحة

        const email = String(AppState.currentUserEmail || '').trim().toLowerCase();
        if (!email) return;
        const agent = (AppState.agents || []).find(a => String(a.email || '').trim().toLowerCase() === email);
        if (!agent) return; // ليس وكيلاً → احتفظ بالسلوك الافتراضي كما هو

        // (1) جدول البيانات: افتح/فعّل تبويب الوكيل بنفس دالة الفتح اليدوية (بدون تكرار)
        openAgentTab(agent.email);

        // (2) Analytics & Charts: اختر وكيل مفرد = المستخدم عبر نفس المحدد ومحمّل البيانات الحاليين
        const sel = el('analyticsAgentSelect');
        if (sel) sel.value = agent.email;
        if (typeof renderAnalyticsView === 'function') renderAnalyticsView();
    }

    function populateDropdowns() {
        const agentSel = el('agent');

        if (!agentSel) return;

        const currentVal = agentSel.value;
        const currentAnalytics = analyticsSel ? analyticsSel.value : '';
        agentSel.innerHTML = `<option value="">${I18N.t('sidebarAllAgentsOption')}</option>`;
        if (analyticsSel) analyticsSel.innerHTML = `<option value="">${I18N.t('analyticsAllAgentsOption')}</option>`;

        AppState.agents.forEach(a => {
            const opt = new Option(`${a.name} (${a.email})`, a.email);
            agentSel.add(opt);
            if (analyticsSel) analyticsSel.add(new Option(`${a.name} (${a.email})`, a.email));

        if (analyticsSel && AppState.agents.some(a => a.email === currentAnalytics)) analyticsSel.value = currentAnalytics;

            agentSel.value = currentVal;
