            const badPct = 100 - goodPct;
            const agentPct = evalAgents > 0 ? Math.round((targetAgents / evalAgents) * 100) : 0;

            let ratioLabelsHtml = '';
            if (evalCsat > 0) {
                const goodHtml = totalGood > 0 || totalBad === 0
                    ? `<span style="color:var(--ok); font-weight:600;">${I18N.t('satisfiedLabel')}: ${totalGood} (${goodPct}%)</span>`
                    : '';
                const badHtml = totalBad > 0
                    ? `<span style="color:var(--bad); font-weight:600;">${I18N.t('unsatisfiedLabel')}: ${totalBad} (${badPct}%)</span>`
                    : '';
                ratioLabelsHtml = `
                    <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:6px;">
                        ${goodHtml}
                        ${badHtml}
                    </div>
                `;
            }

            csatBox.innerHTML = `
                <div class="csat-ratio-strip" style="margin-bottom:14px;">
                    ${ratioLabelsHtml}
                    <div class="csat-ratio-bar" style="height:10px; border-radius:6px; background:rgba(var(--ink-rgb), 0.1); overflow:hidden; display:flex;">
                        <div style="width:${goodPct}%; background:#10b981; transition:width 0.4s ease;"></div>
                        <div style="width:${badPct}%; background:#ef4444; transition:width 0.4s ease;"></div>
                    </div>
                </div>
                <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:12px;">
                    <span>${I18N.t('csatDistributionSub')}</span>
                    <strong style="color:#10b981;">${agentPct}% (${targetAgents} / ${evalAgents})</strong>
                </div>
                <div class="kpi-bar-track" style="margin-bottom:12px;"><div class="kpi-bar-fill emerald" style="width:${agentPct}%;"></div></div>
                <div style="font-size:11.5px; color:var(--muted); line-height:1.6;">
                    ${I18N.t('csatNote')}
                </div>
            `;
        }

        // 6. ترتيب أداء الوكلاء (عرض كل الوكلاء + مفاضلة السيسات + تتبع الرتبة اليومية)
        const rankList = el('agentsCompareList');
        if (rankList) {
            rankList.innerHTML = '';
            // الفرز الأساسي: نسبة CSAT تنازلياً، وعند التساوي يُفاضل بعدد السيسات/التقييمات ثم إجمالي السيشنات
            const sortedAgents = [...AppState.agents].sort((a, b) => {
                const csatA = Number(a.csat) || 0;
                const csatB = Number(b.csat) || 0;
                if (csatB !== csatA) return csatB - csatA;
                const totalA = Number(a.csatTotal) || 0;
                const totalB = Number(b.csatTotal) || 0;
                if (totalB !== totalA) return totalB - totalA;
                const sessA = Number(a.sessions) || 0;
                const sessB = Number(b.sessions) || 0;
                return sessB - sessA;
            });

            // قراءة ومقارنة الترتيب اليومي (Daily Rank Tracking)
            const storageKey = 'gas_agent_ranks_' + (AppState.selectedMonth || 'current');
            let savedRanks = {};
            try {
                const raw = localStorage.getItem(storageKey);
                if (raw) savedRanks = JSON.parse(raw);
            } catch (e) {}

            const currentRanksToSave = {};

            sortedAgents.forEach((a, idx) => {
                const currentRank = idx + 1;
                const emailKey = (a.email || '').toLowerCase();
                if (emailKey) currentRanksToSave[emailKey] = currentRank;

                const isCurrentAgent = isSingleAgent && emailKey === selectedAgentEmail;

                // فحص ما إذا كان هناك وكيل ملاصق له نفس نسبة CSAT للمفاضلة
                const prevAgent = idx > 0 ? sortedAgents[idx - 1] : null;
                const nextAgent = idx < sortedAgents.length - 1 ? sortedAgents[idx + 1] : null;
                const hasSameCsatAsNeighbor = (prevAgent && (Number(prevAgent.csat) || 0) === (Number(a.csat) || 0)) ||
                                              (nextAgent && (Number(nextAgent.csat) || 0) === (Number(a.csat) || 0));

                // حساب تغير الرتبة اليومي (+ أخضر، - أحمر، 0 محايد)
                let rankChange = (a.rankChange !== undefined && a.rankChange !== null) ? a.rankChange : null;
                if (rankChange === null && savedRanks[emailKey] !== undefined) {
                    const prevR = Number(savedRanks[emailKey]);
                    if (!isNaN(prevR) && prevR > 0) {
                        rankChange = prevR - currentRank;
                    }
                }

                let rankChangeHtml = '';
                if (rankChange !== null) {
                    if (rankChange > 0) {
                        rankChangeHtml = `<span class="rank-change positive" title="${I18N.t('rankUp', { n: rankChange })}">▲ +${rankChange}</span>`;
                    } else if (rankChange < 0) {
                        rankChangeHtml = `<span class="rank-change negative" title="${I18N.t('rankDown', { n: Math.abs(rankChange) })}">▼ ${rankChange}</span>`;
                    } else {
                        rankChangeHtml = `<span class="rank-change neutral" title="${I18N.t('rankSame')}">—</span>`;
                    }
                } else {
                    rankChangeHtml = `<span class="rank-change new-tag" title="${I18N.t('rankNew')}">⭐ NEW</span>`;
                }

                // وسام الرتبة (ذهب للمركز الأول، فضة للثاني، برونز للثالث)
                let rankBadgeHtml = '';
                if (currentRank === 1) {
                    rankBadgeHtml = `<span class="badge rank-badge rank-gold" title="المركز الأول 🥇">🥇 #1</span>`;
                } else if (currentRank === 2) {
                    rankBadgeHtml = `<span class="badge rank-badge rank-silver" title="المركز الثاني 🥈">🥈 #2</span>`;
                } else if (currentRank === 3) {
                    rankBadgeHtml = `<span class="badge rank-badge rank-bronze" title="المركز الثالث 🥉">🥉 #3</span>`;
                } else {
                    rankBadgeHtml = `<span class="badge rank-badge">#${currentRank}</span>`;
                }

                const item = document.createElement('div');
                item.className = 'rank-item' + (isCurrentAgent ? ' current-active-agent' : '');
                item.setAttribute('data-email', escapeHtml(a.email || ''));
                item.style.cursor = 'pointer';
                item.innerHTML = `
                    <div style="display:flex; align-items:center; gap:10px; flex:1; min-width:0;">
                        <div style="display:flex; flex-direction:column; align-items:center; gap:2px; min-width:44px;">
                            ${rankBadgeHtml}
                            ${rankChangeHtml}
                        </div>
                        <div style="min-width:0; overflow:hidden;">
                            <strong style="color:#fff; display:block; font-size:13px; text-overflow:ellipsis; overflow:hidden; white-space:nowrap;">
                                ${escapeHtml(a.name)} ${isCurrentAgent ? '⭐' : ''}
                            </strong>
                            <span style="color:var(--muted); font-size:11px; display:block; text-overflow:ellipsis; overflow:hidden; white-space:nowrap;">
                                ${escapeHtml(a.email)}
                            </span>
                        </div>
                    </div>
                    <div style="text-align:end; display:flex; flex-direction:column; align-items:flex-end; gap:3px;">
                        ${(() => {
                            let badgeClass = 'badge subtle';
                            if (!isBlank(a.csat)) {
                                const c = Number(a.csat);
                                if (c >= 90) badgeClass = 'badge-success';
                                else if (c >= 75) badgeClass = 'badge-warning';
                                else badgeClass = 'badge-danger';
                            }
                            return `<span class="badge ${badgeClass}" style="font-weight:700; font-size:12px;">${isBlank(a.csat) ? '—' : a.csat + '% CSAT'}</span>`;
                        })()}
                        <span style="color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums;">
                            ${(() => {
                                const count = (a.csatTotal !== undefined && a.csatTotal !== null && a.csatTotal !== '')
                                    ? Number(a.csatTotal)
                                    : (((Number(a.csatGood) || 0) + (Number(a.csatBad) || 0)) || Number(a.csatCount) || 0);
                                const badCount = (a.csatBad !== undefined && a.csatBad !== null)
                                    ? Number(a.csatBad)
                                    : (count > 0 && !isBlank(a.csat) ? Math.max(0, count - Math.round(count * (Number(a.csat) / 100))) : 0);
                                const dsatHtml = badCount > 0
                                    ? ` · <span style="color:var(--danger); font-weight:600;">${badCount} DSAT</span>`
                                    : ` · <span style="opacity:0.7;">0 DSAT</span>`;
                                return `${count} ${I18N.t('unitCsats')}${dsatHtml}`;
                            })()}
                        </span>
                    </div>
                `;
                item.addEventListener('click', () => {
                    selectAgent(a.email);
                });
                rankList.appendChild(item);
            });

            // حفظ ترتيب اليوم في التخزين المحلي لاستخدامه كمرجع عند التحديث القادم
            try {
                localStorage.setItem(storageKey, JSON.stringify(currentRanksToSave));
            } catch (e) {}
        }
    }

    /**
     * الشريط الثانوي + المخطط البياني (يستخدم بيانات الوكيل المفرد عند اختياره، أو بيانات الفريق)
     */
    function renderAnalyticsQuickStripAndChart() {
        // 3. الشريط الثانوي (Secondary Quick Stats Strip)
        const sourceDays = AppState.analyticsLoading
            ? []
            : (Array.isArray(AppState.chartDays) && AppState.chartDays.length > 0 ? AppState.chartDays : AppState.historicalDays);
        const histDays = Array.isArray(sourceDays)
            ? sourceDays.filter(d => Number(d.sessions) > 0 || Number(d.csat) > 0 || Number(d.abstSecs) > 0 || Number(d.agbtSecs) > 0 || Number(d.long) > 0)
            : [];
        const totalSessions = histDays.reduce((s, d) => s + (Number(d.sessions) || 0), 0);
        const totalLongSessions = histDays.reduce((s, d) => s + (Number(d.long) || 0), 0);
        const activeDays = histDays.length;
        const dailyAvg = activeDays > 0 ? Math.round((totalSessions / activeDays) * 10) / 10 : 0;

        if (AppState.analyticsLoading) {
            if (el('secStatTotalSessions')) el('secStatTotalSessions').textContent = '…';
            if (el('secStatDailyAvg')) el('secStatDailyAvg').textContent = '…';
            if (el('secStatActiveDays')) el('secStatActiveDays').textContent = '…';
            if (el('secStatLongSessions')) el('secStatLongSessions').textContent = '…';
        } else {
            if (el('secStatTotalSessions')) el('secStatTotalSessions').textContent = `${totalSessions} ${I18N.t('unitSessions')}`;
            if (el('secStatDailyAvg')) el('secStatDailyAvg').textContent = `${dailyAvg} ${I18N.t('unitDailyAvg')}`;
            if (el('secStatActiveDays')) el('secStatActiveDays').textContent = `${activeDays} ${I18N.t('unitDays')}`;
            if (el('secStatLongSessions')) el('secStatLongSessions').textContent = `${totalLongSessions} ${I18N.t('unitSessions')}`;
        }

        // 4. رسم المخطط البياني التفاعلي SVG
        renderSvgChart();
    }

    /**
     * جلب الخط الزمني اليومي لوكيل واحد فقط من الملفات المفصولة في Google Drive.
     */
    function loadSingleAgentAnalytics(email) {
        if (AppState.sheetLoading) return;
        const key = JSON.stringify([email, AppState.selectedMonth || '', !!AppState.chartByShift]);
        if (AppState.analyticsLoadKey === key && (AppState.analyticsLoading ||
            (!AppState.analyticsError && Date.now() - AppState.analyticsLoadedAt < DashboardReads.ttl))) return;
        AppState.analyticsLoadKey = key;
        AppState.analyticsError = '';
        AppState.analyticsLoading = true;
        AppState.chartDays = [];
        AppState.shiftConfigNeeded = false;
        const requestId = ++AppState.analyticsRequestId;

        renderAnalyticsQuickStripAndChart();

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            dashboardReadRunner_()
                .withSuccessHandler((res) => {
                    if (requestId !== AppState.analyticsRequestId) return;
                    AppState.analyticsLoading = false;
                    AppState.analyticsLoadedAt = Date.now();
                    AppState.shiftConfigNeeded = false;
                    AppState.chartDays = (res && res.success && Array.isArray(res.days)) ? res.days : [];
                    AppState.chartShiftWindow = (res && res.shift) ? res.shift : null;
                    // Temporary diagnostics (aggregate only) — للمعايرة لاحقًا على بيانات الإنتاج.
                    if (res && Array.isArray(res.shiftDiagnostics)) {
                        AppState.shiftDiagnostics = res.shiftDiagnostics;
                        try { console.log('SHIFT_INFERENCE_DIAG', res.shiftDiagnostics); } catch (e) {}
                    }
                    renderAnalyticsQuickStripAndChart();
                    refreshAgentSummaryBar_();
                })
                .withFailureHandler(err => {
                    if (requestId !== AppState.analyticsRequestId) return;
                    AppState.analyticsLoading = false;
                    AppState.analyticsError = loadErrorText_(err);
                    AppState.chartDays = [];
                    renderAnalyticsQuickStripAndChart();
                })
                .getAgentDailyTimeline(email, AppState.chartByShift, null, null, AppState.selectedMonth || '');
        } else {
            // وضع المعاينة المحلي: نحسب الأيام الحقيقية لهذا الوكيل من البيانات المحفوظة (بدون اختلاق بيانات)
            AppState.analyticsLoading = false;
            AppState.analyticsLoadedAt = Date.now();
            let local = computeAgentDaysLocally(email, AppState.chartByShift);
            if ((!local || (Array.isArray(local) && local.length === 0)) && typeof window !== 'undefined' && typeof window.__LOCAL_PREVIEW_GET_AGENT_TIMELINE__ === 'function') {
                local = window.__LOCAL_PREVIEW_GET_AGENT_TIMELINE__(email, AppState.selectedMonth);
            }
            AppState.shiftConfigNeeded = false;
            AppState.chartDays = Array.isArray(local) ? local : (local && local.days) || [];
            AppState.chartShiftWindow = (local && local.shift) ? local.shift : null;
            if (local && Array.isArray(local.diagnostics)) AppState.shiftDiagnostics = local.diagnostics;
            renderAnalyticsQuickStripAndChart();
            refreshAgentSummaryBar_();
        }
    }

    // ملاحظة: أُزيلت واجهة إعداد الشفت اليدوي — الاستنتاج تلقائي من بيانات الوكيل.

    /**
     * حساب الأيام اليومية لوكيل واحد من البيانات المحفوظة محلياً (وضع المعاينة فقط).
     * - By Day: تجميع تقويمي كما هو.
     * - By Shift: استنتاج عناقيد النشاط (نفس منهج الخادم: Otsu على الفجوات) — لا إعداد يدوي.
     * يعيد مصفوفة فارغة إذا لم توجد بيانات، ولا يختلق أرقاماً من عندنا.
     */
    function computeAgentDaysLocally(email, byShift) {
        const dailyMap = {};
        const shiftTsList = [];
        function entryFor(day) {
            if (!dailyMap[day]) {
                dailyMap[day] = {
                    day,
                    displayDay: day.slice(5),
                    sessions: 0,
                    abstTotalSecs: 0,
                    abstCount: 0,
                    agbtTotalSecs: 0,
                    agbtCount: 0,
                    csatGood: 0,
                    csatBad: 0,
                    long: 0,
                    breakBreaches: 0,
                    breakExceedMins: 0,
                    latenessIncidents: 0,
                    latenessMins: 0,
                    idleHours: 0
                };
            }
            return dailyMap[day];
        }

        function parseLocalTs(value) {
            const s = String(value == null ? '' : value).trim();
            if (!s) return null;
            const m = s.match(/\b(\d{4})[-/](\d{1,2})[-/](\d{1,2})(?:[T ](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
            if (!m) return null;
            const y = +m[1], mo = +m[2], d = +m[3], hh = +(m[4] || 0), mi = +(m[5] || 0), ss = +(m[6] || 0);
            if (!(y > 2000) || mo < 1 || mo > 12 || d < 1 || d > 31) return null;
            return {
                date: y + '-' + String(mo).padStart(2, '0') + '-' + String(d).padStart(2, '0'),
                hour: hh, minute: mi, second: ss
            };
        }

        // تحويل دبي (UTC+4) → الرياض (UTC+3) عبر Intl بدل الطرح الثابت
        function dubaiTsToRiyadh(value) {
            const p = parseLocalTs(value);
            if (!p) return null;
            if (typeof Intl === 'undefined' || !Intl.DateTimeFormat) return p;
            try {
                const utcMs = Date.UTC(
                    +p.date.slice(0, 4), +p.date.slice(5, 7) - 1, +p.date.slice(8, 10),
                    p.hour, p.minute || 0, p.second || 0
                ) - 4 * 3600 * 1000;
                const parts = new Intl.DateTimeFormat('en-CA', {
                    timeZone: 'Asia/Riyadh', year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
                }).formatToParts(new Date(utcMs));
                const map = {};
                parts.forEach(pt => { map[pt.type] = pt.value; });
                return {
                    date: map.year + '-' + map.month + '-' + map.day,
                    hour: (parseInt(map.hour, 10) % 24),
                    minute: parseInt(map.minute, 10) || 0,
                    second: parseInt(map.second, 10) || 0
                };
            } catch (e) { return p; }
        }

        function shiftTsForRow(row, header) {
            const h = header.map(c => String(c).toLowerCase().trim());
            const dubaiNames = ['created_at_dubai', 'date_resolved_dubai', 'csat_submitted_at_dubai', 'ticket_creation_date_dubai', 'call_start_date_dubai'];
            for (const name of dubaiNames) {
                const idx = findHeaderCol(h, name);
                if (idx !== -1 && row[idx]) {
                    const r = dubaiTsToRiyadh(row[idx]);
                    if (r) return r;
                }
            }
            for (let i = 0; i < h.length; i++) {
                if (h[i].indexOf('_dubai') !== -1 && row[i]) {
                    const r = dubaiTsToRiyadh(row[i]);
                    if (r) return r;
                }
            }
            // أي عمود تاريخ/وقت آخر يُعامل كتوقيت الرياض المحلي
            const tsCol = h.findIndex(c => c === 'day' || c === 'report_dt' || c.includes('date') || c.includes('shift_date') || c.endsWith('_at') || c.includes('start'));
            if (tsCol !== -1 && row[tsCol]) return parseLocalTs(row[tsCol]);
            return null;
        }

        function dayFromRow(row, header) {
            const h = header.map(c => String(c).toLowerCase().trim());
            const dIdx = h.findIndex(c => c === 'day' || c === 'report_dt' || c.includes('date') || c.includes('shift_date'));
            if (dIdx === -1 || !row[dIdx]) return null;
            const m = String(row[dIdx]).match(/\b\d{4}-\d{2}-\d{2}\b/);
            return m ? m[0] : null;
        }

        function inferWindow() {
            if (shiftTsList.length < 12) return null;
            const hist = new Array(24).fill(0);
            let total = 0;
            shiftTsList.forEach(t => {
                if (t && t.hour >= 0 && t.hour < 24) { hist[t.hour]++; total++; }
            });
            if (total < 12) return null;
            const maxCount = Math.max.apply(null, hist);
            if (maxCount <= 0) return null;
            const threshold = Math.max(1, Math.floor(maxCount * 0.05));
            let bestLen = 0, bestStart = 0, len = 0, runStart = 0;
            for (let k = 0; k < 48; k++) {
                const hour = k % 24;
                if (hist[hour] <= threshold) {
                    if (len === 0) runStart = k;
                    len++;
                    if (len > bestLen && len <= 24) { bestLen = len; bestStart = runStart; }
                } else { len = 0; }
            }
            if (bestLen < 4 || bestLen >= 24) return null;
            let activeCount = 0;
            for (let i = 0; i < 24; i++) if (hist[i] > threshold) activeCount += hist[i];
            if (total <= 0 || (activeCount / total) < 0.75) return null;
            return { startHour: (bestStart + bestLen) % 24, endHour: bestStart % 24, inferred: true };
        }

        function shiftDayFromTs(t, window) {
            if (!t) return null;
            const startHour = (window && typeof window.startHour === 'number') ? window.startHour : 0;
            const d = new Date(+t.date.slice(0, 4), +t.date.slice(5, 7) - 1, +t.date.slice(8, 10));
            if (startHour > 0 && t.hour < startHour) d.setDate(d.getDate() - 1);
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        function timeToSecs(v) {
            const s = String(v || '').trim();
            if (s.includes(':')) {
                const p = s.split(':');
                return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0);
            }
            const n = parseFloat(s);
            return isNaN(n) ? 0 : n * 60;
        }

        function _epochFromTsObj(t) {
            if (!t) return NaN;
            return Date.UTC(+t.date.slice(0, 4), +t.date.slice(5, 7) - 1, +t.date.slice(8, 10), t.hour || 0, t.minute || 0, t.second || 0) - 3 * 3600 * 1000;
        }
        function _dateFromEpoch(ms) {
            const d = new Date(ms + 3 * 3600 * 1000);
            return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
        }
        function _otsuLocal(values) {
            if (!values || values.length < 2) return { t: null };
            const xs = values.map(v => Math.log1p(Math.max(0, Number(v) || 0)));
            let min = Infinity, max = -Infinity;
            xs.forEach(x => { if (x < min) min = x; if (x > max) max = x; });
            if (!(max > min)) return { t: null };
            const bins = 32, hist = new Array(bins).fill(0);
            xs.forEach(x => { let b = Math.floor(((x - min) / (max - min)) * bins); if (b >= bins) b = bins - 1; if (b < 0) b = 0; hist[b]++; });
            const total = xs.length;
            let sumAll = 0; for (let i = 0; i < bins; i++) sumAll += i * hist[i];
            let sumB = 0, wB = 0, best = -1, bestT = -1;
            for (let i = 0; i < bins; i++) {
                wB += hist[i]; if (!wB) continue;
                const wF = total - wB; if (!wF) break;
                sumB += i * hist[i];
                const mB = sumB / wB, mF = (sumAll - sumB) / wF;
                const between = wB * wF * (mB - mF) * (mB - mF);
                if (between > best) { best = between; bestT = i; }
            }
            if (bestT < 0) return { t: null };
            return { t: Math.expm1(min + ((bestT + 1) / bins) * (max - min)) };
        }
        // نفس منهج الخادم: عناقيد نشاط بحدود مُشتقة من الفجوات (Otsu) — بلا عتبة ثابتة.
        function inferShiftDayMapLocal(recs) {
            const events = [];
            recs.forEach((rec, recIdx) => {
                const h = rec.header.map(c => String(c).toLowerCase().trim());
                const aIdx = h.findIndex(c => c === 'abst' || c.includes('basket_session_time') || c.includes('session_time') || c === 'agbt' || c.includes('basket_time'));
                rec.rows.forEach((row, rowIdx) => {
                    const t = shiftTsForRow(row, rec.header);
                    const epoch = _epochFromTsObj(t);
                    if (!isFinite(epoch)) return;
                    let endEpoch = epoch;
                    if (rec.metric === 'abst' && aIdx !== -1) {
                        const mins = timeToSecs(row[aIdx]) / 60;
                        if (mins > 0 && mins <= 24 * 60) endEpoch = epoch + mins * 60000;
                    }
                    events.push({ epoch, endEpoch, key: recIdx + ':' + rowIdx });
                });
            });
            events.sort((a, b) => a.epoch - b.epoch);
            const map = {};
            if (events.length < 2) return { map: map, uncertain: true };
            const gaps = [];
            for (let i = 0; i < events.length - 1; i++) {
                const fe = Math.max(events[i].epoch, events[i].endEpoch);
                gaps.push((events[i + 1].epoch - fe) / 60000);
            }
            const positive = gaps.filter(g => g > 0);
            if (positive.length === 0) {
                const sd = _dateFromEpoch(events[0].epoch);
                events.forEach(e => { map[e.key] = sd; });
                return { map: map, uncertain: false };
            }
            let t = null, separated = false;
            if (positive.length >= 2) {
                const o = _otsuLocal(positive);
                t = o.t;
                if (t !== null) {
                    const within = positive.filter(g => g < t), between = positive.filter(g => g >= t);
                    const maxWithin = within.length ? Math.max.apply(null, within) : 0;
                    const minBetween = between.length ? Math.min.apply(null, between) : Infinity;
                    separated = between.length > 0 && isFinite(minBetween) && (within.length === 0 || minBetween > maxWithin * 1.5);
                }
            } else if (positive.length === 1) {
                const zeroCount = gaps.filter(g => g <= 0).length;
                if (zeroCount >= 1) { t = positive[0]; separated = true; }
            }
            if (!(t !== null && separated)) return { map: map, uncertain: true };
            let cluster = [events[0]];
            for (let i = 1; i < events.length; i++) {
                if (gaps[i - 1] >= t) { const sd = _dateFromEpoch(cluster[0].epoch); cluster.forEach(e => { map[e.key] = sd; }); cluster = [events[i]]; }
                else cluster.push(events[i]);
            }
            { const sd = _dateFromEpoch(cluster[0].epoch); cluster.forEach(e => { map[e.key] = sd; }); }
            return { map: map, uncertain: false };
        }

        try {
            const rawJson = getStoredRawJson();
            if (!rawJson) return byShift ? { days: [], shift: null } : [];
            const parsed = JSON.parse(rawJson.replace(/^\uFEFF/, ''));
            const rawResults = parsed.results || (Array.isArray(parsed) && parsed[0]?.metric ? parsed : (parsed.header ? [parsed] : []));
            const target = String(email || '').toLowerCase().trim();

            // المرحلة 1: جمع صفوف الوكيل فقط
            const matched = [];
            (Array.isArray(rawResults) ? rawResults : []).forEach(r => {
                const rAgent = String(r.agent || '').toLowerCase().trim();
                if (rAgent !== target && !target.includes(rAgent) && !rAgent.includes(target.split('@')[0])) return;
                matched.push({
                    metric: String(r.metric || '').toLowerCase().trim(),
                    header: Array.isArray(r.header) ? r.header : [],
                    rows: Array.isArray(r.rows) ? r.rows : []
                });
            });

            // المرحلة 2: استنتاج عناقيد الشفت من نشاط الوكيل (بياناتي، بلا إعداد يدوي)
            let shiftDayMap = null;
            let shiftUncertain = false;
            if (byShift) {
                const inf = inferShiftDayMapLocal(matched);
                shiftDayMap = inf.map;
                shiftUncertain = inf.uncertain;
            }

            // المرحلة 3: التجميع حسب اليوم أو حسب تاريخ بداية الشفت المُستنتَج
            matched.forEach((rec, recIdx) => {
                const metric = rec.metric;
                const header = rec.header;
                const h = header.map(c => String(c).toLowerCase().trim());
                const cIdx = h.findIndex(c => c.includes('csat_adjusted') || c === 'csat' || c.includes('score'));
                const aIdx = h.findIndex(c => c === 'abst' || c.includes('basket_session_time') || c.includes('session_time') || c === 'agbt' || c.includes('basket_time'));
                const breakMetIdx = findHeaderCol(h, 'break exceed', 'break_exceed', 'status');
                const breakExceedIdx = findHeaderCol(h, 'break exceed time', 'exceed_time', 'exceed_mins', 'exceed');
                const lateIdx = findHeaderCol(h, 'exceed mins', 'exceed_mins', 'lateness', 'late_mins', 'delay_mins', 'delay');
                const idleIdx = h.findIndex(c => c.indexOf('idle') !== -1 || c.indexOf('not_working') !== -1);

                rec.rows.forEach((row, rowIdx) => {
                    const day = byShift
                        ? (shiftDayMap[recIdx + ':' + rowIdx] || dayFromRow(row, header))
                        : dayFromRow(row, header);
                    if (!day) return;
                    const e = entryFor(day);
                    e.sessions++;

                    if (metric === 'abst' || metric === 'agbt') {
                        if (aIdx !== -1) {
                            const secs = timeToSecs(row[aIdx]);
                            if (metric === 'abst') { e.abstTotalSecs += secs; e.abstCount++; }
                            else { e.agbtTotalSecs += secs; e.agbtCount++; }
                        }
                        if (metric === 'abst') {
                            const rawSecs = timeToSecs(row[aIdx]);
                            if (rawSecs >= 20 * 60) e.long++;
                        }
                    } else if (metric === 'csat') {
                        const val = cIdx !== -1 ? String(row[cIdx] || '').toLowerCase().trim() : '';
                        if (val === 'good' || val === '5' || val === '4' || val === 'positive' || val.includes('ممتاز') || val.includes('جيد')) e.csatGood++;
                        else if (val === 'bad' || val === '1' || val === '2' || val === 'negative' || val.includes('سيء')) e.csatBad++;
                    } else if (metric === 'breakbreach' || metric === 'break') {
                        let breached = false;
                        if (breakMetIdx !== -1) {
                            const v = String(row[breakMetIdx] || '').toLowerCase().trim();
                            if (v === 'not met' || v === 'breached' || v.includes('breach')) breached = true;
                        }
                        let exceedM = 0;
                        if (breakExceedIdx !== -1) {
                            const v = parseFloat(row[breakExceedIdx]);
                            if (!isNaN(v) && v > 0) { exceedM = v; breached = true; }
                        }
                        if (breached) e.breakBreaches++;
                        e.breakExceedMins += exceedM;
                    } else if (metric === 'lateness' || metric === 'late') {
                        if (lateIdx !== -1) {
                            const v = parseFloat(row[lateIdx]);
                            if (!isNaN(v) && v > 0) {
                                e.latenessIncidents++;
                                e.latenessMins += v;
                            }
                        }
                    } else if (metric === 'idle') {
                        if (idleIdx !== -1) {
                            const v = parseFloat(row[idleIdx]);
                            if (!isNaN(v) && v > 0) {
                                e.idleHours += v;
                            }
                        }
                    }
                });
            });

            const days = Object.keys(dailyMap).sort().map(d => {
                const e = dailyMap[d];
                const csatEval = e.csatGood + e.csatBad;
                return {
                    day: d,
                    displayDay: e.displayDay,
                    sessions: e.sessions,
                    abstSecs: e.abstCount > 0 ? Math.round(e.abstTotalSecs / e.abstCount) : 0,
                    agbtSecs: e.agbtCount > 0 ? Math.round(e.agbtTotalSecs / e.agbtCount) : 0,
                    csat: csatEval > 0 ? Math.round((e.csatGood / csatEval) * 100) : 0,
                    csatGood: e.csatGood || 0,
                    csatBad: e.csatBad || 0,
                    csatTotal: csatEval,
                    long: e.long,
                    breakBreaches: e.breakBreaches || 0,
                    breakExceedMins: Math.round((e.breakExceedMins || 0) * 10) / 10,
                    latenessIncidents: e.latenessIncidents || 0,
                    latenessMins: Math.round((e.latenessMins || 0) * 10) / 10,
                    idleHours: Math.round((e.idleHours || 0) * 10) / 10
                };
            });

            return byShift ? { days: days, shift: { inferred: true, uncertain: shiftUncertain } } : days;
        } catch (e) {
            return byShift ? { days: [], shift: null } : [];
        }
    }

    /**
     * رسم المخطط البياني التفاعلي SVG المعتمد: منحنيات ناعمة (Smooth Curves) للمقاييس وأعمدة للسيشنات
     */
    // ============ وضع المقارنة حسب الوكيل (Group By Agent) ============
    // نطاق التاريخ الحالي للرسم (نفس دلالات فلتر الأيام)
    function getChartRangeBounds() {
        const preset = AppState.chartDatePreset || 'all';
        const toIso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        if (preset === 'all') return { start: '', end: '' };
        if (preset === 'custom') return { start: AppState.chartStartDate || '', end: AppState.chartEndDate || '' };
        const now = new Date();
        if (preset === 'recent') { const s = new Date(); s.setDate(s.getDate() - 13); return { start: toIso(s), end: toIso(now) }; }
        if (preset === 'week') { const dow = (now.getDay() + 6) % 7; const mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dow); return { start: toIso(mon), end: toIso(now) }; }
        if (preset === 'month') { const ms = new Date(now.getFullYear(), now.getMonth(), 1); return { start: toIso(ms), end: toIso(now) }; }
        return { start: '', end: '' };
    }

    function agentChartKeyNow() {
        const range = getChartRangeBounds();
        return (AppState.agentChartMetric || 'abst') + '|' + (AppState.selectedMonth || '') + '|' + range.start + '|' + range.end;
    }

    function ensureAgentsChartData() {
        if (AppState.sheetLoading) return;
        const key = agentChartKeyNow();
        if (AppState.agentChartPendingKey === key && AppState.agentChartLoading) return;
        if (AppState.agentChartKey === key && (AppState.agentChartError ||
            (AppState.agentChartData && Date.now() - AppState.agentChartLoadedAt < DashboardReads.ttl)) && !AppState.agentChartLoading) {
            renderAgentBarChart();
            return;
        }
        loadAgentsChartData();
    }

    function loadAgentsChartData() {
        const metric = AppState.agentChartMetric || 'abst';
        const range = getChartRangeBounds();
        const key = agentChartKeyNow();
        const reqId = ++AppState.agentChartRequestId;
        AppState.agentChartLoading = true;
        AppState.agentChartPendingKey = key;
        AppState.agentChartError = '';
        AppState.agentChartKey = '';
        renderAgentBarChart();

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            dashboardReadRunner_()
                .withSuccessHandler(res => {
                    if (reqId !== AppState.agentChartRequestId) return;
                    AppState.agentChartLoading = false;
                    AppState.agentChartPendingKey = '';
                    AppState.agentChartLoadedAt = Date.now();
                    AppState.agentChartData = (res && res.success && Array.isArray(res.agents)) ? res : { success: true, metric: metric, agents: [] };
                    AppState.agentChartKey = key;
                    renderAgentBarChart();
                })
                .withFailureHandler(err => {
                    if (reqId !== AppState.agentChartRequestId) return;
                    AppState.agentChartLoading = false;
                    AppState.agentChartPendingKey = '';
                    AppState.agentChartError = loadErrorText_(err);
                    AppState.agentChartData = null;
                    AppState.agentChartKey = key;
                    renderAgentBarChart();
                })
                .getAgentsChartData(metric, range.start, range.end, AppState.selectedMonth || '');
        } else {
            AppState.agentChartLoading = false;
            AppState.agentChartLoadedAt = Date.now();
            AppState.agentChartPendingKey = '';
            AppState.agentChartData = { success: true, metric: metric, agents: computeAgentsChartLocally(metric) };
            AppState.agentChartKey = key;
            renderAgentBarChart();
        }
    }

    // وضع المعاينة فقط: استخدام حقول ملخص الوكلاء المحلي كما هي (بدون إعادة حساب)
    function computeAgentsChartLocally(metric) {
        const agents = Array.isArray(AppState.agents) ? AppState.agents : [];
        return agents.map(a => {
            let v = null;
            if (metric === 'csat') v = Number(a.csat);
            else if (metric === 'agbt') v = parseDurationValueToMinutes(a.agbt);
            else if (metric === 'abst') v = parseDurationValueToMinutes(a.abst);
            else if (metric === 'idle') v = hoursValueToMinutes(a.idle) / 60;
            else if (metric === 'lateness') v = Number(a.lateness);
            else if (metric === 'breakBreach') v = Number(a.breakExceedMins);
            if (v === null || isNaN(v)) v = null;
            const entry = { email: a.email, name: a.name || a.email, value: v };
            if (metric === 'breakBreach') entry.breaches = parseInt(a.breakBreach, 10) || 0;
            return entry;
        });
    }

    // يعرض قيمة المقياس عبر الـGlobal Formatter نفسه (لا Formatter منفصل)
    function formatAgentMetricValue(metric, value) {
        if (value === null || value === undefined || isNaN(Number(value))) return '—';
        if (metric === 'csat') return `${value}%`;
        if (metric === 'breakBreach') return breachExceedText(value); // الأساسي: دقائق التجاوز
        if (metric === 'idle') return fmtHours(value);
        return fmtMinutes(value); // agbt / abst / lateness
    }

    function renderAgentBarChart() {
        const wrap = el('analyticsChartWrap');
        if (wrap && AppState.agentChartError && !AppState.agentChartLoading) {
            wrap.innerHTML = '<p role="alert" style="padding:28px;color:var(--danger)">' + escapeHtml(AppState.agentChartError) + '</p>';
            if (el('chartBenchmarkVal')) el('chartBenchmarkVal').textContent = '—';
            return;
        }
        const badge = el('chartActiveDaysCountBadge');
        if (!wrap) return;
        wrap.style.overflowX = '';

        const isArabic = I18N.currentLang === 'ar';
        const metric = AppState.agentChartMetric || 'abst';
        const meta = chartMetricMeta_(metric, isArabic);

        // نفس هيكل/عنوان By Day — يتغيّر المحتوى حسب المقياس فقط
        renderChartMetricTabs();
        if (el('chartSubtitle')) el('chartSubtitle').textContent = I18N.t('chartAgentSubtitle');
        if (el('chartLegendText')) el('chartLegendText').textContent = meta.legend;
        if (el('chartBadgeDot')) el('chartBadgeDot').style.background = meta.color;

        // By Agent = أعمدة فقط (نفس أزرار وضع العرض الموجودة في By Day)
        if (el('btnChartModeBar')) el('btnChartModeBar').classList.add('active');
        if (el('btnChartModeLine')) {
            el('btnChartModeLine').classList.remove('active');
            el('btnChartModeLine').disabled = true;
            el('btnChartModeLine').style.opacity = '0.45';
            el('btnChartModeLine').style.cursor = 'not-allowed';
        }

        if (AppState.agentChartLoading) {
            wrap.innerHTML = `<div style="text-align:center; padding:55px 20px; color:var(--muted); font-size:13px; line-height:1.7;"><span style="font-size:26px; display:block; margin-bottom:8px;">⏳</span>${I18N.currentLang === 'ar' ? 'جاري تحميل بيانات الوكلاء…' : 'Loading agents data…'}</div>`;
            if (badge) badge.textContent = '…';
            if (el('chartBenchmarkVal')) el('chartBenchmarkVal').textContent = '…';
            return;
        }

        const data = AppState.agentChartData;
        const agents = (data && Array.isArray(data.agents))
            ? data.agents.filter(a => a.value !== null && a.value !== undefined && !isNaN(Number(a.value)))
            : [];

        if (!agents.length) {
            wrap.innerHTML = `
                <div style="text-align:center; padding:55px 20px; color:var(--muted); font-size:13px; line-height:1.7;">
                    <span style="font-size:26px; display:block; margin-bottom:8px;">📊</span>
                    <b style="color:#f8fafc;">${escapeHtml(meta.legend)}</b><br>
                    ${isArabic ? 'لا توجد بيانات لهذا المقياس ضمن الفترة المحددة.' : 'No data for this metric in the selected period.'}
                </div>`;
            if (badge) badge.textContent = I18N.t('chartAgentCountBadge', { count: 0 });
            if (el('chartBenchmarkVal')) el('chartBenchmarkVal').textContent = '—';
            return;
        }

        // نفس أبعاد/هوامش مخطط By Day (ثبات التخطيط عند التبديل)
        const count = agents.length;
        const width = 820;
        const height = 240;
        const padX = 55, padTop = 32, padBottom = 32;
        const chartW = width - padX * 2;
        const chartH = height - padTop - padBottom;

        const metricIsDuration = (metric === 'abst' || metric === 'agbt' || metric === 'lateness');
        const metricIsIdle = (metric === 'idle');
        const metricIsPercent = (metric === 'csat');
        const isDecimalMode = (AppState.timeMode || 'decimal') === 'decimal';
        const metricDisplayDivisor = (metricIsDuration && isDecimalMode) ? 60 : 1;
        const agentValues = agents.map(a => Number(a.value)).filter(v => isFinite(v));
        const agentDataMin = agentValues.length ? Math.min.apply(null, agentValues) : 0;
        const agentDataMax = agentValues.length ? Math.max.apply(null, agentValues) : 0;

        // نفس مقياس مخطط By Day تماماً (أرقام جميلة + دقة عرض تكيفية + Y ديناميكي)
        const scale = computeChartScale({
            dataMin: agentDataMin / metricDisplayDivisor,
            dataMax: agentDataMax / metricDisplayDivisor,
            baseline: (agentDataMax || 1) / metricDisplayDivisor,
            dynamic: true,
            minCap: 0,
            maxCap: metricIsPercent ? 100 : Infinity,
            fallback: 1
        });
        const minVal = scale.min * metricDisplayDivisor;
        const maxVal = scale.max * metricDisplayDivisor;
        const valRange = (maxVal - minVal) || 1;
        const chartDecimals = ((metricIsDuration && isDecimalMode) || metricIsIdle)
            ? Math.max(2, scale.decimals)
            : Math.min(2, scale.decimals);
        const fmt = v => {
            if (v === null || v === undefined || isNaN(Number(v))) return '—';
            if (metricIsPercent) return `${Number(v.toFixed(chartDecimals))}%`;
            if (metric === 'breakBreach') return breachExceedText(v); // الأساسي: دقائق التجاوز
            if (metricIsIdle) return isDecimalMode ? v.toFixed(chartDecimals) : formatDuration(v * 60);
            if (metricIsDuration) {
                if (!isDecimalMode) return formatDuration(v);
                return (v / 60).toFixed(chartDecimals);
            }
            return formatAgentMetricValue(metric, v);
        };

        const slot = chartW / count;
        const barW = Math.min(48, Math.max(8, slot * 0.62));
        const getY = val => padTop + chartH - ((val - minVal) / valRange) * chartH;

        // خطوط الشبكة + محور Y بنفس نمط/أنماط By Day
        let grid = '';
        const steps = scale.steps;
        for (let s = 0; s <= steps; s++) {
            const val = (scale.min + s * scale.step) * metricDisplayDivisor;
            const y = getY(val);
            grid += `<line x1="${padX}" y1="${y}" x2="${width - padX}" y2="${y}" stroke="rgba(148,163,184,0.12)" stroke-dasharray="3 4" stroke-width="1" />`;
            grid += `<text x="${padX - 8}" y="${y + 4}" fill="#94a3b8" font-size="10" text-anchor="end" font-family="'JetBrains Mono',monospace">${escapeHtml(fmt(val))}</text>`;
        }

        let bars = '';
        let sum = 0;
        agents.forEach((a, i) => {
            const val = Number(a.value);
            sum += val;
            const h = Math.max(3, ((val - minVal) / valRange) * chartH);
            const x = padX + i * slot + (slot - barW) / 2;
            const y = padTop + chartH - h;
            const label = fmt(val);
            const name = String(a.name || a.email || '');
            const shortName = name.length > 14 ? name.slice(0, 13) + '…' : name;
            const cx = x + barW / 2;
            const nameY = height - 10;
            // للبريك: الأساسي الدقائق، ونضيف عدد المرات في التلميح
            const barsBreach = (metric === 'breakBreach') ? parseInt(a.breaches, 10) || 0 : null;
            const titleText = (metric === 'breakBreach')
                ? name + '\n' + meta.legend + ': ' + label + '\n' + breachCountText(barsBreach)
                : name + '\n' + meta.legend + ': ' + label;
            const nameEl = (count > 9)
                ? `<text x="${cx}" y="${nameY}" fill="var(--muted)" font-size="9.5" text-anchor="end" transform="rotate(-35 ${cx} ${nameY})">${escapeHtml(shortName)}</text>`
                : `<text x="${cx}" y="${nameY}" fill="var(--muted)" font-size="10" text-anchor="middle">${escapeHtml(shortName)}</text>`;
            bars += `<g class="chart-bar-group" tabindex="0">
                <title>${escapeHtml(titleText)}</title>
                <rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="4" fill="${meta.color}" opacity="0.9"></rect>
                <text x="${cx}" y="${y - 6}" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono',monospace">${escapeHtml(label)}</text>
                ${nameEl}
            </g>`;
        });

        wrap.innerHTML = `<svg viewBox="0 0 ${width} ${height}" class="analytics-svg-chart" style="width:100%; height:auto; overflow:visible;" preserveAspectRatio="xMidYMid meet">
            ${grid}
            <line x1="${padX}" y1="${padTop + chartH}" x2="${width - padX}" y2="${padTop + chartH}" stroke="var(--border)" stroke-width="1.5"></line>
            ${bars}
        </svg>`;

        if (badge) badge.textContent = I18N.t('chartAgentCountBadge', { count: count });
        if (el('chartBenchmarkVal')) el('chartBenchmarkVal').textContent = fmt(sum / count);
    }

    // مقياس محور العرض (Presentation only): يحسب نطاق الرسم وخطواته ودقته فقط.
    // لا يلمس قيم البيانات ولا التجميع ولا أي حساب متري.
    function computeChartScale(opts) {
        const o = opts || {};
        let lo = Number(o.dataMin);
        let hi = Number(o.dataMax);
        if (!isFinite(lo)) lo = 0;
        if (!isFinite(hi)) hi = 0;
        if (hi < lo) { const t = lo; lo = hi; hi = t; }
        const baseline = (isFinite(o.baseline) && o.baseline > 0) ? o.baseline : 1;
        const targetSteps = 5;

        if (o.dynamic) {
            // نطاق ديناميكي حول البيانات مع هامش ~18% من المدى (fallback عند تطابق القيم)
            const span = hi - lo;
            const fallback = (isFinite(o.fallback) && o.fallback > 0) ? o.fallback : 1;
            const pad = span > 0 ? span * 0.18 : Math.max(Math.abs(hi) * 0.15, fallback);
            lo -= pad;
            hi += pad;
        } else {
            // محور يبدأ من الصفر (للأعمدة) مع حد أدنى مريح — لا يغيّر ارتفاع العمود النسبي
            lo = 0;
            hi = Math.max(hi, baseline);
        }

        const maxCap = isFinite(o.maxCap) ? o.maxCap : Infinity;
        const minCap = isFinite(o.minCap) ? o.minCap : -Infinity;
        lo = Math.max(minCap, lo);
        hi = Math.min(maxCap, hi);
        if (!(hi > lo)) hi = lo + (Math.abs(lo) > 0 ? Math.abs(lo) * 0.2 : 1);

        const rawStep = (hi - lo) / targetSteps;
        const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
        const norm = rawStep / mag;
        let niceNorm;
        if (norm <= 1) niceNorm = 1;
        else if (norm <= 2) niceNorm = 2;
        else if (norm <= 5) niceNorm = 5;
        else niceNorm = 10;
        const step = niceNorm * mag;

        let niceMin = Math.max(minCap, Math.floor(lo / step) * step);
        let niceMax = Math.min(maxCap, Math.ceil(hi / step) * step);
        if (niceMax - niceMin < step) niceMax = niceMin + step;
        const steps = Math.max(1, Math.round((niceMax - niceMin) / step + 1e-9));

        const stepStr = Number(step.toFixed(12)).toString();
        const dot = stepStr.indexOf('.');
        const decimals = dot === -1 ? 0 : (stepStr.length - dot - 1);
        return { min: niceMin, max: niceMax, step: step, steps: steps, decimals: decimals };
    }

    function renderSvgChart() {
        // وضع المقارنة حسب الوكيل: تجميع مختلف فوق نفس محرك الحساب
        if (AppState.chartGroupBy === 'agent') {
            updateChartDrillHint(false);
            ensureAgentsChartData();
            return;
        }
        const wrap = el('analyticsChartWrap');
        const badgeDays = el('chartActiveDaysCountBadge');
        if (!wrap) return;
        wrap.style.overflowX = '';

        if (AppState.analyticsError && !AppState.analyticsLoading) {
            wrap.innerHTML = '<p role="alert" style="padding:28px;color:var(--danger)">' + escapeHtml(AppState.analyticsError) + '</p>';
            ['secStatTotalSessions', 'secStatDailyAvg', 'secStatActiveDays', 'secStatLongSessions', 'chartBenchmarkVal'].forEach(id => {
                if (el(id)) el(id).textContent = '—';
            });
            return;
        }

        if (AppState.analyticsLoading) {
            wrap.innerHTML = `
                <div style="text-align:center; padding:55px 20px; color:var(--muted); font-size:13px; line-height:1.7;">
                    <span style="font-size:26px; display:block; margin-bottom:8px;">⏳</span>
                    ${I18N.currentLang === 'ar' ? 'جاري تحميل بيانات هذا الوكيل…' : 'Loading this agent data…'}
                </div>
            `;
            if (el('chartBenchmarkVal')) el('chartBenchmarkVal').textContent = '…';
            if (badgeDays) badgeDays.textContent = '…';
            return;
        }

        // وضع الشفت بدون نافذة موثوقة: نطلب من المستخدم تحديد البداية/النهاية بدل إنتاج نتائج غير صحيحة
        if (AppState.shiftConfigNeeded) {
            wrap.innerHTML = `
                <div style="text-align:center; padding:55px 20px; color:var(--muted); font-size:13px; line-height:1.8;">
                    <span style="font-size:26px; display:block; margin-bottom:8px;">🕒</span>
                    <b style="color:#f8fafc;">${I18N.t('chartShiftModeShift')}</b><br>
                    ${I18N.t('chartShiftNeedsConfig')}
                </div>
            `;
            if (el('chartBenchmarkVal')) el('chartBenchmarkVal').textContent = '—';
            if (badgeDays) badgeDays.textContent = I18N.t('activeDaysBadge', { count: 0 });
            return;
        }

        const chartType = AppState.currentChartTab || 'csat';
        const datePreset = AppState.chartDatePreset || 'all';
        // الوضع الافتراضي: خطي للمقاييس المئوية والزمنية، وأعمدة لحجم السيشنات
        const defaultModeForType = (chartType === 'sessions' || chartType === 'long') ? 'bar' : 'line';
        const displayMode = AppState.chartDisplayMode || defaultModeForType;
        // Drill-down مُفعّل في وضع Single Agent + By Day فقط (Lazy: لا يُطلب أي data هنا)
        const drillEnabled = !!currentAnalyticsEmail() && !AppState.chartByShift;

        if (el('btnChartModeBar')) el('btnChartModeBar').classList.toggle('active', displayMode === 'bar');
        if (el('btnChartModeLine')) el('btnChartModeLine').classList.toggle('active', displayMode === 'line');

        // مزامنة حالة الأزرار التبويبية العلوية
        document.querySelectorAll('.chart-tab-btn').forEach(btn => {
            const isCurrent = btn.getAttribute('data-chart') === chartType;
            btn.classList.toggle('active', isCurrent);
            btn.setAttribute('aria-selected', isCurrent ? 'true' : 'false');
        });

        const allRecordedDays = (AppState.chartDays && AppState.chartDays.length > 0)
            ? AppState.chartDays
            : [];

        // كل مقياس يعرض فقط الأيام التي تحمل بيانات فعلية لهذا المقياس،
        // ولا يُرسم أي يوم فارغ (يمنع الانخفاض المفاجئ للصفر في الرسم)
        let activeDays = allRecordedDays.filter(d => {
            if (chartType === 'csat') {
                const evaluated = Number(d.csatTotal) > 0 || Number(d.csatGood) > 0 || Number(d.csatBad) > 0;
                return evaluated || Number(d.csat) > 0;
            }
            if (chartType === 'abst') return Number(d.abstSecs) > 0 || Number(d.abstMins) > 0;
            if (chartType === 'agbt') return Number(d.agbtSecs) > 0 || Number(d.agbtMins) > 0;
            if (chartType === 'long') return Number(d.long) > 0 || Number(d.longSessions) > 0;
            return Number(d.sessions) > 0;
        });

        activeDays.sort((a, b) => (a.day || '').localeCompare(b.day || ''));

        if (datePreset === 'week') {
            // الأسبوع الحالي (من الاثنين إلى اليوم)
            const now = new Date();
            const dayOfWeek = (now.getDay() + 6) % 7; // Monday = 0
            const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dayOfWeek);
            const weekStart = monday.getFullYear() + '-' + String(monday.getMonth() + 1).padStart(2, '0') + '-' + String(monday.getDate()).padStart(2, '0');
            activeDays = activeDays.filter(d => d.day >= weekStart);
        } else if (datePreset === 'month') {
            // الشهر الحالي (من اليوم الأول إلى اليوم)
            const now = new Date();
            const monthStart = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-01';
            activeDays = activeDays.filter(d => d.day >= monthStart);
        } else if (datePreset === 'recent') {
            activeDays = activeDays.slice(-14);
        } else if (datePreset === 'custom' && AppState.chartStartDate && AppState.chartEndDate) {
            activeDays = activeDays.filter(d => d.day >= AppState.chartStartDate && d.day <= AppState.chartEndDate);
        }
        // 'all' → يعرض كل الأيام المتاحة بدون قصّ

        if (badgeDays) {
            badgeDays.textContent = I18N.t('activeDaysBadge', { count: activeDays.length });
        }

        // مرجع نقرات الـDrill-down: كل نقطة/بار يقابل bucket (يوم/شفت) في نفس ترتيب الرسم
        AppState.chartBuckets = activeDays.map(d => ({
            day: d.day,
            displayDay: d.displayDay || (d.day ? d.day.slice(5) : '')
        }));

        const isArabic = I18N.currentLang === 'ar';
        // ميتاداتا العرض الموحّدة (نفس المصدر المستخدم في By Agent)
        const metricMeta = chartMetricMeta_(chartType, isArabic);
        const unit = metricMeta.unit;
        const chartColor = metricMeta.color;
        const minMaxBaseline = metricMeta.minMaxBaseline;
        const subtitleText = metricMeta.subtitle;
        const legendText = metricMeta.legend;

        let values = [];
        if (chartType === 'csat') {
            values = activeDays.map(d => Number(d.csat) || 0);
        } else if (chartType === 'abst') {
            values = activeDays.map(d => d.abstMins !== undefined && d.abstMins > 0 ? Number(d.abstMins) : Math.round((Number(d.abstSecs) || 0) / 60 * 10) / 10);
        } else if (chartType === 'agbt') {
            values = activeDays.map(d => d.agbtMins !== undefined && d.agbtMins > 0 ? Number(d.agbtMins) : Math.round((Number(d.agbtSecs) || 0) / 60 * 10) / 10);
        } else if (chartType === 'sessions') {
            values = activeDays.map(d => Number(d.sessions) || 0);
        } else {
            values = activeDays.map(d => Number(d.long) || 0);
        }

        if (el('chartSubtitle')) el('chartSubtitle').textContent = subtitleText;
        if (el('chartLegendText')) el('chartLegendText').textContent = legendText;
        if (el('chartBadgeDot')) el('chartBadgeDot').style.background = chartColor;

        // الأيام الفارغة تم استبعادها مسبقاً في الفلتر، لذا يكفي فحص وجود أيام
        if (activeDays.length === 0) {
            wrap.innerHTML = `
                <div style="text-align:center; padding:55px 20px; color:var(--muted); font-size:13px; line-height:1.7;">
                    <span style="font-size:26px; display:block; margin-bottom:8px;">📊</span>
                    <b style="color:#f8fafc;">${legendText}</b><br>
                    ${isArabic ? 'لا توجد بيانات مسجلة لهذا المقياس ضمن الأيام المستوردة — يمكنك اختيار تبويب آخر لعرض الإحصائيات المتوفرة.' : 'No recorded data for this metric in the selected date range.'}
                </div>
            `;
            if (el('chartBenchmarkVal')) el('chartBenchmarkVal').textContent = '—';
            return;
        }

        const count = values.length;
        const isDurationChart = (chartType === 'abst' || chartType === 'agbt');
        const isDecimalDuration = isDurationChart && (AppState.timeMode || 'decimal') === 'decimal';
        // في الوضع العشري تُعرض المدة بالساعات
        const scaleDivisor = isDecimalDuration ? 60 : 1;

        const finiteVals = values.filter(v => isFinite(Number(v))).map(Number);
        const dataMin = finiteVals.length ? Math.min.apply(null, finiteVals) : 0;
        const dataMax = finiteVals.length ? Math.max.apply(null, finiteVals) : 0;

        // مقياس العرض فقط: نطاق ديناميكي موحّد حول البيانات مع هامش بسيط،
        // ليستخدم وضعا العمود والخط نفس أرقام Y لنفس البيانات.
        const scale = computeChartScale({
            dataMin: dataMin / scaleDivisor,
            dataMax: dataMax / scaleDivisor,
            baseline: minMaxBaseline / scaleDivisor,
            dynamic: true,
            maxCap: (chartType === 'csat') ? 100 : Infinity,
            minCap: 0,
            fallback: isDecimalDuration ? 0.01 : 1
        });
        const minVal = scale.min * scaleDivisor;
        const maxVal = scale.max * scaleDivisor;

        // دقة العرض فقط حسب خطوة المحور (فقط لجعل تغيّر القيم الصغيرة واضحاً)
        const durationDecimals = isDecimalDuration ? Math.max(2, scale.decimals) : Math.min(2, scale.decimals);

        const nonZeroValues = values.filter(v => v > 0);
        const total = nonZeroValues.reduce((a, b) => a + b, 0);
        const avgVal = nonZeroValues.length > 0 ? (total / nonZeroValues.length) : 0;

        let benchmarkText = `${avgVal.toFixed(1)} ${unit}`;
        if (chartType === 'csat') {
            benchmarkText = `${avgVal.toFixed(1)}%`;
        } else if (isDurationChart) {
            benchmarkText = isDecimalDuration
                ? (avgVal / 60).toFixed(durationDecimals)
                : formatDuration(avgVal);
        }
        if (el('chartBenchmarkVal')) el('chartBenchmarkVal').textContent = benchmarkText;

        const width = 820;
        const height = 240;
        const padX = 55;
        const padY = 32;
        const chartW = width - padX * 2;
        const chartH = height - padY * 2;
        const days = activeDays.map(d => (d.displayDay || (d.day ? d.day.slice(5) : '')));

        function getCsatColor(score) {
            // نقاط/أعمدة CSAT: أخضر عند تحقيق الهدف (≥90)، وإلا أحمر.
            return (score >= 90) ? '#0f9d6b' : '#d3385a';
        }

        function formatDisplayVal(val) {
            if (chartType === 'csat') return `${Math.round(val)}%`;
            if (isDurationChart) {
                if (isDecimalDuration) return (val / 60).toFixed(durationDecimals);
                return formatDuration(val);
            }
            return `${val}`;
        }

        // تلميح تفصيلي لكل نقطة/عمود: يوضح عدد التقييمات (CSAT إيجابي / DSAT سلبي)
        function tooltipFor(i, displayVal) {
            const d = activeDays[i] || {};
            const date = d.day || days[i] || '';
            const lines = [date + ': ' + displayVal];
            if (chartType === 'csat') {
                const good = Number(d.csatGood) || 0;
                const bad = Number(d.csatBad) || 0;
                const total = Number(d.csatTotal) || (good + bad);
                if (total > 0) {
                    lines.push(isArabic ? 'التقييمات المسجلة: ' + total : 'Evaluations: ' + total);
                    lines.push(isArabic ? 'CSAT إيجابي: ' + good + '  •  DSAT سلبي: ' + bad : 'CSAT positive: ' + good + '  •  DSAT negative: ' + bad);
                }
            } else if (Number(d.sessions) > 0) {
                lines.push(isArabic ? 'السيشنات: ' + Number(d.sessions) : 'Sessions: ' + Number(d.sessions));
            }
            return lines.join('\n');
        }

        const getX = i => padX + (count === 1 ? chartW / 2 : (i / (count - 1)) * chartW);
        const getY = val => height - padY - ((val - minVal) / (maxVal - minVal || 1)) * chartH;

        // خطوط الشبكة الأفقية بمقياس أرقام جميلة (تبدأ من scale.min وليس الصفر بالضرورة)
        let gridLines = '';
        const steps = scale.steps;
        for (let s = 0; s <= steps; s++) {
            const vDisplay = scale.min + s * scale.step;
            const v = vDisplay * scaleDivisor;
            const y = getY(v);
            let labelText = '';
            if (chartType === 'csat') labelText = `${Number(vDisplay.toFixed(scale.decimals))}%`;
            else if (isDurationChart) {
                labelText = isDecimalDuration ? vDisplay.toFixed(durationDecimals) : formatDuration(v);
            } else labelText = `${Number(vDisplay.toFixed(scale.decimals))}`;

            gridLines += `
                <line x1="${padX}" y1="${y}" x2="${width - padX}" y2="${y}" stroke="rgba(148, 163, 184, 0.12)" stroke-dasharray="3 4" stroke-width="1" />
                <text x="${padX - 8}" y="${y + 4}" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono', monospace" text-anchor="end">${labelText}</text>
            `;
        }

        // خط المتوسط المرجعي فقط. الوسم النصي أُزيل من داخل الـSVG لأنه كان يتداخل مع
        // قيم النقاط؛ المتوسط معروض أصلاً في شارة الملخص أسفل المخطط (#chartBenchmarkVal).
        const avgY = getY(avgVal);
        const avgLine = `
            <line x1="${padX}" y1="${avgY}" x2="${width - padX}" y2="${avgY}" stroke="#f59e0b" stroke-dasharray="5 5" stroke-width="1.5" opacity="0.85"></line>
        `;

        let dataElements = '';

        if (displayMode === 'bar') {
            const barW = Math.min(32, Math.max(10, (chartW / count) * 0.58));
            dataElements = values.map((val, i) => {
                const x = count === 1
                    ? padX + chartW / 2 - barW / 2
                    : padX + (i / count) * chartW + ((chartW / count) - barW) / 2;
                const bHeight = Math.max(3, ((val - minVal) / (maxVal - minVal || 1)) * chartH);
                const y = height - padY - bHeight;
                let barColor = chartColor;
                if (chartType === 'csat') barColor = getCsatColor(val);
                const displayVal = formatDisplayVal(val);

                return `
                    <g class="chart-bar-group" tabindex="0"${drillEnabled ? ` data-bucket-index="${i}" role="button" aria-label="${escPeriod(days[i] + ': ' + displayVal)}"` : ''}>
                        <title>${tooltipFor(i, displayVal)}</title>
                        <rect x="${x}" y="${y}" width="${barW}" height="${bHeight}" rx="4" fill="${barColor}" opacity="0.9"></rect>
                        ${val > 0 ? `<text x="${x + barW / 2}" y="${y - 6}" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">${displayVal}</text>` : ''}
                        <text x="${x + barW / 2}" y="${height - 10}" fill="var(--muted)" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', monospace">${days[i]}</text>
                    </g>
                `;
            }).join('');
        } else {
            // نمط المنحنى الانسيابي الناعم والمساحة المتدرجة
            const linePoints = values.map((val, i) => ({
                x: getX(i),
                y: getY(val),
                val,
                day: days[i],
                displayVal: formatDisplayVal(val)
            }));

            const pathD = linePoints.reduce((acc, pt, i) => {
                if (i === 0) return `M ${pt.x} ${pt.y}`;
                const prev = linePoints[i - 1];
                const cx = (prev.x + pt.x) / 2;
                return `${acc} C ${cx} ${prev.y}, ${cx} ${pt.y}, ${pt.x} ${pt.y}`;
            }, '');

            const fillD = `${pathD} L ${linePoints[linePoints.length - 1].x} ${height - padY} L ${linePoints[0].x} ${height - padY} Z`;

            const dots = linePoints.map((pt, i) => {
                let dotColor = chartColor;
                if (chartType === 'csat') dotColor = getCsatColor(pt.val);
                return `
                    <g class="chart-point-group" tabindex="0"${drillEnabled ? ` data-bucket-index="${i}" role="button" aria-label="${escPeriod(pt.day + ': ' + pt.displayVal)}"` : ''}>
                        <title>${tooltipFor(i, pt.displayVal)}</title>
                        <circle cx="${pt.x}" cy="${pt.y}" r="4.5" fill="${dotColor}" stroke="#0b1329" stroke-width="2" class="chart-dot"></circle>
                        ${pt.val > 0 ? `<text x="${pt.x}" y="${pt.y - 8}" fill="#f8fafc" font-size="10.5" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">${pt.displayVal}</text>` : ''}
                        ${(count <= 14 || i % 2 === 0) ? `<text x="${pt.x}" y="${height - 10}" fill="var(--muted)" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', monospace">${pt.day}</text>` : ''}
                    </g>
                `;
            }).join('');

            dataElements = `
                <path d="${fillD}" fill="url(#chartGradDynamic)" opacity="0.3"></path>
                <path d="${pathD}" fill="none" stroke="${chartColor}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
                ${dots}
            `;
        }

        wrap.innerHTML = `
            <svg viewBox="0 0 ${width} ${height}" class="analytics-svg-chart" style="width:100%; height:auto; overflow:visible;" preserveAspectRatio="xMidYMid meet">
                <defs>
                    <linearGradient id="chartGradDynamic" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="${chartColor}" stop-opacity="0.8"></stop>
                        <stop offset="100%" stop-color="${chartColor}" stop-opacity="0.0"></stop>
                    </linearGradient>
                </defs>
                ${gridLines}
                <line x1="${padX}" y1="${height - padY}" x2="${width - padX}" y2="${height - padY}" stroke="var(--border)" stroke-width="1.5"></line>
                ${dataElements}
                ${avgLine}
            </svg>
        `;

        // إشارة بسيطة أن الرسم قابل للضغط (Single Agent فقط)
        updateChartDrillHint(drillEnabled);
    }

    function getStoredRawJson() {
        if (typeof window !== 'undefined' && window.__RAW_JSON_IN_MEMORY__) {
            return window.__RAW_JSON_IN_MEMORY__;
        }
        try {
            return localStorage.getItem('gas_agent_dashboard_raw_json');
        } catch (e) {
            return null;
        }
    }

    function loadLocalPreviewMode() {
        // 1. Check for real local saved data first
        try {
            if (typeof window !== 'undefined' && window.__LOCAL_DASHBOARD_DATA_MEM__) {
                handleSheetDataSuccess(window.__LOCAL_DASHBOARD_DATA_MEM__);
                message(`✓ تم استعادة بياناتك الحقيقية (${window.__LOCAL_DASHBOARD_DATA_MEM__.agents.length} وكيل، ${window.__LOCAL_DASHBOARD_DATA_MEM__.summary.totalDrillRows} ريكورد) بنجاح 🟢.`);
                return;
            }
            const raw = localStorage.getItem('gas_agent_dashboard_local_data');
            if (raw) {
                const parsed = JSON.parse(raw);
                if (parsed && Array.isArray(parsed.agents) && parsed.agents.length > 0) {
                    handleSheetDataSuccess(parsed);
                    message(`✓ تم استعادة بياناتك الحقيقية المحفوظة محلياً (${parsed.agents.length} وكيل) بنجاح 🟢.`);
                    return;
                }
            }
        } catch (e) {
            console.warn('Error loading local preview data:', e);
        }

        // 2. Demo fallback (يُقرأ من بيئة المعاينة المحلية local-dev دون وجود أي أسماء وهمية في ملف الإنتاج)
        const mockAgents = (typeof window !== 'undefined' && Array.isArray(window.__LOCAL_PREVIEW_MOCK_AGENTS__))
            ? window.__LOCAL_PREVIEW_MOCK_AGENTS__
            : [];

        // استخدام الشهر الحقيقي ديناميكيًا (بدل تثبيت سبتمبر) حتى تظهر أسابيع الشهر كاملة بما فيها الأسبوع الخامس
        const nowD = new Date();
        const pad2 = n => String(n).padStart(2, '0');
        const fmtYm = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1);
        const ym = fmtYm(nowD);
        const prev1 = fmtYm(new Date(nowD.getFullYear(), nowD.getMonth() - 1, 1));
        const prev2 = fmtYm(new Date(nowD.getFullYear(), nowD.getMonth() - 2, 1));
        const demoDaysCount = Math.min(nowD.getDate(), 28);
        const demoDays = [];
        for (let d = 1; d <= demoDaysCount; d++) {
            const seed = (d * 17) % 100;
            demoDays.push({
                day: nowD.getFullYear() + '-' + pad2(nowD.getMonth() + 1) + '-' + pad2(d),
                sessions: 120 + seed,
                abstSecs: 65 + (seed % 30),
                agbtSecs: 190 + (seed % 60),
                csat: 80 + (seed % 18),
                long: seed % 12
            });
        }

        handleSheetDataSuccess({
            success: true,
            selectedMonth: AppState.selectedMonth || ym,
            availableMonths: [ym, prev1, prev2],
            agents: mockAgents,
            summary: { totalAgents: mockAgents.length, totalDrillRows: mockAgents.length * 7 },
            historicalDays: demoDays
        });
    }

    function buildLocalDashboardData(payload) {
        const rawResults = payload.results || (Array.isArray(payload) && payload[0]?.metric ? payload : (payload.header ? [payload] : []));
        if (!rawResults || !rawResults.length) {
            throw new Error('لم يتم العثور على أي مقاييس صالحة في ملف النتائج.');
        }

        const normalized = rawResults.map((r, idx) => ({
            agent: String(r.agent || 'مستخدم').trim(),
            metric: String(r.metric || '').toLowerCase().trim(),
            title: String(r.title || ''),
            header: Array.isArray(r.header) ? r.header : [],
            rows: Array.isArray(r.rows) ? r.rows : []
        }));

        function localDayFromRow(row, header) {
            const h = header.map(c => String(c).toLowerCase().trim());
            const dIdx = h.findIndex(c => c === 'day' || c === 'report_dt' || c.includes('date') || c.includes('shift_date'));
            if (dIdx === -1 || !row[dIdx]) return null;
            const m = String(row[dIdx]).match(/\b\d{4}-\d{2}-\d{2}\b/);
            return m ? m[0] : null;
        }

        function localTimeToSecs(v) {
            const s = String(v || '').trim();
            if (s.includes(':')) {
                const p = s.split(':');
                return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0);
            }
            const n = parseFloat(s);
            return isNaN(n) ? 0 : n * 60;
        }

        // حساب الخط الزمني العام من الصفوف الفعلية بدلاً من أرقام وهمية
        const timelineMap = {};
        function timelineEntry(day) {
            if (!timelineMap[day]) {
                timelineMap[day] = {
                    day,
                    displayDay: day.slice(5),
                    sessions: 0,
                    abstSecsSum: 0,
                    abstCount: 0,
                    agbtSecsSum: 0,
                    agbtCount: 0,
                    csatGood: 0,
                    csatBad: 0,
                    long: 0
                };
            }
            return timelineMap[day];
        }

        normalized.forEach(r => {
            const metric = r.metric;
            const header = r.header;
            const h = header.map(c => String(c).toLowerCase().trim());
            const cIdx = h.findIndex(c => c.includes('csat_adjusted') || c === 'csat' || c.includes('score'));
            const aIdx = h.findIndex(c => c === 'abst' || c.includes('basket_session_time') || c.includes('session_time') || c === 'agbt' || c.includes('basket_time'));

            (Array.isArray(r.rows) ? r.rows : []).forEach(row => {
                const day = localDayFromRow(row, header);
                if (!day) return;
                const e = timelineEntry(day);
                e.sessions++;

                if (metric === 'abst' || metric === 'agbt') {
                    if (aIdx !== -1) {
                        const secs = localTimeToSecs(row[aIdx]);
                        if (metric === 'abst') { e.abstSecsSum += secs; e.abstCount++; }
                        else { e.agbtSecsSum += secs; e.agbtCount++; }
                    }
                    if (metric === 'abst' && aIdx !== -1 && localTimeToSecs(row[aIdx]) >= 20 * 60) e.long++;
                } else if (metric === 'csat') {
                    const val = cIdx !== -1 ? String(row[cIdx] || '').toLowerCase().trim() : '';
                    if (val === 'good' || val === '5' || val === '4' || val === 'positive' || val.includes('ممتاز') || val.includes('جيد')) e.csatGood++;
                    else if (val === 'bad' || val === '1' || val === '2' || val === 'negative' || val.includes('سيء')) e.csatBad++;
                }
            });
        });

        const historicalDays = Object.keys(timelineMap).sort().map(day => {
            const e = timelineMap[day];
            const csatEval = e.csatGood + e.csatBad;
            return {
                day,
                displayDay: e.displayDay,
                sessions: e.sessions,
                abstSecs: e.abstCount > 0 ? Math.round(e.abstSecsSum / e.abstCount) : 0,
                agbtSecs: e.agbtCount > 0 ? Math.round(e.agbtSecsSum / e.agbtCount) : 0,
                csat: csatEval > 0 ? Math.round((e.csatGood / csatEval) * 100) : 0,
                csatGood: e.csatGood || 0,
                csatBad: e.csatBad || 0,
                csatTotal: csatEval,
                long: e.long
            };
        });

        const agentMap = new Map();
        normalized.forEach(r => {
            if (!r.agent) return;
            if (!agentMap.has(r.agent)) agentMap.set(r.agent, []);
            agentMap.get(r.agent).push(r);
        });

        const agents = [];
        for (const [agentName, recs] of agentMap.entries()) {
            const email = agentName.includes('@') ? agentName : `${agentName.replace(/\s+/g, '.')}@tabby.ai`;
            let displayName = agentName;
            if (email.toLowerCase().includes('ghadah.abdulrahman')) {
                displayName = 'غادة عبدالرحمن';
            } else if (agentName.includes('@')) {
                const prefix = agentName.split('@')[0];
                displayName = prefix.split('.').map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(' ');
            }

            // CSAT (نسبة الرضا - null في حال عدم وجود تقييمات لتظهر كشرطة)
            let csatGood = 0, csatBad = 0;
            recs.filter(r => r.metric === 'csat').forEach(r => {
                const h = r.header.map(c => String(c).toLowerCase().trim());
                const cIdx = findHeaderCol(h, 'csat_adjusted', 'csat', 'score', 'rating');
                r.rows.forEach(row => {
                    const val = cIdx !== -1 ? String(row[cIdx] || '').toLowerCase().trim() : '';
                    if (val === 'good' || val === '5' || val === '4' || val === 'positive' || val.includes('ممتاز') || val.includes('جيد')) csatGood++;
                    else if (val === 'bad' || val === '1' || val === '2' || val === 'negative' || val.includes('سيء')) csatBad++;
                });
            });
            const csatEval = csatGood + csatBad;
            const csatPct = csatEval > 0 ? parseFloat(((csatGood / csatEval) * 100).toFixed(1)) : null;

            // AGBT (متوسط وقت السلة بالدقائق كقيمة عشرية دقيقة)
            let agbtSum = 0, agbtCount = 0;
            recs.filter(r => r.metric === 'agbt').forEach(r => {
                const h = r.header.map(c => String(c).toLowerCase().trim());
                const aIdx = findHeaderCol(h, 'sum_basket_time_for_ticket_per_hour_min_ONLINE_WOMT', 'sum_basket_time_for_ticket_per_hour_min', 'basket_time', 'agbt');
                r.rows.forEach(row => {
                    if (aIdx !== -1) {
                        const m = parseFloat(row[aIdx]);
                        if (!isNaN(m)) { agbtSum += m; agbtCount++; }
                    }
                });
            });
            const agbtAvgMins = agbtCount > 0 ? parseFloat((agbtSum / agbtCount).toFixed(2)) : null;

            // ABST (متوسط وقت جلسة المعالجة بالدقائق كقيمة عشرية دقيقة)
            let abstSum = 0, abstCount = 0;
            recs.filter(r => r.metric === 'abst').forEach(r => {
                const h = r.header.map(c => String(c).toLowerCase().trim());
                const sIdx = findHeaderCol(h, 'basket_session_time_min', 'session_time_min', 'basket_session_time', 'session_time', 'abst');
                r.rows.forEach(row => {
                    if (sIdx !== -1) {
                        const m = parseFloat(row[sIdx]);
                        if (!isNaN(m)) { abstSum += m; abstCount++; }
                    }
                });
            });
            const abstAvgMins = abstCount > 0 ? parseFloat((abstSum / abstCount).toFixed(2)) : null;

            // Break breaches (الصفوف المخالفة فعلياً فقط)
            let breakBreaches = 0;
            let breakExceedMins = 0;
            recs.filter(r => r.metric === 'breakbreach' || r.metric === 'break_breach' || r.metric === 'break').forEach(r => {
                const h = r.header.map(c => String(c).toLowerCase().trim());
                const bIdxs = [];
                h.forEach((c, i) => { if (c === 'break exceed' || c === 'break_exceed') bIdxs.push(i); });
                r.rows.forEach(row => {
                    let numericBreaches = 0, numericMins = 0, statusBreaches = 0;
                    bIdxs.forEach(i => {
                        const s = String(row[i] ?? '').trim().toLowerCase();
                        const n = parseFloat(row[i]);
                        if (!isNaN(n) && n > 0) { numericBreaches++; numericMins += n; }
                        else if (s === 'not met' || s === 'breached' || s.includes('breach')) statusBreaches++;
                    });
                    breakBreaches += (numericBreaches > 0 ? numericBreaches : statusBreaches);
                    breakExceedMins += numericMins;
                });
            });

            // Lateness (دقائق التأخير الإجمالية بدقة عشرية 35.1)
            let latenessMins = 0;
            recs.filter(r => r.metric === 'lateness').forEach(r => {
                const h = r.header.map(c => String(c).toLowerCase().trim());
                const lIdx = findHeaderCol(h, 'exceed mins', 'exceed_mins');
                const planIdx = findHeaderCol(h, 'plan_shift_start');
                const factIdx = findHeaderCol(h, 'fact_shift_start');
                r.rows.forEach(row => {
                    if (lIdx !== -1) {
                        const m = parseFloat(row[lIdx]);
                        if (!isNaN(m) && m > 0) latenessMins += m;
                    } else if (planIdx !== -1 && factIdx !== -1) {
                        const p = new Date(row[planIdx]).getTime();
                        const f = new Date(row[factIdx]).getTime();
                        if (!isNaN(p) && !isNaN(f) && f > p) latenessMins += Math.round((f - p) / 60000);
                    }
                });
            });
            const latenessFormatted = latenessMins > 0 ? parseFloat(latenessMins.toFixed(1)) : 0.0;

            // Idle (وقت الخمول غير الإنتاجي بالساعات كقيمة عشرية 0.0)
            let idleHoursSum = 0, idleCount = 0;
            recs.filter(r => r.metric === 'idle').forEach(r => {
                const h = r.header.map(c => String(c).toLowerCase().trim());
                const iIdx = findHeaderCol(h, 'time_not_working_h', 'time_without_tickets_h', 'idle');
                r.rows.forEach(row => {
                    if (iIdx !== -1) {
                        const m = parseFloat(row[iIdx]);
                        if (!isNaN(m)) { idleHoursSum += m; idleCount++; }
                    }
                });
            });
            const idleAvg = idleCount > 0 ? parseFloat((idleHoursSum / idleCount).toFixed(1)) : 0.0;

            // Productivity (null في حال عدم توفر صفوف لتظهر كشرطة)
            let prodVal = null;
            recs.filter(r => r.metric === 'productivity').forEach(r => {
                if (r.rows && r.rows.length > 0) {
                    // إذا وُجدت صفوف للإنتاجية يمكن استخلاصها
                }
            });

            agents.push({
                name: displayName,
                email: email,
                csat: csatPct,
                csatGood: csatGood,
                csatBad: csatBad,
                csatTotal: csatEval,
                agbt: agbtAvgMins,
                abst: abstAvgMins,
                breakBreach: breakBreaches > 0 ? String(breakBreaches) : null,
                breakExceedMins: parseFloat(breakExceedMins.toFixed(2)),
                sessions: (recs.filter(r => r.metric === 'abst').reduce((s, r) => s + (r.rows ? r.rows.length : 0), 0)
                    || recs.filter(r => r.metric === 'agbt').reduce((s, r) => s + (r.rows ? r.rows.length : 0), 0)
                    || recs.filter(r => r.metric === 'csat').reduce((s, r) => s + (r.rows ? r.rows.length : 0), 0)),
                lateness: latenessFormatted,
                idle: idleAvg,
                productivity: prodVal
            });
        }

        const totalDrillRows = normalized.reduce((sum, r) => sum + r.rows.length, 0);

        return {
            success: true,
            agents: agents,
            summary: {
                totalAgents: agents.length,
                totalDrillRows: totalDrillRows
            },
            savedAt: new Date().toISOString(),
            historicalDays: historicalDays
        };
    }

    function message(text, isError = false) {
        const s = el('status');
        if (!s) return;
        s.textContent = text;
        s.style.color = isError ? 'var(--danger)' : 'var(--text-sub)';
    }

})();
</script>
